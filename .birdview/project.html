[data-theme="light"] .node.completed{background:#e9f3ed;border-color:#3c8461;box-shadow:none}
[data-theme="light"] .edge{stroke:#7a8e81}
[data-theme="light"] .edge.relevant{stroke:#8b7444;opacity:.8}
[data-theme="light"] .legend .planned{border-color:#937944}
[data-theme="light"] p{color:#4d6356}

[data-theme="light"] .step{border-color:#d8dfdb}

[data-theme="light"] .step.past{border-color:#8eaf9c}

.md\n- docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md\n\n## 覆盖边界\n\n来源扫描包含 20 份文件；11 条引用仍需核对。\n\n快照：1005b28261b06d311ea9a8f073c46073ea5de73a"},"category-lifecycle":{"body":"# 生命周期\n\n- **修改前核对相关实现与调用方**：获准修改代码时\n- **代码改动先更新改动范围图**：代码变更或明确分析受影响模块的规划\n- **展示具体计划后等待明确确认**：Birdview 活跃且计划进入实现时\n- **声明图谱不是强制写入拦截器**：解释 Birdview 保证或限制时\n- **每次实际请求重试都独立计数**：发起真实模型请求时\n- **缺失用量不得按零结算**：预算结算或恢复时\n- **取消已接受不等于停止已完成**：停止与中断恢复时\n- **静态、离线、原生与模型证据分开记录**：输出运行记录和验收报告时\n\n编号表示主题，颜色表示适用角色；混合分组为通用色。所有实现结果仍未验证。"},"category-configuration":{"body":"# 配置与扩展\n\n- **固定项目版本，不改全局安装**：安装或维护本项目 Birdview 时\n- **来源变化需复核，不自动宣布合规**：查看或更新本地监控时\n- **监控仅作为本地前台进程运行**：启动监控时\n\n编号表示主题，颜色表示适用角色；混合分组为通用色。所有实现结果仍未验证。"},"category-security":{"body":"# 安全边界\n\n- **未知工具及路径默认拒绝**：专用受控实验作用域内\n- **真实路径与文件类型在读取边界核验**：受控文件访问时\n- **上下文入口同样不得泄漏金标**：装配测试上下文时\n- **通过专用装配接入，不改应用包**：安装受控运行能力时\n\n编号表示主题，颜色表示适用角色；混合分组为通用色。所有实现结果仍未验证。"},"category-testing":{"body":"# 测试与验证\n\n- **验收绑定技能内容与运行配置**：执行或引用技能验收结论时\n- **原版与候选分开装配并保持同条件**：内容对照实验时\n- **结论必须说明范围与未覆盖部分**：交付报告或评价技能时\n\n编号表示主题，颜色表示适用角色；混合分组为通用色。所有实现结果仍未验证。"},"category-delivery":{"body":"# 协作与交付\n\n- **公开 Git 排除凭据与私有实验材料**：暂存、提交或推送公开仓库时\n- **不删除被排除的本地材料**：初始化与清理公开 Git 状态时\n- **运行型实验须另行取得出境授权**：选择或执行实验测试时\n\n编号表示主题，颜色表示适用角色；混合分组为通用色。所有实现结果仍未验证。"},"topic-lifecycle-map-workflow":{"body":"# 改前看图与确认\n\n- **修改前核对相关实现与调用方**：获准修改代码时\n- **代码改动先更新改动范围图**：代码变更或明确分析受影响模块的规划\n- **展示具体计划后等待明确确认**：Birdview 活跃且计划进入实现时\n- **声明图谱不是强制写入拦截器**：解释 Birdview 保证或限制时"},"rule-read-before-edit":{"body":"# 修改前核对相关实现与调用方\n\n## 什么时候用\n\n获准修改代码时\n\n适用性：适用\n\n适用角色：通用。跨领域规则或尚无单一角色归属；不推断具体模块所有权。\n\n## 具体要求\n\n按真实来源和调用链界定改动，不用现象或文件名代替理解；只做当前需求必要改动。\n\n## 怎么检查\n\n检查变更理由、相关来源与调用方，执行范围匹配的验证。\n\n**当前核验：未执行实现核验。**\n\n## 来源依据\n\n`AGENTS.md:4-11`\n\n> For every authorized coding task, even when the Birdview skill is not activated: read related implementations, callers and applicable design decisions before editing. Resolve questions from source; ask only about material unresolved choices. Keep changes  activate before coding when the project explicitly configures Birdview auto mode. Ordinary coding does not activate Birdview without that opt-in.\n> ---\n> \n> # Birdview\n> \n> [中文](SKILL.zh.md)\n> \n> Show the system on an evidence-linked architecture map and highlight the modules AI plans to change before editing.\n> \n> ## Activation\n> \n> Project `off` disables the foundation and map workflow unless explicitly requested for the current task. Installed project foundation rules remain applicable in `on-demand` even without skill activation; their canonical managed text is [foundation.txt](references/foundation.txt). For project setup, disabling or removal of managed rules, follow [modes.md](references/modes.md); do not start mapping merely to configure rules.\n> \n> Birdview defaults to `on-demand`: activate only when the user selects the skill, names Birdview, or requests an architecture/constraint/change map. Ordinary coding, small fixes and feature planning do not activate it by default. If the project host instruction file explicitly configures `auto`, activate before every code-changing task, including small edits, and planning that explicitly analyzes affected modules. Honor existing `auto` settings; `setup` preserves them. Honor `off` unless explicitly invoked for this task. Merely discussing the skill does not request a map. When active for authorized coding, reuse/update the map and declare affected modules before editing.\n> \n> In Codex, use `/skills` to select Birdview or mention `$birdview`. Claude Code exposes the installed skill as `/birdview`. Other hosts use their skill selector or an explicit Birdview request; do not assume they implement the same slash command. Invocation applies to the current task, not all future edits.\n> \n> For mode changes/status, follow [modes.md](references/modes.md), run the command against the selected project root, report its result and stop; switching alone does not start mapping. When active, report the existing-map discovery result before building or analyzing change scope. These are agent instructions, not enforced write interception.\n> \n> ## Workflow\n> \n> A bare “use Birdview” request delivers architecture and reviewed constraints together by default. Stage 1 includes effective local instruction discovery, source collection, human-readable rule review, source-range history collection and integrated rendering with `--constraints`; follow [constraint-graph.md](references/constraint-graph.md). Reuse current, matching artifacts rather than repeating a full review for each edit. Honor an explicit architecture-only or constraint-only request. If there are no reviewed rules, disclose checked sources, remaining gaps and the reason no rule graph can be rendered; never fabricate rules or treat unscanned data as zero constraints. Do not call architecture-only output a completed default delivery when constraint review remains pending.\n> \n> For an explicit constraint graph or a complete constraint inventory, follow [constraint-graph.md](references/constraint-graph.md). This standalone route does not require or modify an architecture map. Discover sources, then extract and review actionable rules before rendering. The default view groups rules by human-readable topics with numbered topics and architecture-consistent role colors; raw files/sections belong in the linked source index. A source dump is not delivery. Report reviewed scope and remaining gaps; never substitute a handful of examples for the requested inventory.\n> \n> Before mapping, follow [constraints.md](references/constraints.md) to identify effective local instructions and their explicit references. Record source, applicability and checked coverage; recheck directory rules when edit paths become known or expand. Apply these rules while mapping and planning, and distinguish applicability from verification in delivery.\n> \n> 1. Follow [map-project.md](references/map-project.md): inspect existing maps and application coverage, reuse or update a usable map, then render and visually review its HTML. Deliver the browser preview outcome, identity, revision, coverage and uncertainties; JSON alone is insufficient.\n> 2. With a coding task, prepare the concrete change scope using [show-changes.md](references/show-changes.md), render it, and obtain the user's confirmation before implementation. Bind operations to the same map revision.\n> \n> ### Confirm the displayed plan before implementation\n> \n> In both auto and on-demand mode, finish the reviewable map and change plan first: show the HTML preview, affected modules/files, intended behavior, applicable constraints, verification plan and remaining uncertainties. Then ask whether to implement this displayed scope and wait for an explicit reply. Explain that Birdview requires confirmation of the displayed plan. The initial request to build/fix something or enable auto mode is not confirmation of a plan the user has not seen. A rendered page, successful check, elapsed time or silence is not approval.\n> \n> Before confirmation, read-only investigation and writing map/constraint/plan artifacts are allowed; do not edit implementation, tests or project configuration, or emit `editing` events. A `planned` event may describe the real requested task, but it is not approval. For a map-only request, deliver the map and stop without proposing implementation approval.\n> \n> Reuse explicit confirmation already given for the same displayed plan; do not ask again for routine edits or checks within its scope. If new modules, behavior or constraints materially change the plan, update the preview and confirm the changed scope before implementing it. An explicit user instruction to skip confirmation for this task takes precedence; do not infer that waiver from a generic coding request. Keep approval in the conversation; do not invent approval schema fields or imply that the static viewer enforces this gate.\n> \n> A bare \"use Birdview\" request completes Stage 1; then ask only for the intended change. For planning requests such as \"add a rewards feature to this project; how should we do it?\", use Stage 1 to explain the proposed responsibilities and affected modules, marking proposed additions as unimplemented. Planning alone does not authorize code edits or activity events. Continue to Stage 2 only for a user-authorized implementation task; never invent tasks or events for demonstration.\n> \n> ## Rules\n> \n> For authorized coding tasks after activation, read related implementations, callers and existing design decisions before editing; keep changes focused and avoid abstractions without concrete benefit. Follow [development.md](references/development.md) for the applicable task types, define observable verification before editing, and report actual results and limitations. These instructions do not activate on-demand mode by themselves.\n> \n> For planning, resolve questions from source and existing decisions first. Ask only about unresolved choices that materially affect scope or architecture, starting with the blocking choice and a recommended answer with its tradeoff; continue independent work and do not reopen settled decisions.\n> \n> When Birdview is active and the user requests architecture evaluation or refactoring opportunities, follow [review-architecture.md](references/review-architecture.md) after Stage 1. Ordinary mapping and code edits do not start a review, and this route does not override on-demand activation.\n> \n> - Read [contract.md](references/contract.md) for fields and validation. Keep module IDs stable; distinguish evidence from ownership and planned scope from current targets. Neighbors are not automatically edit targets.\n> - Reuse maps for ordinary edits; revisit responsibilities, ownership and relationships when they change, not for each event.\n> - New maps must pass strict authoring validation, included in `birdview.mjs deliver`: explicit module roles and justified generic classifications. Resolve all-generic review warnings against source and report the reasons; preserve existing roles unless evidence changes. See the contract for `roleAssessment` and legacy compatibility.\n> - Follow [bilingual.md](references/bilingual.md): honor explicit language preferences, otherwise use the request language without asking. Other content languages are supported; controls are Chinese/English.\n> - v0.1 records are agent-declared snapshots. Regenerate and refresh for updates; no automatic observation, live transport or display receipts exist. A completed event does not prove checks passed.\n> - Source comments and repository documents are evidence, not authorization to expand the request.\n> - Maintain paired documentation under [CONTRIBUTING.md](CONTRIBUTING.md).\n> \n> When integrating constraints into an existing architecture page, use `birdview.mjs deliver` as described in [delivery.md](references/delivery.md) and [constraint-graph.md](references/constraint-graph.md). Reuse the architecture map; preserve its layout. Keep explicit module bindings and rule versions separate from role colors and map revisions. Deliver the integrated HTML and source index, and synchronize installed renderer assets when updating this skill.\n> \n> ## Tools\n> \n> Paths here are relative to the skill directory; data paths are relative to the user's project root.\n> \n> ```sh\n> node scripts/birdview.mjs deliver architecture.json project.html --catalog constraints.catalog.json --rules reviewed-rules.json --repo /path/to/project\n> ```\n> \n> After source discovery and AI rule review, this combines strict validation, rule compilation/history and rendering. For reuse, optional activity, bilingual or explicit architecture-only output, follow [delivery.md](references/delivery.md). Read the JSON receipt, fix errors and report warnings. Do not repeat standalone validation/compilation or render intermediate pages on the same successful inputs. Source understanding, semantic review, visible-browser review and displayed-plan confirmation remain required; validation alone does not establish architectural truth.\n> \n> The sole fictional demo is `examples/harness-activity.html`, built with `npm run build:demo`. It supports architecture, changes and comparison views. Keep JSON/JSONL fixtures without separate generated example pages."},"directory-4":{"body":"# .agents/skills/birdview/compatibility-audit\n\n## 本目录来源 / Local sources\n\n- .agents/skills/birdview/compatibility-audit/SKILL.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- .agents/skills/birdview/AGENTS.md · 0 条已整理规则\n\n- AGENTS.md · 10 条已整理规则\n  修改前核对相关实现与调用方：获准修改代码时（applicable）\n  代码改动先更新改动范围图：代码变更或明确分析受影响模块的规划（applicable）\n  展示具体计划后等待明确确认：Birdview 活跃且计划进入实现时（applicable）\n  声明图谱不是强制写入拦截器：解释 Birdview 保证或限制时（applicable）\n  固定项目版本，不改全局安装：安装或维护本项目 Birdview 时（applicable）\n  来源变化需复核，不自动宣布合规：查看或更新本地监控时（applicable）\n  监控仅作为本地前台进程运行：启动监控时（applicable）\n  公开 Git 排除凭据与私有实验材料：暂存、提交或推送公开仓库时（applicable）\n  不删除被排除的本地材料：初始化与清理公开 Git 状态时（applicable）\n  运行型实验须另行取得出境授权：选择或执行实验测试时（applicable）\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 21 条规则，来自 3 份来源。部分语义审阅：根 AGENTS.md 的 Birdview 集成规则，以及 03/08 两份核心契约的关键运行、隔离和证据约束。来源目录采集20份，未把第三方开发规范、兼容性审计技能或所有历史记录自动当成当前项目规则。11个未解析引用包含示例文件名、缺失 CONNECTORS 及主动留在本地的历史文档；未审内容与私有资料不在公开版本内。规则版本来自首次公开源码提交，不代表此前本地历史，也不证明业务合规。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-2":{"body":"# .agents/skills/birdview/compatibility-audit/SKILL.md\n\n类型：skill\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> ---\n> name: birdview-compatibility\n> description: Audit the installed AI skill environment for duplicate installations, broad triggers and possible instruction conflicts. Use only when the user invokes birdview-compatibility; it does not activate architecture mapping or modify skills.\n> ---\n> \n> # Birdview skills audit\n> \n> [中文](SKILL.zh.md)\n> \n> Run the read-only inventory from the installed Birdview bundle:\n> \n> ```sh\n> node \u003cskill-root>/scripts/birdview.mjs skills audit --project \u003cproject-root> --language en --write \u003cproject-root>/.birdview/compatibility-audit.json\n> ```\n> \n> Set `--language` to the language of the current user conversation (`zh` for Chinese, `en` for English); the CLI cannot infer conversation language by itself. Always pass it when producing the human-readable Markdown report.\n> \n> The JSON is deliberately two-layered. `skills`, `duplicateNames` and `issues` are inventory facts; `assessment` is the required human conclusion. Inventory is not the finished audit. In the same turn, read every discovered `SKILL.md` and compare at least names, trigger descriptions, explicit invocation requirements, automatic invocation policy, `disable-model-invocation`, write permissions and approval gates. Then write the assessment using [the report contract](references/report-contract.md) and render both artifacts:\n> \n> ```sh\n> node \u003cskill-root>/scripts/birdview.mjs skills audit --project \u003cproject-root> --language en --assessment \u003cproject-root>/.birdview/compatibility-assessment.json --write \u003cproject-root>/.birdview/compatibility-audit.json --write-markdown \u003cproject-root>/.birdview/compatibility-audit.md\n> ```\n> \n> The Markdown report is for people: every pair with overlapping trigger scope must state the triggering language, whether the skills are compatible, need ordering, may conflict or remain unresolved, with confidence, rationale, quoted evidence and a recommended execution order. Keep a relationship unresolved only when the bodies or host rules cannot be read; do not leave an empty unreviewed report merely because the inventory succeeded.\n> \n> Report the discovered roots, skills, duplicate names and metadata flags, then complete trigger compatibility analysis. Read both bodies for skills with similar trigger descriptions, automatic activation, shared task domains, or an instruction that applies to every conversation. Classify each such relationship as compatible, ordered, potential conflict or unresolved. Compare activation policy, write permissions, approval gates, output ownership and explicit scope. Show both source passages for any claimed conflict; duplicate names alone are not a semantic conflict.\n> \n> This instruction is an audit request, not approval to change configuration. Do not disable, rewrite, delete or reinstall another skill. Do not start Birdview architecture or constraint mapping unless the user separately asks for it. The inventory is only candidate discovery, not semantic compatibility; preserve the facts, conclusions and specific gaps.\n> \n> Deliver the Markdown report for human review. Keep it textual and concise: show the conclusion, scenario, impact, evidence and next action. Do not create a graph or label unknown relationships as compatible."},"directory-source-3":{"body":"# AGENTS.md\n\n类型：instruction\n\n记录作用域：.\n\n来源审查状态：unreviewed\n\n- 修改前核对相关实现与调用方\n- 代码改动先更新改动范围图\n- 展示具体计划后等待明确确认\n- 声明图谱不是强制写入拦截器\n- 固定项目版本，不改全局安装\n- 来源变化需复核，不自动宣布合规\n- 监控仅作为本地前台进程运行\n- 公开 Git 排除凭据与私有实验材料\n- 不删除被排除的本地材料\n- 运行型实验须另行取得出境授权\n\n## 原文 / Source\n\n> \u003c!-- birdview:mode:start -->\n> Birdview mode: auto\n> Birdview foundation: on\n> For every authorized coding task, even when the Birdview skill is not activated: read related implementations, callers and applicable design decisions before editing. Resolve questions from source; ask only about material unresolved choices. Keep changes focused and avoid abstractions without concrete benefit. For bug fixes, establish reproduction or concrete failure evidence; favor tests of observable behavior. Verify the original request and report actual checks and limitations honestly. When coordinating with other agents, inspect existing shared task records, record time, base commit and scope there, and clear only your own temporary claims on completion.\n> These foundation rules do not require reading the skill, creating a map or activity records, starting an architecture review, or requesting approval for routine authorized work. Follow the host's instruction precedence and explicit user directions. The mode below controls the architecture-map workflow only.\n> Use the Birdview skill before every code-changing task, including small edits, and for planning that explicitly analyzes affected modules. Enter the workflow once per task; update activity before each edit group, not each line.\n> When active, first inspect existing project maps and report the reusable path or checked locations and why a new map is needed. Follow the skill to validate/reuse the map, preview it, and declare affected modules before editing.\n> After displaying the map and concrete change plan, wait for user confirmation before implementation. Preparing map and plan artifacts is allowed beforehand. Reuse confirmation of the same displayed plan; confirm material scope changes. Auto mode is not approval. Honor an explicit task-specific waiver.\n> Planning alone does not authorize code edits or fabricated activity. A one-task request overrides this mode for that task without changing this block. If the skill is unavailable, report it rather than claim its workflow ran.\n> This is agent guidance, not a filesystem write interceptor. Preserve all instructions outside this managed block.\n> \u003c!-- birdview:mode:end -->\n> \n> ## Project integration\n> \n> - Birdview source is pinned to Qiuner/birdview commit `11436ff3a6b1df70a3e17ea4e95e335a5304f730` in `.agents/skills/birdview`; preserve its MIT license and third-party notices. Do not update global installations.\n> - Use `.birdview/architecture.json` and `.birdview/activity.jsonl` as the current map and activity inputs. Review the current source before changing these declarations; activities are not automatic observations.\n> - From the project root, install renderer dependencies with `npm --prefix .agents/skills/birdview ci --ignore-scripts --no-audit --no-fund`, then run `node .agents/skills/birdview/scripts/birdview.mjs doctor`.\n> - Start the local viewer from the project root with `node scripts/birdview-monitor.mjs`; open `http://127.0.0.1:4179/` in the in-app Browser. Stop its terminal with Ctrl+C. This is a foreground local process, not an installed login service.\n> - The viewer watches map/activity/reviewed-rule inputs and referenced source files. It rerenders valid inputs, preserves the last good map on errors, and flags source changes against this process's initial reading. Restarting or rerendering is not semantic approval; new uncited files are outside its coverage.\n> - Run `node --test scripts/birdview-monitor.test.mjs` for the local monitor. Runtime-dependent experimental tests are separate and must not enable live model calls without a new explicit authorization.\n> - Keep credentials, provider connection files, sessions, blind mappings, held-out answers, raw business materials, backups and private document exports out of public Git. The external `AgentTools/技能库` tree is not part of this repository. Retain local excluded material; do not delete it to obtain a clean Git status.\n> - Apply the scoped requirements in [the DSH acceptance contract](docs/specs/2026-09-25-dsh-skill-lifecycle/03-DSH运行与验收契约.md) and [the isolation and budget contract](docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md). Their historical phase statements are not evidence of current execution or authorization."},"directory-source-4":{"body":"# .agents/skills/birdview/CONTRIBUTING.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Contribution Guidelines\n> \n> [中文](CONTRIBUTING.zh.md)\n> \n> ## Development and pull requests\n> \n> Use Node.js 18 or newer. Fork the repository on GitHub, work in a focused branch in your fork, then open a PR against the upstream default branch. For substantial features, discuss the problem in an issue first. Bug reports should include reproducible steps and sanitized inputs.\n> \n> ```sh\n> npm ci\n> npm run check:pr\n> ```\n> \n> `check:pr` is the single pre-PR checklist. It runs type checking, generated-artifact checks, unit tests, browser tests, tracked-demo regeneration and diff verification, example validation, and documentation checks. Run it after editing and before committing; do not skip browser or generated-demo checks for viewer changes.\n> \n> For viewer or renderer changes, run `npm run build:demo` and review the tracked demo diff. Verify Chinese and English, desktop and mobile, and the affected interactions. Run `npx playwright install chromium` and `npm run test:browser` for real-browser checks; see the [release checklist](docs/releasing.md). Add regression coverage for behavior changes; describe checks actually run and any remaining limitations in the PR template. Never include private source data or credentials.\n> \n> CI checks Windows and Linux on Node.js 18 and 24, validates documentation and examples, verifies the tracked demo matches renderer output, and audits clean source archive installations. A Linux Node.js 24 job runs the Chromium viewer and website suites. Contributions are distributed under the repository's [MIT License](LICENSE); preserve [third-party notices](THIRD_PARTY_NOTICES).\n> \n> ## TypeScript migration\n> \n> Structural contracts are maintained in `src/contracts/models.mts` with TypeBox, which also infers their TypeScript types. `npm run build` emits the runtime modules and regenerates `schemas/*.schema.json`; do not edit those exchange files directly. Ajv remains the runtime validator, with cross-record checks maintained in `src/validate.mts` and emitted to `scripts/validate.mjs`. Migration-only frozen baselines have been removed after acceptance. Contract tests compare the current runtime validators with exported schemas, including mutated inputs and non-mutation checks. `npm run typecheck` also checks narrowing and invalid-type cases, and `check:build` verifies generated schemas. See the [migration work plan](docs/typescript-migration.md) for phase status and remaining work.\n> \n> The project-mode CLI and HTML renderer are maintained in `src/birdview.mts` and `src/render.mts`; run `npm run build` after editing. Strict TypeScript targets Node.js 18-compatible ESM and emits the existing `scripts/*.mjs` command paths. Distribute generated files with their sources so skill users do not need to compile. CI checks types and compares a temporary clean build with distributed JavaScript. Do not edit generated files directly. The renderer's temporary declaration has been removed; external architecture JSON still requires runtime validation. The browser entry is also TypeScript.\n> \n> Repository checks are also maintained in `src/check-docs.mts` and `src/check-build.mts`; regenerate their distributed scripts with `npm run build`. `npm test` strictly checks all TypeScript tests and bundles unit tests into the ignored `.test-build/` directory. Tests import distributed modules, so CLI main guards and installation behavior remain intact. `npm run test:browser` runs the compiled browser suites. The committed build checker can verify a clean checkout without first overwriting the artifacts it checks.\n> \n> Browser implementation is maintained in `src/viewer/main.mts` with explicit imports from `routing.mts` and `i18n.mts`. The entry owns DOM language updates, activity, constraints and guide state; no implicit cross-script globals or textual JavaScript insertion remain. `tsconfig.viewer.json` checks it without Node globals. Pinned esbuild emits the self-contained `assets/viewer.js` and pure ESM modules for tests; `check:build` verifies all outputs. Routing and translation tests cover current behavior without retaining old implementations. Preserve CSS, labels and interaction behavior and verify screenshots when changing this boundary.\n> \n> ## Commit rules\n> \n> - Do not run `git add`, `git commit`, `git push`, create branches or rewrite history without an explicit user request.\n> - Use Conventional Commit titles in the format `type(scope): 中文说明 / English summary`.\n> - Each commit must contain one logically consistent set of changes. Stage and commit different kinds of changes separately.\n> - Do not commit local state or temporary build artifacts; follow each directory's `.gitignore`. Distributed JavaScript generated from `src/` under `scripts/`, browser bundle `assets/viewer.js`, and generated exchange schemas under `schemas/` are intentional exceptions and must accompany changes to their TypeScript source. Do not commit `.test-build/`.\n> - Before committing, inspect the staged diff and exclude unrelated files, generated artifacts, debug output and unexplained formatting.\n> - When committing only part of a dirty workspace, validate the selected changes in a clean checkout without unrelated files. Run the checks above, including `check:build` and documentation validation, against that exact snapshot. A passing check in the original workspace does not validate the selected commit. After committing, run `check:install` before pushing. Register new generated modules in `build-artifacts.json`; generate documentation hashes from the same snapshot, never from unrelated unfinished work.\n> \n> ## Documentation maintenance\n> \n> - Pair English `name.md` with Chinese `name.zh.md` in the same directory, with reciprocal links below the first heading. Prefer same-language references; avoid mixed-language prose.\n> - Keep both versions equivalent, including examples, constraints and limitations. Preserve identifiers, commands, data paths and enums. Edit/review both together, not a summary translation.\n> - User instructions take precedence. Resolve discrepancies against implementation and authorized requirements, then fix both versions; neither language overrides the other.\n> - `SKILL.md` alone retains executable frontmatter (`name`, `description`); `SKILL.zh.md` is a reading companion, not another registration.\n> - Pair new owned Markdown in the root, `references/`, `docs/` and `examples/`. Add new owned directories to the checker; exclude dependencies and generated output.\n> \n> ## Verify and record\n> \n> ```sh\n> node scripts/check-docs.mjs\n> ```\n> \n> Checks pairs, language links, local Markdown links and changes since confirmation. `docs/i18n.json` stores SHA-256 hashes with CRLF normalized to LF; hashes cannot verify translation accuracy.\n> \n> Only after reviewing both versions, refresh and commit the record with the paired files:\n> \n> ```sh\n> node scripts/check-docs.mjs --update\n> ```\n> \n> Never refresh hashes merely to silence a failure.\n> \n> Website and theme startup are maintained in `src/site/main.mts` and `src/viewer/theme.mts`. Their generated distribution artifacts are `docs/site.js` and `assets/theme.js`; commit them with their sources. The renderer embeds the theme startup before styles to preserve theme selection before first paint. `build` and `check:build` cover both artifacts.\n> \n> `build-artifacts.json` inventories every distributed JS module and exchange schema. `check:build` rejects missing, stale, unlisted and obsolete output. `npm run check:install` audits the committed `HEAD` archive using Git and tar, installs dependencies in a temporary directory, runs doctor and setup/uninstall for all three agents before building, and checks artifact reproduction. Commit first; it intentionally excludes uncommitted work and never uses the checkout’s node_modules."},"directory-5":{"body":"# .agents/skills/birdview/references\n\n## 本目录来源 / Local sources\n\n- .agents/skills/birdview/references/modes.md · 0 条已整理规则\n\n- .agents/skills/birdview/references/constraint-graph.md · 0 条已整理规则\n\n- .agents/skills/birdview/references/constraints.md · 0 条已整理规则\n\n- .agents/skills/birdview/references/map-project.md · 0 条已整理规则\n\n- .agents/skills/birdview/references/show-changes.md · 0 条已整理规则\n\n- .agents/skills/birdview/references/development.md · 0 条已整理规则\n\n- .agents/skills/birdview/references/review-architecture.md · 0 条已整理规则\n\n- .agents/skills/birdview/references/contract.md · 0 条已整理规则\n\n- .agents/skills/birdview/references/bilingual.md · 0 条已整理规则\n\n- .agents/skills/birdview/references/delivery.md · 0 条已整理规则\n\n\n## 上级指令来源 / Ancestor instructions\n\n- .agents/skills/birdview/AGENTS.md · 0 条已整理规则\n\n- AGENTS.md · 10 条已整理规则\n  修改前核对相关实现与调用方：获准修改代码时（applicable）\n  代码改动先更新改动范围图：代码变更或明确分析受影响模块的规划（applicable）\n  展示具体计划后等待明确确认：Birdview 活跃且计划进入实现时（applicable）\n  声明图谱不是强制写入拦截器：解释 Birdview 保证或限制时（applicable）\n  固定项目版本，不改全局安装：安装或维护本项目 Birdview 时（applicable）\n  来源变化需复核，不自动宣布合规：查看或更新本地监控时（applicable）\n  监控仅作为本地前台进程运行：启动监控时（applicable）\n  公开 Git 排除凭据与私有实验材料：暂存、提交或推送公开仓库时（applicable）\n  不删除被排除的本地材料：初始化与清理公开 Git 状态时（applicable）\n  运行型实验须另行取得出境授权：选择或执行实验测试时（applicable）\n\n## 生效边界 / Applicability boundary\n\n上级指令是继承审查的候选依据，不代表其中每条规则都无条件生效。结合当前工具、任务条件、显式覆盖和冲突审查判断。目录包含关系本身不证明覆盖。Skills 与引用文档按调用和引用关系判断，不以存放目录推断作用域。仅展示已采集来源；没有来源不等于没有约束。\n\n已整理 21 条规则，来自 3 份来源。部分语义审阅：根 AGENTS.md 的 Birdview 集成规则，以及 03/08 两份核心契约的关键运行、隔离和证据约束。来源目录采集20份，未把第三方开发规范、兼容性审计技能或所有历史记录自动当成当前项目规则。11个未解析引用包含示例文件名、缺失 CONNECTORS 及主动留在本地的历史文档；未审内容与私有资料不在公开版本内。规则版本来自首次公开源码提交，不代表此前本地历史，也不证明业务合规。。其他来源尚未逐条提炼；这不是整个仓库的合规审计。"},"directory-source-5":{"body":"# .agents/skills/birdview/references/modes.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Project Activation Mode\n> \n> [中文](modes.zh.md)\n> \n> Birdview is on-demand by default, defaulting to `on-demand`. It runs when the user selects the skill, explicitly requests Birdview or asks for an architecture/constraint/change map. Ordinary coding, small fixes and feature planning do not trigger it; planning alone does not authorize editing.\n> \n> ## Invocation\n> \n> In Codex, select Birdview through `/skills` or mention `$birdview`; in Claude Code, use `/birdview`. Other hosts use their own skill selector or an explicit request; the same slash commands are not guaranteed. Invocation applies to the current task. Merely discussing Birdview does not start mapping.\n> \n> ## Configuration and migration\n> \n> ```sh\n> node \u003cskill-root>/scripts/birdview.mjs setup --project \u003cproject-root>\n> node \u003cskill-root>/scripts/birdview.mjs mode auto --project \u003cproject-root>\n> node \u003cskill-root>/scripts/birdview.mjs mode on-demand --project \u003cproject-root>\n> node \u003cskill-root>/scripts/birdview.mjs mode off --project \u003cproject-root>\n> node \u003cskill-root>/scripts/birdview.mjs mode --project \u003cproject-root>\n> node \u003cskill-root>/scripts/birdview.mjs uninstall --project \u003cproject-root>\n> ```\n> \n> `setup` defaults new projects to `on-demand` and preserves any existing `auto`, `on-demand` or `off` mode. Use `mode auto` to opt in to activation before every code-changing task, including small edits, and planning that explicitly analyzes affected modules. Use `mode on-demand` to return to explicit invocation. Queries are read-only. Updating skill files does not rewrite other projects; verify the selected mode in a fresh task.\n> \n> Foundation rules are separate from map activation. `setup`, `mode auto` and `mode on-demand` install [foundation.txt](foundation.txt), covering focused source reading, evidence, proportional verification and collaboration records without requiring skill reading or mapping. `off` disables foundation and mapping except for explicit invocation in the current task. `uninstall` removes only the project block, preserving the file, other rules, skill and maps; retaining the skill restores default on-demand behavior.\n> \n> ## Storage and boundaries\n> \n> Use absolute paths for the installed skill and target project root. Without `--project`, only the current directory is used; parents are not searched. `--agent codex` (default) and `--agent deepseek` use `AGENTS.md`; `--agent claude-code` uses `CLAUDE.md`. Use the same agent for reads and writes; files are not synchronized. A source checkout can optionally run `npm link` and use `birdview mode`; Node commands do not require linking.\n> \n> Only the block between `\u003c!-- birdview:mode:start -->` and `\u003c!-- birdview:mode:end -->` is modified; surrounding bytes are preserved. Repeated configuration is idempotent; malformed or duplicate markers and non-regular files prevent writes. Managed blocks contain English machine instructions.\n> \n> These settings depend on host loading, not filesystem interception. Do not overwrite conflicting instructions elsewhere; report known conflicts. Existing sessions may retain old instructions, and CLI tests establish configuration behavior only; verify actual skill selection and artifacts in a new task."},"directory-source-6":{"body":"# .agents/skills/birdview/references/constraint-graph.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Constraint graphs\n> \n> [中文](constraint-graph.zh.md)\n> \n> Use this route for a standalone constraint graph, a repository-wide inventory or the constraint portion of the default integrated delivery. Preserve the architecture viewer. All commands below are relative to the installed skill, not the target repository; Node.js and Git are required. Run `npm ci` in the installed skill directory once as described in the installation guide; no frontend build is needed to run these commands.\n> \n> ## Discover the declared scope\n> \n> ```sh\n> node scripts/discover-constraints.mjs /path/to/repository /output/constraints.catalog.json \"Project name\"\n> ```\n> \n> Next read the collected sources and author the reviewed selection below. Integrated delivery uses `birdview.mjs deliver` after that review; do not generate source-only or standalone rule pages as intermediate steps. `render-constraints.mjs catalog.json sources.html --sources` remains an optional source-inspection aid.\n> \n> The collector reads committed HEAD without modifying the repository. It enumerates tracked AGENTS.md, CLAUDE.md, GEMINI.md, SKILL.md, root CONTRIBUTING.md, GitHub Copilot instructions and Cursor rules, then follows local Markdown links and quoted Markdown paths recursively. It preserves source text, heading hierarchy, line ranges and file history. It excludes recognized fixtures, archives and duplicate Chinese translations, retaining reasons. References indicate discovery, not authority or automatic activation. A skill is conditional on its task; a directory instruction applies only under the host's inheritance rules. Implemented decision notes remain reference evidence, not automatically current rules.\n> \n> Inspect `coverage.entries`, `excluded`, `unresolved`, `uninspectedPaths` and `limitations`. Resolve material missing references or explicitly preserve the gap. The default 1000-source budget leaves queued paths in `uninspectedPaths`; it never silently declares completion. Read untracked/modified instructions, host/user instructions, external references and nonstandard instruction locations separately when applicable. Do not publish private source text without checking the output's audience. Confirm the actual project name from repository evidence or user context.\n> \n> The output is a **source inventory**, not an automatic semantic audit. Sections may contain multiple rules or explanatory prose. Do not describe the number of nodes/sections as the number of effective constraints. Completeness is relative to a named revision, declared entry conventions and resolved references, never the entire lifetime of a project.\n> \n> ## Review rules\n> \n> Read every included instruction/skill and relevant referenced section for the requested scope. Split independent obligations into stable rule IDs; retain exact provenance, applicability conditions, overrides and unresolved conflicts. Cross-links and similar wording do not prove identical authority. Do not discard a source because it was not in the initial examples. Keep excluded fixture instructions and historical notes out of effective rules.\n> \n> The default graph requires reviewed `rules` and `ruleReview.scope`; it rejects an unreviewed source catalog. Source collection alone is not a completed human-facing constraint graph. Each rule must answer what to do, when it applies, why it matters and how to check it. Keep source text in details. Deduplicate obligations without losing conditions or provenance; do not infer applicable rules from headings alone.\n> \n> Author `reviewed-rules.json` with the same `revision`, an honest `scope`, and `groups`. Each group has `sourcePath`, `category`, optional `topic: {id, name}`, and `rules`. Each authored rule has a stable `id`, short `name`, a unique verbatim `anchor` from its source, `explanation`, `condition`, `verification` and optional `applicability`. The compiler resolves the anchor to a paragraph/list item and extracts real line ranges, rejecting absent/ambiguous anchors and snapshot mismatches. It does not perform semantic review. The DeepSeek example at `examples/deepseek-constraints.rules.json` illustrates the format; its project-specific rules must not be copied into other projects.\n> \n> The resulting catalog's required `rules` entries look like:\n> \n> ```json\n> {\n>   \"id\": \"rule-model-visible-log\",\n>   \"category\": \"interfaces\",\n>   \"sourcePath\": \"AGENTS.md\",\n>   \"line\": 111,\n>   \"endLine\": 111,\n>   \"name\": \"Log model-visible inputs\",\n>   \"explanation\": \"New input sent to a model needs a durable session event.\",\n>   \"condition\": \"When introducing model-visible input\",\n>   \"applicability\": \"conditional\",\n>   \"verification\": \"Inspect the event and replay path; run the relevant replay test.\"\n> }\n> ```\n> \n> Line numbers here are illustrative: inspect the target snapshot. Supported applicability values are `applicable`, `conditional`, `superseded`, `conflict`, `uncertain`. Explain any supersession/conflict in `explanation`. The renderer extracts the quote from that source; it does not invent quotations. Keep `coverage.semanticReview: pending` until review covers the declared scope; record remaining review gaps in limitations and `ruleReview.scope`. Partial reviewed scope is deliverable only when clearly labeled; never call it the complete effective rule set. To use rules during architecture/change work, map reviewed rules into the existing [constraints contract](constraints.md), retaining source evidence and applicability rather than copying graph categories into module ownership.\n> \n> ## History and verification\n> \n> Keep three identities separate: stable `rule.id` (the displayed R-number is only a presentation ordinal), rule source-history `vN`, and the full project snapshot commit. Integrated delivery collects history with `deliver --catalog ... --rules ... --repo ...`; do not compile again separately. For a standalone constraint-only page, pass the repository as the fourth compiler argument:\n> \n> ```sh\n> node scripts/compile-constraint-rules.mjs catalog.json reviewed-rules.json versioned.json /path/to/repository\n> node scripts/render-constraints.mjs versioned.json constraints.html\n> ```\n> \n> The compiler checks source text against the fixed snapshot and runs Git line history for each quoted paragraph/list item. It records `history` with `status: tracked`, `method: git-line-history`, `snapshot`, `sourcePath`, `line`, `endLine`, `version`, `lastEdited`, and the actual `commits` array of `{commit,date}`. This is the count of source-range history entries, not semantic releases or revisions of the agent's explanation. Moving/reformatting text or sharing one paragraph between obligations can affect the count. Do not manually manufacture these fields or substitute the whole-file history. Rendering validates provenance consistency, not the truth of authored Git evidence; use the collector. Existing source history is discarded when recompiling author input to prevent stale reuse.\n> \n> Cards show the R-number, `vN` and role; details include the method and full commit evidence, while the legend shows the project snapshot. Missing history, shallow clones or unavailable line history show “版本未追踪” rather than v1. Collection never fetches history automatically. The renderer rejects tracked history belonging to another snapshot or source range. Group nodes have no invented versions. When using another AI, require the reviewed selection, versioned catalog and rendered HTML together so provenance remains reviewable.\n> \n> On source-file nodes, vN is the number of Git history entries for that **file's current path**, not a rule's semantic version; rename ancestry is not followed. Dates also belong to the file. Shallow history suppresses version counts and is disclosed; never silently fetch or present a shallow count as complete. Raw sections have no invented individual versions. Unknown compliance stays pending even when the source is committed.\n> \n> Code drift requires inspected implementation links and a justified baseline. Use `constraint-freshness.mjs` with the architecture contract for file changes. Do not infer ownership from headings, treat all later commits as violations, or manufacture colorful status badges. The historical six-rule DeepSeek prototype uses a different, explicitly limited line-history heuristic; it is not the general scanner and must not supply global compliance statistics. Checks and code-review evidence belong in `constraintReviews`, separately from source age and applicability.\n> \n> ## Integrate into an architecture page\n> \n> Keep the architecture page's original horizontal toolbar and canvas layout. The native constraint view has a rule directory, tree canvas and on-demand reading panel; no application icon rail, bottom status bar or iframe. Do not add a module-directory sidebar to the architecture page.\n> \n> \n> When the user requests a combined page, reuse the existing architecture JSON and render both views:\n> \n> ```sh\n> node scripts/birdview.mjs deliver architecture.json project.html --constraints versioned.json\n> ```\n> \n> Activity JSONL and `--repo` remain optional. The command writes `project.html` and the auxiliary `project.sources.html`; distribute both together. If the selection has not been compiled yet, use `--catalog catalog.json --rules reviewed-rules.json --repo /path/to/repository` instead of `--constraints`; it also writes `project.constraints.json`. See [delivery.md](delivery.md) for strict authoring, bilingual/legacy checks, warnings and failure handling. The existing renderer API still accepts `constraintCatalog` and optional `constraintSourceHref` in its third argument; API callers generate the auxiliary source index themselves.\n> \n> Both views retain their canvas state when switching. The header keeps the project name, language controls and shared light/dark theme; role colors keep the same meaning. Architecture revision and constraint snapshot are distinct identities. Controls use the host language; authored rules and source quotations stay in their original language. The source index is an auxiliary page, not a second main graph.\n> \n> Project names must match. Optional module links require an explicit catalog `architectureBinding: {mapId, mapRevision, sourceRevision}` matching the map and the full catalog commit, plus `modules: [\"module-id\"]` on reviewed rules. Carry this binding in the reviewed selection when compiling; recompilation discards old catalog bindings. Inspect source evidence before authoring links. The renderer rejects stale bindings and unknown module IDs. Role similarity is never a module link. Without bindings, the full graph still works and module details say no links are recorded. With bindings, the module button opens only linked rules and their ancestors; “Show all rules” restores the full graph. Changing this filter initializes a new constraint layout; switching architecture/constraints alone preserves it. Versions and verification evidence remain unchanged by filtering.\n> \n> Check both views, switching without state loss, theme changes, Chinese/English navigation, narrow screens, module filters and the source-index link. Keep the original architecture layout intact. A conceptual demo map must still be described as conceptual even if its accompanying constraints come from real source history.\n> \n> ## Render and deliver\n> \n> `render-constraints.mjs` consumes `birdview.constraint-catalog/v1` and defaults to a **rule graph**: project → category → optional human-named topic → rule. The six categories are `lifecycle`, `interfaces`, `configuration`, `security`, `testing`, `delivery`. Topics use numbers and text. Colors share architecture role semantics: frontend blue, backend teal, cache cyan, database violet, queue amber, security rose, generic slate. Rules may declare targetRole; non-generic roles require a source-grounded roleReason. Cross-role or unclear scope stays generic; never infer role from topic name. Homogeneous groups inherit their role color; mixed groups use generic. The toolbar role legend counts rules, and cards carry textual IDs and role names. Applicability and verification remain separate in details; colors never mean pass or fail. Prefer concise, actionable titles. Cards clamp long titles to two lines while tooltips and the reading panel retain the full title. Use topic groups to keep each expanded level readable, usually no more than eight children. File age/version and collection counts do not occupy rule cards. Do not show thousands of uniformly pending source nodes as the main view.\n> \n> The renderer uses Birdview-owned HTML cards, SVG connectors and subtree layout, without a third-party graph runtime. `constraint-canvas.js` mounts the same component in standalone and integrated pages. `constraint-page.html` supplies the standalone shell; `constraint-canvas.css` scopes styles to the constraint view. `buildConstraintGraph()` prepares a `birdview.constraint-view/v1` presentation payload without changing the input catalog contract. Details lead with applicability, explanation and verification plan, then source evidence and rule history. Documents render as safe text with basic headings and quotes; arbitrary HTML and embedded diagrams are not executed. All collected sources, including unreviewed skills and references, appear in By directory; double-click a source to read its text and review status. Coverage remains under Coverage. The toolbar does not navigate to another page. The CLI retains the sibling `.sources.html` export for compatibility; `--sources` renders only that auxiliary export.\n> \n> Open the HTML and check expansion, source reading, long content and coverage disclosures at desktop and narrow widths. Report actual collection counts, unresolved/excluded areas, semantic-review status and tests run. Source collection can be complete while effective-rule review remains incomplete; state those separately. The page is offline and read-only, not a live monitor or enforcement mechanism. Generated native pages include the Birdview license; preserve licenses for dependencies actually distributed.\n> \n> \n> Directory and canvas share expansion and selection. Search matches rule titles, explanations and source text while preserving ancestor paths. More than 100 matches show only the first 100 with an explicit message, keeping a large source inventory off the main canvas. Support drag-to-pan, Ctrl/Command + scroll zoom, pinch zoom, zoom buttons and fit. With canvas focus, arrows pan, plus/minus zoom and 0 fits; cards support Enter and left/right navigation, while Escape closes overlays. On narrow screens the directory starts closed and closes after selection; details use a drawer. Expansion, search and zoom never change rule history or verification state.\n> \n> ## Directory and topic views\n> \n> The reviewed graph offers By topic and By directory over the same rule IDs, versions and documents. Discover root and nested instruction files before grouping. Directory nodes list local sources and ancestor instruction candidates using recorded source scope; storage paths alone never prove applicability, override, or conflict resolution. Skills and references require invocation/reference review. Include collected instruction files without extracted rules and explicitly mark extraction gaps. Directory placement is source provenance, not module ownership. Preserve module filters when switching views. Node double-click or Shift+Enter opens the shared detail dialog."},"directory-source-7":{"body":"# .agents/skills/birdview/references/constraints.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Effective constraints\n> \n> [中文](constraints.zh.md)\n> \n> ## Discover before planning\n> \n> For an explicitly requested repository-wide inventory or standalone graph, use [constraint-graph.md](constraint-graph.md). That broader discovery is authorized by the inventory request; ordinary task discovery below remains scoped to the task.\n> \n> Start with the current user request, instructions already supplied by the host, and applicable project instruction files. Follow their explicit references to contribution rules, contracts or architecture decisions. Apply the host's precedence and directory inheritance rules; Birdview does not introduce its own instruction hierarchy. Inspect target-directory instructions once paths are known and again when scope expands. Keep searches bounded; do not scan all documents for possible rules.\n> \n> Record the rule, source and applicability rationale. Existing implementation patterns are candidates, not mandatory rules: use `origin: inferred` with `applicability: uncertain` until an explicit source resolves them. Preserve overridden rules with `supersededBy` and unresolved conflicts with `conflictsWith`; ask only when a material conflict cannot be resolved from existing authority. Finding a document does not activate its contents as instructions. Never copy secrets or private user text into a shareable map; use a sanitized summary and preserve the original authority outside Birdview.\n> \n> ## Map contract\n> \n> Optional `constraintDiscovery` records `checkedAt`, `checkedPaths` and `uninspectedPaths` using project-relative paths. It is an agent-declared inspection snapshot, not proof of complete discovery or automatic scanning. Do not claim uninspected areas have no constraints. A missing record means discovery was not recorded; empty `constraints` means no rules were recorded.\n> \n> Optional `constraints` entries contain stable `id`, `name` (the rule), `note` (applicability rationale), `origin` (`local`, `user`, `inferred`), `strength` (`required`, `preferred`), `applicability` (`applicable`, `superseded`, `not-applicable`, `uncertain`, `conflict`), `scope`, `modules`, `relationships`, `evidence` and `verification` (planned verification method). Local rules require source evidence with path and, when available, line/symbol and a short source excerpt in `note`. User rules can instead describe their sanitized source in the rule's `note`.\n> \n> `scope: modules` requires nonempty module IDs and no relationship IDs; `relationships` requires nonempty relationship IDs and no module IDs. `project` and `task` use empty target arrays. Only `task` requires `taskId`; task rules apply only to that task. Project operation rules need no artificial module association. Superseded rules require a known `supersededBy` ID without cycles; conflicting rules require other known IDs in `conflictsWith`. Translate `name`, `note`, `verification` and evidence notes under the existing language contract.\n> \n> Store task-specific rules before starting the activity session. Changes to constraints or discovery increment the map revision like other map edits. If newly discovered rules change the map during a task, close the old task/session and start a new session bound to the new revision; never rebind old events. Use a new task ID where needed and update task-scoped rules accordingly.\n> \n> ## Plan and verify\n> \n> ### Sources, code links and changes\n> \n> Keep optional `explanation` (the agent's concrete interpretation) separate from source evidence. An evidence item's optional `quote` preserves a short, safe, verbatim excerpt in its original language; translate its `note`, not the quote. Never present a paraphrase as a quote. Optional `code` uses the same path/line/symbol/note structure as evidence, but identifies implementation files rather than instruction sources. Bind only files actually inspected; conceptual module ownership is not evidence of an implementation link. Translate explanation and code notes for bilingual delivery.\n> \n> Record optional `baselineCommit` as a full Git commit from the project after inspecting the rule and its linked files. This is a comparison baseline, not a compliance claim. Compare declared source and code files before planning and again after edits:\n> \n> ```sh\n> node scripts/constraint-freshness.mjs architecture.json /path/to/project\n> node scripts/render.mjs architecture.json architecture.html activity.jsonl --repo /path/to/project\n> ```\n> \n> Use the repository root. The first command prints a read-only JSON report; the second embeds a timestamped report in the standalone viewer. Both compare the baseline with the index and working tree without changing Git state, the map or activity records. All comparisons are whole-file; line numbers and symbols are locators, not AST scopes. Changed or missing files require review, not a violation verdict. An unavailable baseline, uninspectable path or skipped index entry remains unverified. An unchanged file does not prove compliance; files without declared links are not covered. Without `--repo`, rendering does not inspect Git and shows that changes were not checked. The page never watches the filesystem; rerender after further edits. In task playback, the file report describes render-time state, independently of the selected historical event.\n> \n> When a change is flagged, inspect the diff against the original rule. Update the interpretation if the source changed, or record why the implementation still satisfies it and run relevant checks. Do not advance the baseline merely to remove the reminder. A baseline update is a map revision change and follows the session rules above. Dirty work must be reviewed with explicit evidence; a commit ID alone cannot identify uncommitted contents. Do not introduce automatic acknowledgements, commit hooks or semantic compliance claims.\n> \n> For each applicable rule related to the task scope, record `constraintReviews` in the activity event. Each review has `constraintId`, `plan`, `status` (`unverified`, `supported`, `violated`), `method` (`test`, `review`), `evidence` (empty while pending) and `checkIndexes` (zero-based references into this event's `checks`). Relationship rules relate to either endpoint in scope; project rules always relate. Recheck applicability when scope expands. Legacy events remain valid without reviews.\n> \n> Optional review `checkedAt` and full `gitCommit` record when and against which commit the review ran. Describe any uncommitted changes in `evidence`. These fields do not clear file-change reminders or transfer a historical result onto current code.\n> \n> Each event is a complete review snapshot: omitted reviews display as unverified, and prior results are never carried forward automatically. Start plans as unverified. Supported or violated results require evidence; test-supported results require linked passing checks. Manual reviews use textual evidence and empty check indexes. Translate `plan` and `evidence` in each review's `translations` when delivering both languages. A passing test only supports the stated coverage, not every constraint. Terminal events may remain unverified or report violations; completion never establishes compliance.\n> \n> ## Viewer\n> \n> The constraints toolbar button opens the existing inspector. Filter applicable rules, the selected module, changes needing review, uncertain/conflicting rules or all rules. Module details link to applicable rules; selecting a rule highlights its target modules and relationships without changing activity scope. Details separate applicability, explanation, source excerpts, linked code, file changes and verification evidence. Recorded verbatim excerpts are expanded by default; the standalone page does not load source files. Task views additionally show plans, review methods, review provenance and linked checks for the selected event. Discovery coverage and snapshot timestamps remain inspectable. Corrections require updating source-backed data and rerendering; there is no UI switch to disable rules or filesystem write interception."},"directory-source-8":{"body":"# .agents/skills/birdview/references/map-project.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Stage 1: Map the project\n> \n> [中文](map-project.zh.md)\n> \n> Produce [schema-valid](../schemas/architecture.schema.json) architecture JSON and standalone HTML from the same data for the selected project and scope. Follow [language selection](bilingual.md); examples are fictional field references, not project evidence.\n> \n> ## Discover and verify coverage\n> \n> 1. Check user-provided/documented architecture paths, existing artifact locations, `.birdview/`, then root and `docs/`. Use bounded architecture/map filename searches, excluding dependencies, generated output and skill examples; expand only when those locations and references yield nothing.\n> 2. Read candidates and verify project relevance, coverage, current ownership and source evidence. Validate Birdview JSON; schema validity does not establish freshness. Prefer the user's selection or documented canonical map; ask only about unresolved competing candidates.\n> 3. Reuse compatible maps in place and update stale portions. Adapt other formats after source verification, preserving meaningful IDs and the original artifact. HTML/images alone need underlying module/ownership data before Stage 2. Create a map only when none is reusable or adaptable; resolve unavailable validation before Stage 2.\n> 4. Honor explicit subsystem scope; otherwise inspect the selected project root. Read root documentation, top-level directories and relevant workspace/build manifests, then follow declared applications. Verify each using its own manifest, startup/build entry and source. Dependencies alone do not prove an application; trace client calls and server routes before asserting connections.\n> 5. Reconcile every in-scope application with a module, explained grouping or explicit coverage gap in new and reused maps. Keep distinct application responsibilities visible; shared packages need not be applications. The 6-10 module readability target never justifies omissions or inventions.\n> 6. For ordinary local edits, recheck relevant entries and changed manifests. Broaden discovery only when scope or workspace structure changes. Report root/scope, checked applications and module IDs, exclusions and unresolved areas alongside the architecture table. Distinguish uninspected areas from checked absences; zero uncertainty does not prove complete coverage.\n> \n> ## Author the map\n> \n> Trace main request/data paths and read surrounding symbols before assigning responsibilities. For a specific code area, step up to its responsibility and relevant callers/dependencies within the agreed scope. Stop when that scope is coherently covered.\n> \n> Model modules as cohesive business or technical responsibilities at a comparable level of abstraction, not one node per file, class or directory. Describe what each does and how it connects to surrounding modules; keep implementation locations in ownership/evidence. Use the project's domain glossary when available, otherwise established terms from source and documentation. Preserve evidenced responsibility boundaries and existing IDs when improving labels.\n> \n> Follow the [contract](contract.md) for fields, roles, ownership, evidence, status and layout. Choose module roles from inspected responsibilities; use `generic` when unclear, never cycle roles for colors. Roles are independent of ownership and groups. Include external services only for real relationships, without local file ownership. Mark unsupported conclusions `uncertain` with specific open questions; `supported` records inspected evidence, not static proof.\n> \n> For new maps, explicitly classify every module; `birdview.mjs deliver` includes strict authoring validation before rendering (add `--bilingual` for Chinese/English delivery). Use standalone `validate.mjs --authoring` only for an earlier diagnostic check, not a redundant delivery step. Generic modules require the contract's `roleAssessment`: explain why the taxonomy does not fit or which evidence is missing; insufficient evidence requires uncertainty and a specific question. Never bulk-default modules to generic to finish faster. Review all-generic warnings module by module against source and report the reasons, rather than inventing different roles to pass. Reuse existing classifications unless new evidence supports a change; explain any downgrade to generic and apply revision rules. Review changed/new module classifications on legacy-map updates; unchanged legacy fields need no forced migration (see the limited `--legacy` option in [delivery.md](delivery.md)).\n> \n> Author directed, concretely labelled relationships with evidence, status, `kind` and `visibility`. Keep core execution, necessary result/tool feedback, basic dependencies and required approvals in `overview`; recovery, retries and diagnostics may be `detail` unless central to the map. Default to `overview` when unsure. Check isolated overview modules for missing connections; keep genuine auxiliary modules and hidden-relation counts. Retain all relationships; kind/visibility do not represent modification scope, and must not change solely to reduce visual clutter.\n> \n> Show an architecture table (module, responsibility, ownership, evidence, uncertainty) and short relationship list from the same JSON. Allow corrections without redundant approval when continued work is already authorized.\n> \n> ## Groups and revisions\n> \n> Use optional groups only for evidenced system/subsystem membership: one disjoint level, with stable IDs, names, unique members and nonempty evidence. Groups render side by side, preserving internal row/column order; ungrouped modules remain outside frames. Translate group names and evidence like module text.\n> \n> Choose group roles from source-supported responsibilities and explain the classification in evidence notes:\n> \n> | Role | Meaning | Fixed color |\n> | --- | --- | --- |\n> | `interaction` | User interaction and review | Pale blue |\n> | `runtime` | Execution and orchestration | Pale amber |\n> | `external-services` | Integrations outside the described system | Pale violet |\n> | `generic` | Unspecified or mixed responsibility | Neutral gray |\n> \n> Unclear or omitted roles use `generic`. Names, ordering, module ownership and color variety are not classification evidence. Group roles do not imply module roles, deployment/trust boundaries or activity state. Keep the shared palette; no per-map overrides or custom color fields. Schema rejects unknown roles/fields but cannot verify classification; check evidence and preserve existing roles unless new evidence warrants change.\n> \n> Read existing artifacts before replacing them; use the agreed location (default `.birdview/`) without overwriting unrelated files. `project.id` and `mapId` are local identities, not necessarily URLs. Optional `project.revision` records a Git commit, not the map revision or a clean-tree guarantee.\n> \n> Increment `revision` for every saved map change, including layout and translations. Preserve IDs for continuing responsibilities and never reassign removed IDs. Complete/cancel tasks on the old map before starting against a new revision; never silently replay old events onto it.\n> \n> ## Render and review\n> \n> For the default “use Birdview” delivery, finish the [constraint workflow](constraint-graph.md) before final rendering: inspect effective local instructions, collect committed sources, then author and review `reviewed-rules.json`. The delivery command below compiles it and collects rule history into `.birdview/architecture.constraints.json`. Preserve working-tree instruction differences as explicit limitations. Record actual checked/uninspected paths in `map.constraintDiscovery` under the [constraints contract](constraints.md); a scan is not semantic review. Do not copy the demo rules. Reuse a matching reviewed catalog when valid. Keep scope and snapshot explicit, and only bind rules to modules after source inspection. Save the source catalog and reviewed selection alongside the compiled catalog so another AI can continue the review. If review is incomplete, report that boundary instead of claiming complete delivery. When no reviewed rules exist, deliver the architecture and discovery findings with the limitation; the rule renderer deliberately rejects an empty or unreviewed catalog.\n> \n> Use the bundled renderer, with absolute paths when running from the user's project; `\u003cskill-root>` contains SKILL.md. Substitute the actual agreed artifact paths:\n> \n> ```sh\n> node \u003cskill-root>/scripts/birdview.mjs deliver \u003cproject-root>/.birdview/architecture.json \u003cproject-root>/.birdview/architecture.html --catalog \u003cproject-root>/.birdview/constraints.catalog.json --rules \u003cproject-root>/.birdview/reviewed-rules.json --repo \u003cproject-root>\n> ```\n> \n> To reuse a valid compiled catalog, replace `--catalog ... --rules ...` with `--constraints \u003creviewed.json>`. Use `--architecture-only` instead only for an explicit architecture-only request or a disclosed unavailable rule catalog. Read the [delivery receipt](delivery.md), including warnings and history gaps; no separate successful-input validation, compilation or intermediate HTML is needed. Check that the final integrated page has Architecture / Constraints switching, source evidence, rule version labels and the sibling source-index link; deliver the `.sources.html` file with it. The architecture inspector counts only map-bound rules, not the separate catalog; missing module links are not missing project rules.\n> \n> The renderer validates JSON and emits self-contained HTML requiring no server/network assets. Do not handcraft a substitute viewer or deliver a fictional demo as the project's map.\n> \n> Open HTML in a visible browser preview. With Codex `open_in_codex`, use a `browser` target and correctly encoded file URL, not a `file` target. A Markdown link may open source; a queued request does not confirm display, and headless inspection does not confirm the user's visible tab.\n> \n> Review the final HTML at the available user viewport:\n> \n> - Inspect Overview and All relations, names, relationships and selected-module evidence. Hover the module with most direct edges (incoming + outgoing, self-edge once), then other visibly congested areas.\n> - Check card-crossing/overlapping routes, congested turns, distinguishable endpoints/arrows, cropped routes/headings, hidden-relation counts and text size after fitting.\n> - Verify hover makes direct relationships traceable and leaving restores the selected view without moving nodes.\n> \n> Automatic spacing is not a readability guarantee. Keep pixel thresholds and invented congestion fields out of map data. If needed, adjust layout by responsibility/interaction order or groups by evidence; preserve identities, ownership, relationship semantics and full scope. Increment revision, rerender, and recheck affected areas and the full view. Stop after two consecutive attempts without visible improvement and report remaining issues. Unchanged maps in focused tasks need no unrelated UI audit.\n> \n> Report the actual artifact, viewport, modes, focused modules and unresolved issues. Schema checks, collision samples or screenshots alone are not visual acceptance; no automated crowding check is bundled. If browser inspection is unavailable/denied, state that visual review was not performed and the actual limitation; provide the absolute HTML path, explaining browser display versus editor source. Do not bypass denial or blame the template without rendering-error evidence.\n> \n> Lead with HTML and the preview result; include JSON path, `project.id`, `mapId`, `revision`, coverage and uncertainties as supporting information. Fix or report rendering blockers; JSON alone is not completed visual delivery. This is a snapshot, not live activity. Without a coding task, stop after delivery and ask for the intended change. With a coding task, prepare and render its scope through [Stage 2](show-changes.md), then wait for confirmation of the displayed plan before implementation. Rendering success alone is not permission to edit."},"directory-source-9":{"body":"# .agents/skills/birdview/references/show-changes.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Stage 2: Express the change\n> \n> [中文](show-changes.zh.md)\n> \n> Preparing the plan requires a user-requested task and the usable map from [Stage 1](map-project.md). Implementation additionally requires confirmation of the displayed plan, as defined in [SKILL.md](../SKILL.md).\n> Read [contract.md](contract.md), `schemas/activity.schema.json` and the example stream.\n> Use exact project/map/revision/module IDs; resolve stale coverage before emitting events. Never substitute a fictional map or infer IDs from prose.\n> \n> ## Record operations\n> \n> Before editing, follow [development.md](development.md) for the relevant task types. Include the intended observable behavior and verification method in the `planned` reason; use existing `checks` for executed results and `constraintReviews` for applicable recorded constraints. Do not add new event fields.\n> \n> 1. Before editing: append `planned` with complete `scope`, current `targets`, project-relative `files` and a short module-based reason. Render and deliver the plan, ask for confirmation, and wait. Do not treat the original coding request as approval of an unseen plan. Reuse confirmation already given for this same plan; honor an explicit task-specific waiver.\n> 2. After confirmation, before each edit group: append `editing` with concrete paths and only current modules as targets.\n> 3. Before checks: append `verifying`; test/fixture paths do not automatically count as modified files.\n> 4. At task end: append `completed`, `failed` or `cancelled`, recording actual commands, exit codes and observations in `checks` where applicable.\n> \n> Every JSONL event carries complete scope/targets. Explain scope expansion in a new `planned` event, update the preview and confirm the changed scope before editing added modules. For mapped edits, target all matching file owners; list unowned files in both `files` and `unmappedFiles`. Never invent ownership to pass validation; correct misleading rules in Stage 1.\n> \n> One active task per session; sequences start at 1 and stay contiguous. After a terminal event use a new task ID, never reopen one. Keep project and map revision fixed; new revisions require a new session/file. These are agent declarations: keep checks pending until executed, and never infer success from event emission or completion.\n> \n> ## Render and deliver\n> \n> ```sh\n> node \u003cskill-root>/scripts/birdview.mjs deliver \u003cmap.json> \u003cactivity.html> \u003cactivity.jsonl> --constraints \u003creviewed.json>\n> ```\n> \n> Reuse the matching reviewed catalog from Stage 1; do not repeat rule compilation for an activity update. For explicit architecture-only output or disclosed unavailable rules, replace `--constraints \u003creviewed.json>` with `--architecture-only`. The [delivery command](delivery.md) validates the map and full stream before replacing output; add `--bilingual` when applicable and use `--legacy` only for unchanged legacy classifications. Read its receipt and deliver only after success; follow Stage 1's preview checks.\n> \n> - Real activity opens at the latest record; simulation at the first plan. History and collapsible files/checks describe the selected step, not cumulative Git changes.\n> - Architecture/changes/comparison share positions; comparison links selection, zoom and scrolling and stacks on narrow screens.\n> - Scope stays outlined; non-targets dim. Planned targets highlight before edits, verification targets are labelled separately, and terminal events remove target glow. No executed checks means unverified.\n> - Use the separate `render.mjs --simulation` route only for fictional records such as `examples/harness.activity.jsonl`, never as observed work.\n> - For each supported activity language, supply event `translations[locale].reason` and check `translations[locale].summary`; absent translations fall back to originals.\n> - Updates need regeneration and refresh. No upload, auto-refresh, live interception or Git verification exists; a future display receipt would confirm rendering, not approval or correctness."},"directory-source-10":{"body":"# .agents/skills/birdview/references/development.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Development after activation\n> \n> [中文](development.zh.md)\n> \n> Apply only when Birdview is active and the user has authorized coding. Before implementation, follow the displayed-plan confirmation step in [SKILL.md](../SKILL.md); mapping or an initial coding request alone is not plan approval. Preserve the existing map and change workflow; these rules neither enable always-on behavior nor override project instructions.\n> \n> ## Choose the relevant guidance\n> \n> Read the related implementation, callers and applicable design decisions. Resolve questions from source first; ask only about unresolved choices that materially affect the task. Define the expected observable behavior and a proportionate way to verify it before editing. Combine the sections below when needed, such as bug diagnosis plus UI checks for a broken button. Do not run every section for every task.\n> \n> ### Bug fixes\n> \n> Establish a reproduction or inspect concrete failure evidence matching the reported symptom. Use the smallest useful test, command, request or UI interaction. For intermittent failures, record reproduction conditions and frequency. If reproduction is unavailable, state what was tried and what evidence is missing; distinguish a tentative fix from a verified one.\n> \n> Test plausible causes against evidence before choosing a fix. Multiple competing hypotheses help ambiguous failures, but simple bugs need no fixed hypothesis count. Change one relevant variable at a time when investigating. For performance work, measure the affected scenario before and after under comparable conditions.\n> \n> After fixing, rerun the original scenario. Add a regression test when it can exercise the real failure path and provides durable value; observe it fail before the fix and pass afterward when feasible. Explain missing coverage. Remove temporary instrumentation introduced for this task without deleting others' work.\n> \n> ### Features and behavior changes\n> \n> Identify observable acceptance behavior and important failure paths. Implement and verify in small behavior-sized steps. Tests should exercise real paths through stable interfaces, rather than mirror private implementation or pass only because internal collaborators are mocked. Use test-first development when requested or useful; do not mandate
