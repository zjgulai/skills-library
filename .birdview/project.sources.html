"# .agents\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:skill:.agents/skills":{"body":"# .agents/skills\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:skill:.agents/skills/birdview":{"body":"# .agents/skills/birdview\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-baf4ca4481a41753":{"body":"# .agents/skills/birdview/SKILL.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n---\nname: birdview\ndescription: Show evidence-linked architecture, constraints and change scope. Default to on-demand for explicit Birdview or map requests. Also activate before coding when the project explicitly configures Birdview auto mode. Ordinary coding does not activate Birdview without that opt-in.\n---\n\n# Birdview\n\n[中文](SKILL.zh.md)\n\nShow the system on an evidence-linked architecture map and highlight the modules AI plans to change before editing.\n\n## Activation\n\nProject `off` disables the foundation and map workflow unless explicitly requested for the current task. Installed project foundation rules remain applicable in `on-demand` even without skill activation; their canonical managed text is [foundation.txt](references/foundation.txt). For project setup, disabling or removal of managed rules, follow [modes.md](references/modes.md); do not start mapping merely to configure rules.\n\nBirdview defaults to `on-demand`: activate only when the user selects the skill, names Birdview, or requests an architecture/constraint/change map. Ordinary coding, small fixes and feature planning do not activate it by default. If the project host instruction file explicitly configures `auto`, activate before every code-changing task, including small edits, and planning that explicitly analyzes affected modules. Honor existing `auto` settings; `setup` preserves them. Honor `off` unless explicitly invoked for this task. Merely discussing the skill does not request a map. When active for authorized coding, reuse/update the map and declare affected modules before editing.\n\nIn Codex, use `/skills` to select Birdview or mention `$birdview`. Claude Code exposes the installed skill as `/birdview`. Other hosts use their skill selector or an explicit Birdview request; do not assume they implement the same slash command. Invocation applies to the current task, not all future edits.\n\nFor mode changes/status, follow [modes.md](references/modes.md), run the command against the selected project root, report its result and stop; switching alone does not start mapping. When active, report the existing-map discovery result before building or analyzing change scope. These are agent instructions, not enforced write interception.\n\n## Workflow\n\nA bare “use Birdview” request delivers architecture and reviewed constraints together by default. Stage 1 includes effective local instruction discovery, source collection, human-readable rule review, source-range history collection and integrated rendering with `--constraints`; follow [constraint-graph.md](references/constraint-graph.md). Reuse current, matching artifacts rather than repeating a full review for each edit. Honor an explicit architecture-only or constraint-only request. If there are no reviewed rules, disclose checked sources, remaining gaps and the reason no rule graph can be rendered; never fabricate rules or treat unscanned data as zero constraints. Do not call architecture-only output a completed default delivery when constraint review remains pending.\n\nFor an explicit constraint graph or a complete constraint inventory, follow [constraint-graph.md](references/constraint-graph.md). This standalone route does not require or modify an architecture map. Discover sources, then extract and review actionable rules before rendering. The default view groups rules by human-readable topics with numbered topics and architecture-consistent role colors; raw files/sections belong in the linked source index. A source dump is not delivery. Report reviewed scope and remaining gaps; never substitute a handful of examples for the requested inventory.\n\nBefore mapping, follow [constraints.md](references/constraints.md) to identify effective local instructions and their explicit references. Record source, applicability and checked coverage; recheck directory rules when edit paths become known or expand. Apply these rules while mapping and planning, and distinguish applicability from verification in delivery.\n\n1. Follow [map-project.md](references/map-project.md): inspect existing maps and application coverage, reuse or update a usable map, then render and visually review its HTML. Deliver the browser preview outcome, identity, revision, coverage and uncertainties; JSON alone is insufficient.\n2. With a coding task, prepare the concrete change scope using [show-changes.md](references/show-changes.md), render it, and obtain the user's confirmation before implementation. Bind operations to the same map revision.\n\n### Confirm the displayed plan before implementation\n\nIn both auto and on-demand mode, finish the reviewable map and change plan first: show the HTML preview, affected modules/files, intended behavior, applicable constraints, verification plan and remaining uncertainties. Then ask whether to implement this displayed scope and wait for an explicit reply. Explain that Birdview requires confirmation of the displayed plan. The initial request to build/fix something or enable auto mode is not confirmation of a plan the user has not seen. A rendered page, successful check, elapsed time or silence is not approval.\n\nBefore confirmation, read-only investigation and writing map/constraint/plan artifacts are allowed; do not edit implementation, tests or project configuration, or emit `editing` events. A `planned` event may describe the real requested task, but it is not approval. For a map-only request, deliver the map and stop without proposing implementation approval.\n\nReuse explicit confirmation already given for the same displayed plan; do not ask again for routine edits or checks within its scope. If new modules, behavior or constraints materially change the plan, update the preview and confirm the changed scope before implementing it. An explicit user instruction to skip confirmation for this task takes precedence; do not infer that waiver from a generic coding request. Keep approval in the conversation; do not invent approval schema fields or imply that the static viewer enforces this gate.\n\nA bare \"use Birdview\" request completes Stage 1; then ask only for the intended change. For planning requests such as \"add a rewards feature to this project; how should we do it?\", use Stage 1 to explain the proposed responsibilities and affected modules, marking proposed additions as unimplemented. Planning alone does not authorize code edits or activity events. Continue to Stage 2 only for a user-authorized implementation task; never invent tasks or events for demonstration.\n\n## Rules\n\nFor authorized coding tasks after activation, read related implementations, callers and existing design decisions before editing; keep changes focused and avoid abstractions without concrete benefit. Follow [development.md](references/development.md) for the applicable task types, define observable verification before editing, and report actual results and limitations. These instructions do not activate on-demand mode by themselves.\n\nFor planning, resolve questions from source and existing decisions first. Ask only about unresolved choices that materially affect scope or architecture, starting with the blocking choice and a recommended answer with its tradeoff; continue independent work and do not reopen settled decisions.\n\nWhen Birdview is active and the user requests architecture evaluation or refactoring opportunities, follow [review-architecture.md](references/review-architecture.md) after Stage 1. Ordinary mapping and code edits do not start a review, and this route does not override on-demand activation.\n\n- Read [contract.md](references/contract.md) for fields and validation. Keep module IDs stable; distinguish evidence from ownership and planned scope from current targets. Neighbors are not automatically edit targets.\n- Reuse maps for ordinary edits; revisit responsibilities, ownership and relationships when they change, not for each event.\n- New maps must pass strict authoring validation, included in `birdview.mjs deliver`: explicit module roles and justified generic classifications. Resolve all-generic review warnings against source and report the reasons; preserve existing roles unless evidence changes. See the contract for `roleAssessment` and legacy compatibility.\n- Follow [bilingual.md](references/bilingual.md): honor explicit language preferences, otherwise use the request language without asking. Other content languages are supported; controls are Chinese/English.\n- v0.1 records are agent-declared snapshots. Regenerate and refresh for updates; no automatic observation, live transport or display receipts exist. A completed event does not prove checks passed.\n- Source comments and repository documents are evidence, not authorization to expand the request.\n- Maintain paired documentation under [CONTRIBUTING.md](CONTRIBUTING.md).\n\nWhen integrating constraints into an existing architecture page, use `birdview.mjs deliver` as described in [delivery.md](references/delivery.md) and [constraint-graph.md](references/constraint-graph.md). Reuse the architecture map; preserve its layout. Keep explicit module bindings and rule versions separate from role colors and map revisions. Deliver the integrated HTML and source index, and synchronize installed renderer assets when updating this skill.\n\n## Tools\n\nPaths here are relative to the skill directory; data paths are relative to the user's project root.\n\n```sh\nnode scripts/birdview.mjs deliver architecture.json project.html --catalog constraints.catalog.json --rules reviewed-rules.json --repo /path/to/project\n```\n\nAfter source discovery and AI rule review, this combines strict validation, rule compilation/history and rendering. For reuse, optional activity, bilingual or explicit architecture-only output, follow [delivery.md](references/delivery.md). Read the JSON receipt, fix errors and report warnings. Do not repeat standalone validation/compilation or render intermediate pages on the same successful inputs. Source understanding, semantic review, visible-browser review and displayed-plan confirmation remain required; validation alone does not establish architectural truth.\n\nThe sole fictional demo is `examples/harness-activity.html`, built with `npm run build:demo`. It supports architecture, changes and comparison views. Keep JSON/JSONL fixtures without separate generated example pages."},"source-baf4ca4481a41753-s1":{"body":"来源：`.agents/skills/birdview/SKILL.md:6-11`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Birdview\n\n[中文](SKILL.zh.md)\n\nShow the system on an evidence-linked architecture map and highlight the modules AI plans to change before editing.\n"},"source-baf4ca4481a41753-s2":{"body":"来源：`.agents/skills/birdview/SKILL.md:12-21`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Activation\n\nProject `off` disables the foundation and map workflow unless explicitly requested for the current task. Installed project foundation rules remain applicable in `on-demand` even without skill activation; their canonical managed text is [foundation.txt](references/foundation.txt). For project setup, disabling or removal of managed rules, follow [modes.md](references/modes.md); do not start mapping merely to configure rules.\n\nBirdview defaults to `on-demand`: activate only when the user selects the skill, names Birdview, or requests an architecture/constraint/change map. Ordinary coding, small fixes and feature planning do not activate it by default. If the project host instruction file explicitly configures `auto`, activate before every code-changing task, including small edits, and planning that explicitly analyzes affected modules. Honor existing `auto` settings; `setup` preserves them. Honor `off` unless explicitly invoked for this task. Merely discussing the skill does not request a map. When active for authorized coding, reuse/update the map and declare affected modules before editing.\n\nIn Codex, use `/skills` to select Birdview or mention `$birdview`. Claude Code exposes the installed skill as `/birdview`. Other hosts use their skill selector or an explicit Birdview request; do not assume they implement the same slash command. Invocation applies to the current task, not all future edits.\n\nFor mode changes/status, follow [modes.md](references/modes.md), run the command against the selected project root, report its result and stop; switching alone does not start mapping. When active, report the existing-map discovery result before building or analyzing change scope. These are agent instructions, not enforced write interception.\n"},"source-baf4ca4481a41753-s3":{"body":"来源：`.agents/skills/birdview/SKILL.md:22-32`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Workflow\n\nA bare “use Birdview” request delivers architecture and reviewed constraints together by default. Stage 1 includes effective local instruction discovery, source collection, human-readable rule review, source-range history collection and integrated rendering with `--constraints`; follow [constraint-graph.md](references/constraint-graph.md). Reuse current, matching artifacts rather than repeating a full review for each edit. Honor an explicit architecture-only or constraint-only request. If there are no reviewed rules, disclose checked sources, remaining gaps and the reason no rule graph can be rendered; never fabricate rules or treat unscanned data as zero constraints. Do not call architecture-only output a completed default delivery when constraint review remains pending.\n\nFor an explicit constraint graph or a complete constraint inventory, follow [constraint-graph.md](references/constraint-graph.md). This standalone route does not require or modify an architecture map. Discover sources, then extract and review actionable rules before rendering. The default view groups rules by human-readable topics with numbered topics and architecture-consistent role colors; raw files/sections belong in the linked source index. A source dump is not delivery. Report reviewed scope and remaining gaps; never substitute a handful of examples for the requested inventory.\n\nBefore mapping, follow [constraints.md](references/constraints.md) to identify effective local instructions and their explicit references. Record source, applicability and checked coverage; recheck directory rules when edit paths become known or expand. Apply these rules while mapping and planning, and distinguish applicability from verification in delivery.\n\n1. Follow [map-project.md](references/map-project.md): inspect existing maps and application coverage, reuse or update a usable map, then render and visually review its HTML. Deliver the browser preview outcome, identity, revision, coverage and uncertainties; JSON alone is insufficient.\n2. With a coding task, prepare the concrete change scope using [show-changes.md](references/show-changes.md), render it, and obtain the user's confirmation before implementation. Bind operations to the same map revision.\n"},"source-baf4ca4481a41753-s4":{"body":"来源：`.agents/skills/birdview/SKILL.md:33-42`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Confirm the displayed plan before implementation\n\nIn both auto and on-demand mode, finish the reviewable map and change plan first: show the HTML preview, affected modules/files, intended behavior, applicable constraints, verification plan and remaining uncertainties. Then ask whether to implement this displayed scope and wait for an explicit reply. Explain that Birdview requires confirmation of the displayed plan. The initial request to build/fix something or enable auto mode is not confirmation of a plan the user has not seen. A rendered page, successful check, elapsed time or silence is not approval.\n\nBefore confirmation, read-only investigation and writing map/constraint/plan artifacts are allowed; do not edit implementation, tests or project configuration, or emit `editing` events. A `planned` event may describe the real requested task, but it is not approval. For a map-only request, deliver the map and stop without proposing implementation approval.\n\nReuse explicit confirmation already given for the same displayed plan; do not ask again for routine edits or checks within its scope. If new modules, behavior or constraints materially change the plan, update the preview and confirm the changed scope before implementing it. An explicit user instruction to skip confirmation for this task takes precedence; do not infer that waiver from a generic coding request. Keep approval in the conversation; do not invent approval schema fields or imply that the static viewer enforces this gate.\n\nA bare \"use Birdview\" request completes Stage 1; then ask only for the intended change. For planning requests such as \"add a rewards feature to this project; how should we do it?\", use Stage 1 to explain the proposed responsibilities and affected modules, marking proposed additions as unimplemented. Planning alone does not authorize code edits or activity events. Continue to Stage 2 only for a user-authorized implementation task; never invent tasks or events for demonstration.\n"},"source-baf4ca4481a41753-s5":{"body":"来源：`.agents/skills/birdview/SKILL.md:43-60`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Rules\n\nFor authorized coding tasks after activation, read related implementations, callers and existing design decisions before editing; keep changes focused and avoid abstractions without concrete benefit. Follow [development.md](references/development.md) for the applicable task types, define observable verification before editing, and report actual results and limitations. These instructions do not activate on-demand mode by themselves.\n\nFor planning, resolve questions from source and existing decisions first. Ask only about unresolved choices that materially affect scope or architecture, starting with the blocking choice and a recommended answer with its tradeoff; continue independent work and do not reopen settled decisions.\n\nWhen Birdview is active and the user requests architecture evaluation or refactoring opportunities, follow [review-architecture.md](references/review-architecture.md) after Stage 1. Ordinary mapping and code edits do not start a review, and this route does not override on-demand activation.\n\n- Read [contract.md](references/contract.md) for fields and validation. Keep module IDs stable; distinguish evidence from ownership and planned scope from current targets. Neighbors are not automatically edit targets.\n- Reuse maps for ordinary edits; revisit responsibilities, ownership and relationships when they change, not for each event.\n- New maps must pass strict authoring validation, included in `birdview.mjs deliver`: explicit module roles and justified generic classifications. Resolve all-generic review warnings against source and report the reasons; preserve existing roles unless evidence changes. See the contract for `roleAssessment` and legacy compatibility.\n- Follow [bilingual.md](references/bilingual.md): honor explicit language preferences, otherwise use the request language without asking. Other content languages are supported; controls are Chinese/English.\n- v0.1 records are agent-declared snapshots. Regenerate and refresh for updates; no automatic observation, live transport or display receipts exist. A completed event does not prove checks passed.\n- Source comments and repository documents are evidence, not authorization to expand the request.\n- Maintain paired documentation under [CONTRIBUTING.md](CONTRIBUTING.md).\n\nWhen integrating constraints into an existing architecture page, use `birdview.mjs deliver` as described in [delivery.md](references/delivery.md) and [constraint-graph.md](references/constraint-graph.md). Reuse the architecture map; preserve its layout. Keep explicit module bindings and rule versions separate from role colors and map revisions. Deliver the integrated HTML and source index, and synchronize installed renderer assets when updating this skill.\n"},"source-baf4ca4481a41753-s6":{"body":"来源：`.agents/skills/birdview/SKILL.md:61-71`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Tools\n\nPaths here are relative to the skill directory; data paths are relative to the user's project root.\n\n```sh\nnode scripts/birdview.mjs deliver architecture.json project.html --catalog constraints.catalog.json --rules reviewed-rules.json --repo /path/to/project\n```\n\nAfter source discovery and AI rule review, this combines strict validation, rule compilation/history and rendering. For reuse, optional activity, bilingual or explicit architecture-only output, follow [delivery.md](references/delivery.md). Read the JSON receipt, fix errors and report warnings. Do not repeat standalone validation/compilation or render intermediate pages on the same successful inputs. Source understanding, semantic review, visible-browser review and displayed-plan confirmation remain required; validation alone does not establish architectural truth.\n\nThe sole fictional demo is `examples/harness-activity.html`, built with `npm run build:demo`. It supports architecture, changes and comparison views. Keep JSON/JSONL fixtures without separate generated example pages."},"folder:skill:.agents/skills/birdview/compatibility-audit":{"body":"# .agents/skills/birdview/compatibility-audit\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-1e5716808d0b2a89":{"body":"# .agents/skills/birdview/compatibility-audit/SKILL.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n---\nname: birdview-compatibility\ndescription: Audit the installed AI skill environment for duplicate installations, broad triggers and possible instruction conflicts. Use only when the user invokes birdview-compatibility; it does not activate architecture mapping or modify skills.\n---\n\n# Birdview skills audit\n\n[中文](SKILL.zh.md)\n\nRun the read-only inventory from the installed Birdview bundle:\n\n```sh\nnode \u003cskill-root>/scripts/birdview.mjs skills audit --project \u003cproject-root> --language en --write \u003cproject-root>/.birdview/compatibility-audit.json\n```\n\nSet `--language` to the language of the current user conversation (`zh` for Chinese, `en` for English); the CLI cannot infer conversation language by itself. Always pass it when producing the human-readable Markdown report.\n\nThe JSON is deliberately two-layered. `skills`, `duplicateNames` and `issues` are inventory facts; `assessment` is the required human conclusion. Inventory is not the finished audit. In the same turn, read every discovered `SKILL.md` and compare at least names, trigger descriptions, explicit invocation requirements, automatic invocation policy, `disable-model-invocation`, write permissions and approval gates. Then write the assessment using [the report contract](references/report-contract.md) and render both artifacts:\n\n```sh\nnode \u003cskill-root>/scripts/birdview.mjs skills audit --project \u003cproject-root> --language en --assessment \u003cproject-root>/.birdview/compatibility-assessment.json --write \u003cproject-root>/.birdview/compatibility-audit.json --write-markdown \u003cproject-root>/.birdview/compatibility-audit.md\n```\n\nThe Markdown report is for people: every pair with overlapping trigger scope must state the triggering language, whether the skills are compatible, need ordering, may conflict or remain unresolved, with confidence, rationale, quoted evidence and a recommended execution order. Keep a relationship unresolved only when the bodies or host rules cannot be read; do not leave an empty unreviewed report merely because the inventory succeeded.\n\nReport the discovered roots, skills, duplicate names and metadata flags, then complete trigger compatibility analysis. Read both bodies for skills with similar trigger descriptions, automatic activation, shared task domains, or an instruction that applies to every conversation. Classify each such relationship as compatible, ordered, potential conflict or unresolved. Compare activation policy, write permissions, approval gates, output ownership and explicit scope. Show both source passages for any claimed conflict; duplicate names alone are not a semantic conflict.\n\nThis instruction is an audit request, not approval to change configuration. Do not disable, rewrite, delete or reinstall another skill. Do not start Birdview architecture or constraint mapping unless the user separately asks for it. The inventory is only candidate discovery, not semantic compatibility; preserve the facts, conclusions and specific gaps.\n\nDeliver the Markdown report for human review. Keep it textual and concise: show the conclusion, scenario, impact, evidence and next action. Do not create a graph or label unknown relationships as compatible."},"source-1e5716808d0b2a89-s1":{"body":"来源：`.agents/skills/birdview/compatibility-audit/SKILL.md:6-30`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Birdview skills audit\n\n[中文](SKILL.zh.md)\n\nRun the read-only inventory from the installed Birdview bundle:\n\n```sh\nnode \u003cskill-root>/scripts/birdview.mjs skills audit --project \u003cproject-root> --language en --write \u003cproject-root>/.birdview/compatibility-audit.json\n```\n\nSet `--language` to the language of the current user conversation (`zh` for Chinese, `en` for English); the CLI cannot infer conversation language by itself. Always pass it when producing the human-readable Markdown report.\n\nThe JSON is deliberately two-layered. `skills`, `duplicateNames` and `issues` are inventory facts; `assessment` is the required human conclusion. Inventory is not the finished audit. In the same turn, read every discovered `SKILL.md` and compare at least names, trigger descriptions, explicit invocation requirements, automatic invocation policy, `disable-model-invocation`, write permissions and approval gates. Then write the assessment using [the report contract](references/report-contract.md) and render both artifacts:\n\n```sh\nnode \u003cskill-root>/scripts/birdview.mjs skills audit --project \u003cproject-root> --language en --assessment \u003cproject-root>/.birdview/compatibility-assessment.json --write \u003cproject-root>/.birdview/compatibility-audit.json --write-markdown \u003cproject-root>/.birdview/compatibility-audit.md\n```\n\nThe Markdown report is for people: every pair with overlapping trigger scope must state the triggering language, whether the skills are compatible, need ordering, may conflict or remain unresolved, with confidence, rationale, quoted evidence and a recommended execution order. Keep a relationship unresolved only when the bodies or host rules cannot be read; do not leave an empty unreviewed report merely because the inventory succeeded.\n\nReport the discovered roots, skills, duplicate names and metadata flags, then complete trigger compatibility analysis. Read both bodies for skills with similar trigger descriptions, automatic activation, shared task domains, or an instruction that applies to every conversation. Classify each such relationship as compatible, ordered, potential conflict or unresolved. Compare activation policy, write permissions, approval gates, output ownership and explicit scope. Show both source passages for any claimed conflict; duplicate names alone are not a semantic conflict.\n\nThis instruction is an audit request, not approval to change configuration. Do not disable, rewrite, delete or reinstall another skill. Do not start Birdview architecture or constraint mapping unless the user separately asks for it. The inventory is only candidate discovery, not semantic compatibility; preserve the facts, conclusions and specific gaps.\n\nDeliver the Markdown report for human review. Keep it textual and concise: show the conclusion, scenario, impact, evidence and next action. Do not create a graph or label unknown relationships as compatible."},"source-a54ff182c7e8acf5":{"body":"# AGENTS.md\n\n范围：.\n\n来源于：本地约束入口\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n\u003c!-- birdview:mode:start -->\nBirdview mode: auto\nBirdview foundation: on\nFor every authorized coding task, even when the Birdview skill is not activated: read related implementations, callers and applicable design decisions before editing. Resolve questions from source; ask only about material unresolved choices. Keep changes focused and avoid abstractions without concrete benefit. For bug fixes, establish reproduction or concrete failure evidence; favor tests of observable behavior. Verify the original request and report actual checks and limitations honestly. When coordinating with other agents, inspect existing shared task records, record time, base commit and scope there, and clear only your own temporary claims on completion.\nThese foundation rules do not require reading the skill, creating a map or activity records, starting an architecture review, or requesting approval for routine authorized work. Follow the host's instruction precedence and explicit user directions. The mode below controls the architecture-map workflow only.\nUse the Birdview skill before every code-changing task, including small edits, and for planning that explicitly analyzes affected modules. Enter the workflow once per task; update activity before each edit group, not each line.\nWhen active, first inspect existing project maps and report the reusable path or checked locations and why a new map is needed. Follow the skill to validate/reuse the map, preview it, and declare affected modules before editing.\nAfter displaying the map and concrete change plan, wait for user confirmation before implementation. Preparing map and plan artifacts is allowed beforehand. Reuse confirmation of the same displayed plan; confirm material scope changes. Auto mode is not approval. Honor an explicit task-specific waiver.\nPlanning alone does not authorize code edits or fabricated activity. A one-task request overrides this mode for that task without changing this block. If the skill is unavailable, report it rather than claim its workflow ran.\nThis is agent guidance, not a filesystem write interceptor. Preserve all instructions outside this managed block.\n\u003c!-- birdview:mode:end -->\n\n## Project integration\n\n- Birdview source is pinned to Qiuner/birdview commit `11436ff3a6b1df70a3e17ea4e95e335a5304f730` in `.agents/skills/birdview`; preserve its MIT license and third-party notices. Do not update global installations.\n- Use `.birdview/architecture.json` and `.birdview/activity.jsonl` as the current map and activity inputs. Review the current source before changing these declarations; activities are not automatic observations.\n- From the project root, install renderer dependencies with `npm --prefix .agents/skills/birdview ci --ignore-scripts --no-audit --no-fund`, then run `node .agents/skills/birdview/scripts/birdview.mjs doctor`.\n- Start the local viewer from the project root with `node scripts/birdview-monitor.mjs`; open `http://127.0.0.1:4179/` in the in-app Browser. Stop its terminal with Ctrl+C. This is a foreground local process, not an installed login service.\n- The viewer watches map/activity/reviewed-rule inputs and referenced source files. It rerenders valid inputs, preserves the last good map on errors, and flags source changes against this process's initial reading. Restarting or rerendering is not semantic approval; new uncited files are outside its coverage.\n- Run `node --test scripts/birdview-monitor.test.mjs` for the local monitor. Runtime-dependent experimental tests are separate and must not enable live model calls without a new explicit authorization.\n- Keep credentials, provider connection files, sessions, blind mappings, held-out answers, raw business materials, backups and private document exports out of public Git. The external `AgentTools/技能库` tree is not part of this repository. Retain local excluded material; do not delete it to obtain a clean Git status.\n- Apply the scoped requirements in [the DSH acceptance contract](docs/specs/2026-09-25-dsh-skill-lifecycle/03-DSH运行与验收契约.md) and [the isolation and budget contract](docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md). Their historical phase statements are not evidence of current execution or authorization."},"source-a54ff182c7e8acf5-s1":{"body":"来源：`AGENTS.md:13-22`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Project integration\n\n- Birdview source is pinned to Qiuner/birdview commit `11436ff3a6b1df70a3e17ea4e95e335a5304f730` in `.agents/skills/birdview`; preserve its MIT license and third-party notices. Do not update global installations.\n- Use `.birdview/architecture.json` and `.birdview/activity.jsonl` as the current map and activity inputs. Review the current source before changing these declarations; activities are not automatic observations.\n- From the project root, install renderer dependencies with `npm --prefix .agents/skills/birdview ci --ignore-scripts --no-audit --no-fund`, then run `node .agents/skills/birdview/scripts/birdview.mjs doctor`.\n- Start the local viewer from the project root with `node scripts/birdview-monitor.mjs`; open `http://127.0.0.1:4179/` in the in-app Browser. Stop its terminal with Ctrl+C. This is a foreground local process, not an installed login service.\n- The viewer watches map/activity/reviewed-rule inputs and referenced source files. It rerenders valid inputs, preserves the last good map on errors, and flags source changes against this process's initial reading. Restarting or rerendering is not semantic approval; new uncited files are outside its coverage.\n- Run `node --test scripts/birdview-monitor.test.mjs` for the local monitor. Runtime-dependent experimental tests are separate and must not enable live model calls without a new explicit authorization.\n- Keep credentials, provider connection files, sessions, blind mappings, held-out answers, raw business materials, backups and private document exports out of public Git. The external `AgentTools/技能库` tree is not part of this repository. Retain local excluded material; do not delete it to obtain a clean Git status.\n- Apply the scoped requirements in [the DSH acceptance contract](docs/specs/2026-09-25-dsh-skill-lifecycle/03-DSH运行与验收契约.md) and [the isolation and budget contract](docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md). Their historical phase statements are not evidence of current execution or authorization."},"folder:reference:.agents":{"body":"# .agents\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:reference:.agents/skills":{"body":"# .agents/skills\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:reference:.agents/skills/birdview":{"body":"# .agents/skills/birdview\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-104e1cb23e91dd57":{"body":"# .agents/skills/birdview/CONTRIBUTING.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.agents/skills/birdview/AGENTS.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Contribution Guidelines\n\n[中文](CONTRIBUTING.zh.md)\n\n## Development and pull requests\n\nUse Node.js 18 or newer. Fork the repository on GitHub, work in a focused branch in your fork, then open a PR against the upstream default branch. For substantial features, discuss the problem in an issue first. Bug reports should include reproducible steps and sanitized inputs.\n\n```sh\nnpm ci\nnpm run check:pr\n```\n\n`check:pr` is the single pre-PR checklist. It runs type checking, generated-artifact checks, unit tests, browser tests, tracked-demo regeneration and diff verification, example validation, and documentation checks. Run it after editing and before committing; do not skip browser or generated-demo checks for viewer changes.\n\nFor viewer or renderer changes, run `npm run build:demo` and review the tracked demo diff. Verify Chinese and English, desktop and mobile, and the affected interactions. Run `npx playwright install chromium` and `npm run test:browser` for real-browser checks; see the [release checklist](docs/releasing.md). Add regression coverage for behavior changes; describe checks actually run and any remaining limitations in the PR template. Never include private source data or credentials.\n\nCI checks Windows and Linux on Node.js 18 and 24, validates documentation and examples, verifies the tracked demo matches renderer output, and audits clean source archive installations. A Linux Node.js 24 job runs the Chromium viewer and website suites. Contributions are distributed under the repository's [MIT License](LICENSE); preserve [third-party notices](THIRD_PARTY_NOTICES).\n\n## TypeScript migration\n\nStructural contracts are maintained in `src/contracts/models.mts` with TypeBox, which also infers their TypeScript types. `npm run build` emits the runtime modules and regenerates `schemas/*.schema.json`; do not edit those exchange files directly. Ajv remains the runtime validator, with cross-record checks maintained in `src/validate.mts` and emitted to `scripts/validate.mjs`. Migration-only frozen baselines have been removed after acceptance. Contract tests compare the current runtime validators with exported schemas, including mutated inputs and non-mutation checks. `npm run typecheck` also checks narrowing and invalid-type cases, and `check:build` verifies generated schemas. See the [migration work plan](docs/typescript-migration.md) for phase status and remaining work.\n\nThe project-mode CLI and HTML renderer are maintained in `src/birdview.mts` and `src/render.mts`; run `npm run build` after editing. Strict TypeScript targets Node.js 18-compatible ESM and emits the existing `scripts/*.mjs` command paths. Distribute generated files with their sources so skill users do not need to compile. CI checks types and compares a temporary clean build with distributed JavaScript. Do not edit generated files directly. The renderer's temporary declaration has been removed; external architecture JSON still requires runtime validation. The browser entry is also TypeScript.\n\nRepository checks are also maintained in `src/check-docs.mts` and `src/check-build.mts`; regenerate their distributed scripts with `npm run build`. `npm test` strictly checks all TypeScript tests and bundles unit tests into the ignored `.test-build/` directory. Tests import distributed modules, so CLI main guards and installation behavior remain intact. `npm run test:browser` runs the compiled browser suites. The committed build checker can verify a clean checkout without first overwriting the artifacts it checks.\n\nBrowser implementation is maintained in `src/viewer/main.mts` with explicit imports from `routing.mts` and `i18n.mts`. The entry owns DOM language updates, activity, constraints and guide state; no implicit cross-script globals or textual JavaScript insertion remain. `tsconfig.viewer.json` checks it without Node globals. Pinned esbuild emits the self-contained `assets/viewer.js` and pure ESM modules for tests; `check:build` verifies all outputs. Routing and translation tests cover current behavior without retaining old implementations. Preserve CSS, labels and interaction behavior and verify screenshots when changing this boundary.\n\n## Commit rules\n\n- Do not run `git add`, `git commit`, `git push`, create branches or rewrite history without an explicit user request.\n- Use Conventional Commit titles in the format `type(scope): 中文说明 / English summary`.\n- Each commit must contain one logically consistent set of changes. Stage and commit different kinds of changes separately.\n- Do not commit local state or temporary build artifacts; follow each directory's `.gitignore`. Distributed JavaScript generated from `src/` under `scripts/`, browser bundle `assets/viewer.js`, and generated exchange schemas under `schemas/` are intentional exceptions and must accompany changes to their TypeScript source. Do not commit `.test-build/`.\n- Before committing, inspect the staged diff and exclude unrelated files, generated artifacts, debug output and unexplained formatting.\n- When committing only part of a dirty workspace, validate the selected changes in a clean checkout without unrelated files. Run the checks above, including `check:build` and documentation validation, against that exact snapshot. A passing check in the original workspace does not validate the selected commit. After committing, run `check:install` before pushing. Register new generated modules in `build-artifacts.json`; generate documentation hashes from the same snapshot, never from unrelated unfinished work.\n\n## Documentation maintenance\n\n- Pair English `name.md` with Chinese `name.zh.md` in the same directory, with reciprocal links below the first heading. Prefer same-language references; avoid mixed-language prose.\n- Keep both versions equivalent, including examples, constraints and limitations. Preserve identifiers, commands, data paths and enums. Edit/review both together, not a summary translation.\n- User instructions take precedence. Resolve discrepancies against implementation and authorized requirements, then fix both versions; neither language overrides the other.\n- `SKILL.md` alone retains executable frontmatter (`name`, `description`); `SKILL.zh.md` is a reading companion, not another registration.\n- Pair new owned Markdown in the root, `references/`, `docs/` and `examples/`. Add new owned directories to the checker; exclude dependencies and generated output.\n\n## Verify and record\n\n```sh\nnode scripts/check-docs.mjs\n```\n\nChecks pairs, language links, local Markdown links and changes since confirmation. `docs/i18n.json` stores SHA-256 hashes with CRLF normalized to LF; hashes cannot verify translation accuracy.\n\nOnly after reviewing both versions, refresh and commit the record with the paired files:\n\n```sh\nnode scripts/check-docs.mjs --update\n```\n\nNever refresh hashes merely to silence a failure.\n\nWebsite and theme startup are maintained in `src/site/main.mts` and `src/viewer/theme.mts`. Their generated distribution artifacts are `docs/site.js` and `assets/theme.js`; commit them with their sources. The renderer embeds the theme startup before styles to preserve theme selection before first paint. `build` and `check:build` cover both artifacts.\n\n`build-artifacts.json` inventories every distributed JS module and exchange schema. `check:build` rejects missing, stale, unlisted and obsolete output. `npm run check:install` audits the committed `HEAD` archive using Git and tar, installs dependencies in a temporary directory, runs doctor and setup/uninstall for all three agents before building, and checks artifact reproduction. Commit first; it intentionally excludes uncommitted work and never uses the checkout’s node_modules."},"source-104e1cb23e91dd57-s1":{"body":"来源：`.agents/skills/birdview/CONTRIBUTING.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Contribution Guidelines\n\n[中文](CONTRIBUTING.zh.md)\n"},"source-104e1cb23e91dd57-s2":{"body":"来源：`.agents/skills/birdview/CONTRIBUTING.md:5-19`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Development and pull requests\n\nUse Node.js 18 or newer. Fork the repository on GitHub, work in a focused branch in your fork, then open a PR against the upstream default branch. For substantial features, discuss the problem in an issue first. Bug reports should include reproducible steps and sanitized inputs.\n\n```sh\nnpm ci\nnpm run check:pr\n```\n\n`check:pr` is the single pre-PR checklist. It runs type checking, generated-artifact checks, unit tests, browser tests, tracked-demo regeneration and diff verification, example validation, and documentation checks. Run it after editing and before committing; do not skip browser or generated-demo checks for viewer changes.\n\nFor viewer or renderer changes, run `npm run build:demo` and review the tracked demo diff. Verify Chinese and English, desktop and mobile, and the affected interactions. Run `npx playwright install chromium` and `npm run test:browser` for real-browser checks; see the [r  Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Project Activation Mode\n\n[中文](modes.zh.md)\n\nBirdview is on-demand by default, defaulting to `on-demand`. It runs when the user selects the skill, explicitly requests Birdview or asks for an architecture/constraint/change map. Ordinary coding, small fixes and feature planning do not trigger it; planning alone does not authorize editing.\n\n## Invocation\n\nIn Codex, select Birdview through `/skills` or mention `$birdview`; in Claude Code, use `/birdview`. Other hosts use their own skill selector or an explicit request; the same slash commands are not guaranteed. Invocation applies to the current task. Merely discussing Birdview does not start mapping.\n\n## Configuration and migration\n\n```sh\nnode \u003cskill-root>/scripts/birdview.mjs setup --project \u003cproject-root>\nnode \u003cskill-root>/scripts/birdview.mjs mode auto --project \u003cproject-root>\nnode \u003cskill-root>/scripts/birdview.mjs mode on-demand --project \u003cproject-root>\nnode \u003cskill-root>/scripts/birdview.mjs mode off --project \u003cproject-root>\nnode \u003cskill-root>/scripts/birdview.mjs mode --project \u003cproject-root>\nnode \u003cskill-root>/scripts/birdview.mjs uninstall --project \u003cproject-root>\n```\n\n`setup` defaults new projects to `on-demand` and preserves any existing `auto`, `on-demand` or `off` mode. Use `mode auto` to opt in to activation before every code-changing task, including small edits, and planning that explicitly analyzes affected modules. Use `mode on-demand` to return to explicit invocation. Queries are read-only. Updating skill files does not rewrite other projects; verify the selected mode in a fresh task.\n\nFoundation rules are separate from map activation. `setup`, `mode auto` and `mode on-demand` install [foundation.txt](foundation.txt), covering focused source reading, evidence, proportional verification and collaboration records without requiring skill reading or mapping. `off` disables foundation and mapping except for explicit invocation in the current task. `uninstall` removes only the project block, preserving the file, other rules, skill and maps; retaining the skill restores default on-demand behavior.\n\n## Storage and boundaries\n\nUse absolute paths for the installed skill and target project root. Without `--project`, only the current directory is used; parents are not searched. `--agent codex` (default) and `--agent deepseek` use `AGENTS.md`; `--agent claude-code` uses `CLAUDE.md`. Use the same agent for reads and writes; files are not synchronized. A source checkout can optionally run `npm link` and use `birdview mode`; Node commands do not require linking.\n\nOnly the block between `\u003c!-- birdview:mode:start -->` and `\u003c!-- birdview:mode:end -->` is modified; surrounding bytes are preserved. Repeated configuration is idempotent; malformed or duplicate markers and non-regular files prevent writes. Managed blocks contain English machine instructions.\n\nThese settings depend on host loading, not filesystem interception. Do not overwrite conflicting instructions elsewhere; report known conflicts. Existing sessions may retain old instructions, and CLI tests establish configuration behavior only; verify actual skill selection and artifacts in a new task."},"source-82ca0f43396ee087-s1":{"body":"来源：`.agents/skills/birdview/references/modes.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Project Activation Mode\n\n[中文](modes.zh.md)\n\nBirdview is on-demand by default, defaulting to `on-demand`. It runs when the user selects the skill, explicitly requests Birdview or asks for an architecture/constraint/change map. Ordinary coding, small fixes and feature planning do not trigger it; planning alone does not authorize editing.\n"},"source-82ca0f43396ee087-s2":{"body":"来源：`.agents/skills/birdview/references/modes.md:7-10`\n\n约束来源图 / Constraint source g  not the target repository; Node.js and Git are required. Run `npm ci` in the installed skill directory once as described in the installation guide; no frontend build is needed to run these commands.\n\n## Discover the declared scope\n\n```sh\nnode scripts/discover-constraints.mjs /path/to/repository /output/constraints.catalog.json \"Project name\"\n```\n\nNext read the collected sources and author the reviewed selection below. Integrated delivery uses `birdview.mjs deliver` after that review; do not generate source-only or standalone rule pages as intermediate steps. `render-constraints.mjs catalog.json sources.html --sources` remains an optional source-inspection aid.\n\nThe collector reads committed HEAD without modifying the repository. It enumerates tracked AGENTS.md, CLAUDE.md, GEMINI.md, SKILL.md, root CONTRIBUTING.md, GitHub Copilot instructions and Cursor rules, then follows local Markdown links and quoted Markdown paths recursively. It preserves source text, heading hierarchy, line ranges and file history. It excludes recognized fixtures, archives and duplicate Chinese translations, retaining reasons. References indicate discovery, not authority or automatic activation. A skill is conditional on its task; a directory instruction applies only under the host's inheritance rules. Implemented decision notes remain reference evidence, not automatically current rules.\n\nInspect `coverage.entries`, `excluded`, `unresolved`, `uninspectedPaths` and `limitations`. Resolve material missing references or explicitly preserve the gap. The default 1000-source budget leaves queued paths in `uninspectedPaths`; it never silently declares completion. Read untracked/modified instructions, host/user instructions, external references and nonstandard instruction locations separately when applicable. Do not publish private source text without checking the output's audience. Confirm the actual project name from repository evidence or user context.\n\nThe output is a **source inventory**, not an automatic semantic audit. Sections may contain multiple rules or explanatory prose. Do not describe the number of nodes/sections as the number of effective constraints. Completeness is relative to a named revision, declared entry conventions and resolved references, never the entire lifetime of a project.\n\n## Review rules\n\nRead every included instruction/skill and relevant referenced section for the requested scope. Split independent obligations into stable rule IDs; retain exact provenance, applicability conditions, overrides and unresolved conflicts. Cross-links and similar wording do not prove identical authority. Do not discard a source because it was not in the initial examples. Keep excluded fixture instructions and historical notes out of effective rules.\n\nThe default graph requires reviewed `rules` and `ruleReview.scope`; it rejects an unreviewed source catalog. Source collection alone is not a completed human-facing constraint graph. Each rule must answer what to do, when it applies, why it matters and how to check it. Keep source text in details. Deduplicate obligations without losing conditions or provenance; do not infer applicable rules from headings alone.\n\nAuthor `reviewed-rules.json` with the same `revision`, an honest `scope`, and `groups`. Each group has `sourcePath`, `category`, optional `topic: {id, name}`, and `rules`. Each authored rule has a stable `id`, short `name`, a unique verbatim `anchor` from its source, `explanation`, `condition`, `verification` and optional `applicability`. The compiler resolves the anchor to a paragraph/list item and extracts real line ranges, rejecting absent/ambiguous anchors and snapshot mismatches. It does not perform semantic review. The DeepSeek example at `examples/deepseek-constraints.rules.json` illustrates the format; its project-specific rules must not be copied into other projects.\n\nThe resulting catalog's required `rules` entries look like:\n\n```json\n{\n  \"id\": \"rule-model-visible-log\",\n  \"category\": \"interfaces\",\n  \"sourcePath\": \"AGENTS.md\",\n  \"line\": 111,\n  \"endLine\": 111,\n  \"name\": \"Log model-visible inputs\",\n  \"explanation\": \"New input sent to a model needs a durable session event.\",\n  \"condition\": \"When introducing model-visible input\",\n  \"applicability\": \"conditional\",\n  \"verification\": \"Inspect the event and replay path; run the relevant replay test.\"\n}\n```\n\nLine numbers here are illustrative: inspect the target snapshot. Supported applicability values are `applicable`, `conditional`, `superseded`, `conflict`, `uncertain`. Explain any supersession/conflict in `explanation`. The renderer extracts the quote from that source; it does not invent quotations. Keep `coverage.semanticReview: pending` until review covers the declared scope; record remaining review gaps in limitations and `ruleReview.scope`. Partial reviewed scope is deliverable only when clearly labeled; never call it the complete effective rule set. To use rules during architecture/change work, map reviewed rules into the existing [constraints contract](constraints.md), retaining source evidence and applicability rather than copying graph categories into module ownership.\n\n## History and verification\n\nKeep three identities separate: stable `rule.id` (the displayed R-number is only a presentation ordinal), rule source-history `vN`, and the full project snapshot commit. Integrated delivery collects history with `deliver --catalog ... --rules ... --repo ...`; do not compile again separately. For a standalone constraint-only page, pass the repository as the fourth compiler argument:\n\n```sh\nnode scripts/compile-constraint-rules.mjs catalog.json reviewed-rules.json versioned.json /path/to/repository\nnode scripts/render-constraints.mjs versioned.json constraints.html\n```\n\nThe compiler checks source text against the fixed snapshot and runs Git line history for each quoted paragraph/list item. It records `history` with `status: tracked`, `method: git-line-history`, `snapshot`, `sourcePath`, `line`, `endLine`, `version`, `lastEdited`, and the actual `commits` array of `{commit,date}`. This is the count of source-range history entries, not semantic releases or revisions of the agent's explanation. Moving/reformatting text or sharing one paragraph between obligations can affect the count. Do not manually manufacture these fields or substitute the whole-file history. Rendering validates provenance consistency, not the truth of authored Git evidence; use the collector. Existing source history is discarded when recompiling author input to prevent stale reuse.\n\nCards show the R-number, `vN` and role; details include the method and full commit evidence, while the legend shows the project snapshot. Missing history, shallow clones or unavailable line history show “版本未追踪” rather than v1. Collection never fetches history automatically. The renderer rejects tracked history belonging to another snapshot or source range. Group nodes have no invented versions. When using another AI, require the reviewed selection, versioned catalog and rendered HTML together so provenance remains reviewable.\n\nOn source-file nodes, vN is the number of Git history entries for that **file's current path**, not a rule's semantic version; rename ancestry is not followed. Dates also belong to the file. Shallow history suppresses version counts and is disclosed; never silently fetch or present a shallow count as complete. Raw sections have no invented individual versions. Unknown compliance stays pending even when the source is committed.\n\nCode drift requires inspected implementation links and a justified baseline. Use `constraint-freshness.mjs` with the architecture contract for file changes. Do not infer ownership from headings, treat all later commits as violations, or manufacture colorful status badges. The historical six-rule DeepSeek prototype uses a different, explicitly limited line-history heuristic; it is not the general scanner and must not supply global compliance statistics. Checks and code-review evidence belong in `constraintReviews`, separately from source age and applicability.\n\n## Integrate into an architecture page\n\nKeep the architecture page's original horizontal toolbar and canvas layout. The native constraint view has a rule directory, tree canvas and on-demand reading panel; no application icon rail, bottom status bar or iframe. Do not add a module-directory sidebar to the architecture page.\n\n\nWhen the user requests a combined page, reuse the existing architecture JSON and render both views:\n\n```sh\nnode scripts/birdview.mjs deliver architecture.json project.html --constraints versioned.json\n```\n\nActivity JSONL and `--repo` remain optional. The command writes `project.html` and the auxiliary `project.sources.html`; distribute both together. If the selection has not been compiled yet, use `--catalog catalog.json --rules reviewed-rules.json --repo /path/to/repository` instead of `--constraints`; it also writes `project.constraints.json`. See [delivery.md](delivery.md) for strict authoring, bilingual/legacy checks, warnings and failure handling. The existing renderer API still accepts `constraintCatalog` and optional `constraintSourceHref` in its third argument; API callers generate the auxiliary source index themselves.\n\nBoth views retain their canvas state when switching. The header keeps the project name, language controls and shared light/dark theme; role colors keep the same meaning. Architecture revision and constraint snapshot are distinct identities. Controls use the host language; authored rules and source quotations stay in their original language. The source index is an auxiliary page, not a second main graph.\n\nProject names must match. Optional module links require an explicit catalog `architectureBinding: {mapId, mapRevision, sourceRevision}` matching the map and the full catalog commit, plus `modules: [\"module-id\"]` on reviewed rules. Carry this binding in the reviewed selection when compiling; recompilation discards old catalog bindings. Inspect source evidence before authoring links. The renderer rejects stale bindings and unknown module IDs. Role similarity is never a module link. Without bindings, the full graph still works and module details say no links are recorded. With bindings, the module button opens only linked rules and their ancestors; “Show all rules” restores the full graph. Changing this filter initializes a new constraint layout; switching architecture/constraints alone preserves it. Versions and verification evidence remain unchanged by filtering.\n\nCheck both views, switching without state loss, theme changes, Chinese/English navigation, narrow screens, module filters and the source-index link. Keep the original architecture layout intact. A conceptual demo map must still be described as conceptual even if its accompanying constraints come from real source history.\n\n## Render and deliver\n\n`render-constraints.mjs` consumes `birdview.constraint-catalog/v1` and defaults to a **rule graph**: project → category → optional human-named topic → rule. The six categories are `lifecycle`, `interfaces`, `configuration`, `security`, `testing`, `delivery`. Topics use numbers and text. Colors share architecture role semantics: frontend blue, backend teal, cache cyan, database violet, queue amber, security rose, generic slate. Rules may declare targetRole; non-generic roles require a source-grounded roleReason. Cross-role or unclear scope stays generic; never infer role from topic name. Homogeneous groups inherit their role color; mixed groups use generic. The toolbar role legend counts rules, and cards carry textual IDs and role names. Applicability and verification remain separate in details; colors never mean pass or fail. Prefer concise, actionable titles. Cards clamp long titles to two lines while tooltips and the reading panel retain the full title. Use topic groups to keep each expanded level readable, usually no more than eight children. File age/version and collection counts do not occupy rule cards. Do not show thousands of uniformly pending source nodes as the main view.\n\nThe renderer uses Birdview-owned HTML cards, SVG connectors and subtree layout, without a third-party graph runtime. `constraint-canvas.js` mounts the same component in standalone and integrated pages. `constraint-page.html` supplies the standalone shell; `constraint-canvas.css` scopes styles to the constraint view. `buildConstraintGraph()` prepares a `birdview.constraint-view/v1` presentation payload without changing the input catalog contract. Details lead with applicability, explanation and verification plan, then source evidence and rule history. Documents render as safe text with basic headings and quotes; arbitrary HTML and embedded diagrams are not executed. All collected sources, including unreviewed skills and references, appear in By directory; double-click a source to read its text and review status. Coverage remains under Coverage. The toolbar does not navigate to another page. The CLI retains the sibling `.sources.html` export for compatibility; `--sources` renders only that auxiliary export.\n\nOpen the HTML and check expansion, source reading, long content and coverage disclosures at desktop and narrow widths. Report actual collection counts, unresolved/excluded areas, semantic-review status and tests run. Source collection can be complete while effective-rule review remains incomplete; state those separately. The page is offline and read-only, not a live monitor or enforcement mechanism. Generated native pages include the Birdview license; preserve licenses for dependencies actually distributed.\n\n\nDirectory and canvas share expansion and selection. Search matches rule titles, explanations and source text while preserving ancestor paths. More than 100 matches show only the first 100 with an explicit message, keeping a large source inventory off the main canvas. Support drag-to-pan, Ctrl/Command + scroll zoom, pinch zoom, zoom buttons and fit. With canvas focus, arrows pan, plus/minus zoom and 0 fits; cards support Enter and left/right navigation, while Escape closes overlays. On narrow screens the directory starts closed and closes after selection; details use a drawer. Expansion, search and zoom never change rule history or verification state.\n\n## Directory and topic views\n\nThe reviewed graph offers By topic and By directory over the same rule IDs, versions and documents. Discover root and nested instruction files before grouping. Directory nodes list local sources and ancestor instruction candidates using recorded source scope; storage paths alone never prove applicability, override, or conflict resolution. Skills and references require invocation/reference review. Include collected instruction files without extracted rules and explicitly mark extraction gaps. Directory placement is source provenance, not module ownership. Preserve module filters when switching views. Node double-click or Shift+Enter opens the shared detail dialog."},"source-60d54e4d2d6fc7a5-s1":{"body":"来源：`.agents/skills/birdview/references/constraint-graph.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Constraint graphs\n\n[中文](constraint-graph.zh.md)\n\nUse this route for a standalone constraint graph, a repository-wide inventory or the constraint portion of the default integrated delivery. Preserve the architecture viewer. All commands below are relative to the installed skill, not the target repository; Node.js and Git are required. Run `npm ci` in the installed skill directory once as described in the installation guide; no frontend build is needed to run these commands.\n"},"source-60d54e4d2d6fc7a5-s2":{"body":"来源：`.agents/skills/birdview/references/constraint-graph.md:7-20`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文
