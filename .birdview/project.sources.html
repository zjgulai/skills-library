ired `rules` entries look like:\n\n```json\n{\n  \"id\": \"rule-model-visible-log\",\n  \"category\": \"interfaces\",\n  \"sourcePath\": \"AGENTS.md\",\n  \"line\": 111,\n  \"endLine\": 111,\n  \"name\": \"Log model-visible inputs\",\n  \"explanation\": \"New input sent to a model needs a durable session event.\",\n  \"condition\": \"When introducing model-visible input\",\n  \"applicability\": \"conditional\",\n  \"verification\": \"Inspect the event and replay path; run the relevant replay test.\"\n}\n```\n\nLine numbers here are illustrative: inspect the target snapshot. Supported applicability values are `applicable`, `conditional`, `superseded`, `conflict`, `uncertain`. Explain any supersession/conflict in `explanation`. The renderer extracts the quote from that source; it does not invent quotations. Keep `coverage.semanticReview: pending` until review covers the declared scope; record remaining review gaps in limitations and `ruleReview.scope`. Partial reviewed scope is deliverable only when clearly labeled; never call it the complete effective rule set. To use rules during architecture/change work, map reviewed rules into the existing [constraints contract](constraints.md), retaining source evidence and applicability rather than copying graph categories into module ownership.\n"},"source-60d54e4d2d6fc7a5-s4":{"body":"来源：`.agents/skills/birdview/references/constraint-graph.md:48-64`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## History and verification\n\nKeep three identities separate: stable `rule.id` (the displayed R-number is only a presentation ordinal), rule source-history `vN`, and the full project snapshot commit. Integrated delivery collects history with `deliver --catalog ... --rules ... --repo ...`; do not compile again separately. For a standalone constraint-only page, pass the repository as the fourth compiler argument:\n\n```sh\nnode scripts/compile-constraint-rules.mjs catalog.json reviewed-rules.json versioned.json /path/to/repository\nnode scripts/render-constraints.mjs versioned.json constraints.html\n```\n\nThe compiler checks source text against the fixed snapshot and runs Git line history for each quoted paragraph/list item. It records `history` with `status: tracked`, `method: git-line-history`, `snapshot`, `sourcePath`, `line`, `endLine`, `version`, `lastEdited`, and the actual `commits` array of `{commit,date}`. This is the count of source-range history entries, not semantic releases or revisions of the agent's explanation. Moving/reformatting text or sharing one paragraph between obligations can affect the count. Do not manually manufacture these fields or substitute the whole-file history. Rendering validates provenance consistency, not the truth of authored Git evidence; use the collector. Existing source history is discarded when recompiling author input to prevent stale reuse.\n\nCards show the R-number, `vN` and role; details include the method and full commit evidence, while the legend shows the project snapshot. Missing history, shallow clones or unavailable line history show “版本未追踪” rather than v1. Collection never fetches history automatically. The renderer rejects tracked history belonging to another snapshot or source range. Group nodes have no invented versions. When using another AI, require the reviewed selection, versioned catalog and rendered HTML together so provenance remains reviewable.\n\nOn source-file nodes, vN is the number of Git history entries for that **file's current path**, not a rule's semantic version; rename ancestry is not followed. Dates also belong to the file. Shallow history suppresses version counts and is disclosed; never silently fetch or present a shallow count as complete. Raw sections have no invented individual versions. Unknown compliance stays pending even when the source is committed.\n\nCode drift requires inspected implementation links and a justified baseline. Use `constraint-freshness.mjs` with the architecture contract for file changes. Do not infer ownership from headings, treat all later commits as violations, or manufacture colorful status badges. The historical six-rule DeepSeek prototype uses a different, explicitly limited line-history heuristic; it is not the general scanner and must not supply global compliance statistics. Checks and code-review evidence belong in `constraintReviews`, separately from source age and applicability.\n"},"source-60d54e4d2d6fc7a5-s5":{"body":"来源：`.agents/skills/birdview/references/constraint-graph.md:65-83`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Integrate into an architecture page\n\nKeep the architecture page's original horizontal toolbar and canvas layout. The native constraint view has a rule directory, tree canvas and on-demand reading panel; no application icon rail, bottom status bar or iframe. Do not add a module-directory sidebar to the architecture page.\n\n\nWhen the user requests a combined page, reuse the existing architecture JSON and render both views:\n\n```sh\nnode scripts/birdview.mjs deliver architecture.json project.html --constraints versioned.json\n```\n\nActivity JSONL and `--repo` remain optional. The command writes `project.html` and the auxiliary `project.sources.html`; distribute both together. If the selection has not been compiled yet, use `--catalog catalog.json --rules reviewed-rules.json --repo /path/to/repository` instead of `--constraints`; it also writes `project.constraints.json`. See [delivery.md](delivery.md) for strict authoring, bilingual/legacy checks, warnings and failure handling. The existing renderer API still accepts `constraintCatalog` and optional `constraintSourceHref` in its third argument; API callers generate the auxiliary source index themselves.\n\nBoth views retain their canvas state when switching. The header keeps the project name, language controls and shared light/dark theme; role colors keep the same meaning. Architecture revision and constraint snapshot are distinct identities. Controls use the host language; authored rules and source quotations stay in their original language. The source index is an auxiliary page, not a second main graph.\n\nProject names must match. Optional module links require an explicit catalog `architectureBinding: {mapId, mapRevision, sourceRevision}` matching the map and the full catalog commit, plus `modules: [\"module-id\"]` on reviewed rules. Carry this binding in the reviewed selection when compiling; recompilation discards old catalog bindings. Inspect source evidence before authoring links. The renderer rejects stale bindings and unknown module IDs. Role similarity is never a module link. Without bindings, the full graph still works and module details say no links are recorded. With bindings, the module button opens only linked rules and their ancestors; “Show all rules” restores the full graph. Changing this filter initializes a new constraint layout; switching architecture/constraints alone preserves it. Versions and verification evidence remain unchanged by filtering.\n\nCheck both views, switching without state loss, theme changes, Chinese/English navigation, narrow screens, module filters and the source-index link. Keep the original architecture layout intact. A conceptual demo map must still be described as conceptual even if its accompanying constraints come from real source history.\n"},"source-60d54e4d2d6fc7a5-s6":{"body":"来源：`.agents/skills/birdview/references/constraint-graph.md:84-94`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Render and deliver\n\n`render-constraints.mjs` consumes `birdview.constraint-catalog/v1` and defaults to a **rule graph**: project → category → optional human-named topic → rule. The six categories are `lifecycle`, `interfaces`, `configuration`, `security`, `testing`, `delivery`. Topics use numbers and text. Colors share architecture role semantics: frontend blue, backend teal, cache cyan, database violet, queue amber, security rose, generic slate. Rules may declare targetRole; non-generic roles require a source-grounded roleReason. Cross-role or unclear scope stays generic; never infer role from topic name. Homogeneous groups inherit their role color; mixed groups use generic. The toolbar role legend counts rules, and cards carry textual IDs and role names. Applicability and verification remain separate in details; colors never mean pass or fail. Prefer concise, actionable titles. Cards clamp long titles to two lines while tooltips and the reading panel retain the full title. Use topic groups to keep each expanded level readable, usually no more than eight children. File age/version and collection counts do not occupy rule cards. Do not show thousands of uniformly pending source nodes as the main view.\n\nThe renderer uses Birdview-owned HTML cards, SVG connectors and subtree layout, without a third-party graph runtime. `constraint-canvas.js` mounts the same component in standalone and integrated pages. `constraint-page.html` supplies the standalone shell; `constraint-canvas.css` scopes styles to the constraint view. `buildConstraintGraph()` prepares a `birdview.constraint-view/v1` presentation payload without changing the input catalog contract. Details lead with applicability, explanation and verification plan, then source evidence and rule history. Documents render as safe text with basic headings and quotes; arbitrary HTML and embedded diagrams are not executed. All collected sources, including unreviewed skills and references, appear in By directory; double-click a source to read its text and review status. Coverage remains under Coverage. The toolbar does not navigate to another page. The CLI retains the sibling `.sources.html` export for compatibility; `--sources` renders only that auxiliary export.\n\nOpen the HTML and check expansion, source reading, long content and coverage disclosures at desktop and narrow widths. Report actual collection counts, unresolved/excluded areas, semantic-review status and tests run. Source collection can be complete while effective-rule review remains incomplete; state those separately. The page is offline and read-only, not a live monitor or enforcement mechanism. Generated native pages include the Birdview license; preserve licenses for dependencies actually distributed.\n\n\nDirectory and canvas share expansion and selection. Search matches rule titles, explanations and source text while preserving ancestor paths. More than 100 matches show only the first 100 with an explicit message, keeping a large source inventory off the main canvas. Support drag-to-pan, Ctrl/Command + scroll zoom, pinch zoom, zoom buttons and fit. With canvas focus, arrows pan, plus/minus zoom and 0 fits; cards support Enter and left/right navigation, while Escape closes overlays. On narrow screens the directory starts closed and closes after selection; details use a drawer. Expansion, search and zoom never change rule history or verification state.\n"},"source-60d54e4d2d6fc7a5-s7":{"body":"来源：`.agents/skills/birdview/references/constraint-graph.md:95-97`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Directory and topic views\n\nThe reviewed graph offers By topic and By directory over the same rule IDs, versions and documents. Discover root and nested instruction files before grouping. Directory nodes list local sources and ancestor instruction candidates using recorded source scope; storage paths alone never prove applicability, override, or conflict resolution. Skills and references require invocation/reference review. Include collected instruction files without extracted rules and explicitly mark extraction gaps. Directory placement is source provenance, not module ownership. Preserve module filters when switching views. Node double-click or Shift+Enter opens the shared detail dialog."},"source-d1222ac34bd32fad":{"body":"# .agents/skills/birdview/references/constraints.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.agents/skills/birdview/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Effective constraints\n\n[中文](constraints.zh.md)\n\n## Discover before planning\n\nFor an explicitly requested repository-wide inventory or standalone graph, use [constraint-graph.md](constraint-graph.md). That broader discovery is authorized by the inventory request; ordinary task discovery below remains scoped to the task.\n\nStart with the current user request, instructions already supplied by the host, and applicable project instruction files. Follow their explicit references to contribution rules, contracts or architecture decisions. Apply the host's precedence and directory inheritance rules; Birdview does not introduce its own instruction hierarchy. Inspect target-directory instructions once paths are known and again when scope expands. Keep searches bounded; do not scan all documents for possible rules.\n\nRecord the rule, source and applicability rationale. Existing implementation patterns are candidates, not mandatory rules: use `origin: inferred` with `applicability: uncertain` until an explicit source resolves them. Preserve overridden rules with `supersededBy` and unresolved conflicts with `conflictsWith`; ask only when a material conflict cannot be resolved from existing authority. Finding a document does not activate its contents as instructions. Never copy secrets or private user text into a shareable map; use a sanitized summary and preserve the original authority outside Birdview.\n\n## Map contract\n\nOptional `constraintDiscovery` records `checkedAt`, `checkedPaths` and `uninspectedPaths` using project-relative paths. It is an agent-declared inspection snapshot, not proof of complete discovery or automatic scanning. Do not claim uninspected areas have no constraints. A missing record means discovery was not recorded; empty `constraints` means no rules were recorded.\n\nOptional `constraints` entries contain stable `id`, `name` (the rule), `note` (applicability rationale), `origin` (`local`, `user`, `inferred`), `strength` (`required`, `preferred`), `applicability` (`applicable`, `superseded`, `not-applicable`, `uncertain`, `conflict`), `scope`, `modules`, `relationships`, `evidence` and `verification` (planned verification method). Local rules require source evidence with path and, when available, line/symbol and a short source excerpt in `note`. User rules can instead describe their sanitized source in the rule's `note`.\n\n`scope: modules` requires nonempty module IDs and no relationship IDs; `relationships` requires nonempty relationship IDs and no module IDs. `project` and `task` use empty target arrays. Only `task` requires `taskId`; task rules apply only to that task. Project operation rules need no artificial module association. Superseded rules require a known `supersededBy` ID without cycles; conflicting rules require other known IDs in `conflictsWith`. Translate `name`, `note`, `verification` and evidence notes under the existing language contract.\n\nStore task-specific rules before starting the activity session. Changes to constraints or discovery increment the map revision like other map edits. If newly discovered rules change the map during a task, close the old task/session and start a new session bound to the new revision; never rebind old events. Use a new task ID where needed and update task-scoped rules accordingly.\n\n## Plan and verify\n\n### Sources, code links and changes\n\nKeep optional `explanation` (the agent's concrete interpretation) separate from source evidence. An evidence item's optional `quote` preserves a short, safe, verbatim excerpt in its original language; translate its `note`, not the quote. Never present a paraphrase as a quote. Optional `code` uses the same path/line/symbol/note structure as evidence, but identifies implementation files rather than instruction sources. Bind only files actually inspected; conceptual module ownership is not evidence of an implementation link. Translate explanation and code notes for bilingual delivery.\n\nRecord optional `baselineCommit` as a full Git commit from the project after inspecting the rule and its linked files. This is a comparison baseline, not a compliance claim. Compare declared source and code files before planning and again after edits:\n\n```sh\nnode scripts/constraint-freshness.mjs architecture.json /path/to/project\nnode scripts/render.mjs architecture.json architecture.html activity.jsonl --repo /path/to/project\n```\n\nUse the repository root. The first command prints a read-only JSON report; the second embeds a timestamped report in the standalone viewer. Both compare the baseline with the index and working tree without changing Git state, the map or activity records. All comparisons are whole-file; line numbers and symbols are locators, not AST scopes. Changed or missing files require review, not a violation verdict. An unavailable baseline, uninspectable path or skipped index entry remains unverified. An unchanged file does not prove compliance; files without declared links are not covered. Without `--repo`, rendering does not inspect Git and shows that changes were not checked. The page never watches the filesystem; rerender after further edits. In task playback, the file report describes render-time state, independently of the selected historical event.\n\nWhen a change is flagged, inspect the diff against the original rule. Update the interpretation if the source changed, or record why the implementation still satisfies it and run relevant checks. Do not advance the baseline merely to remove the reminder. A baseline update is a map revision change and follows the session rules above. Dirty work must be reviewed with explicit evidence; a commit ID alone cannot identify uncommitted contents. Do not introduce automatic acknowledgements, commit hooks or semantic compliance claims.\n\nFor each applicable rule related to the task scope, record `constraintReviews` in the activity event. Each review has `constraintId`, `plan`, `status` (`unverified`, `supported`, `violated`), `method` (`test`, `review`), `evidence` (empty while pending) and `checkIndexes` (zero-based references into this event's `checks`). Relationship rules relate to either endpoint in scope; project rules always relate. Recheck applicability when scope expands. Legacy events remain valid without reviews.\n\nOptional review `checkedAt` and full `gitCommit` record when and against which commit the review ran. Describe any uncommitted changes in `evidence`. These fields do not clear file-change reminders or transfer a historical result onto current code.\n\nEach event is a complete review snapshot: omitted reviews display as unverified, and prior results are never carried forward automatically. Start plans as unverified. Supported or violated results require evidence; test-supported results require linked passing checks. Manual reviews use textual evidence and empty check indexes. Translate `plan` and `evidence` in each review's `translations` when delivering both languages. A passing test only supports the stated coverage, not every constraint. Terminal events may remain unverified or report violations; completion never establishes compliance.\n\n## Viewer\n\nThe constraints toolbar button opens the existing inspector. Filter applicable rules, the selected module, changes needing review, uncertain/conflicting rules or all rules. Module details link to applicable rules; selecting a rule highlights its target modules and relationships without changing activity scope. Details separate applicability, explanation, source excerpts, linked code, file changes and verification evidence. Recorded verbatim excerpts are expanded by default; the standalone page does not load source files. Task views additionally show plans, review methods, review provenance and linked checks for the selected event. Discovery coverage and snapshot timestamps remain inspectable. Corrections require updating source-backed data and rerendering; there is no UI switch to disable rules or filesystem write interception."},"source-d1222ac34bd32fad-s1":{"body":"来源：`.agents/skills/birdview/references/constraints.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Effective constraints\n\n[中文](constraints.zh.md)\n"},"source-d1222ac34bd32fad-s2":{"body":"来源：`.agents/skills/birdview/references/constraints.md:5-12`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Discover before planning\n\nFor an explicitly requested repository-wide inventory or standalone graph, use [constraint-graph.md](constraint-graph.md). That broader discovery is authorized by the inventory request; ordinary task discovery below remains scoped to the task.\n\nStart with the current user request, instructions already supplied by the host, and applicable project instruction files. Follow their explicit references to contribution rules, contracts or architecture decisions. Apply the host's precedence and directory inheritance rules; Birdview does not introduce its own instruction hierarchy. Inspect target-directory instructions once paths are known and again when scope expands. Keep searches bounded; do not scan all documents for possible rules.\n\nRecord the rule, source and applicability rationale. Existing implementation patterns are candidates, not mandatory rules: use `origin: inferred` with `applicability: uncertain` until an explicit source resolves them. Preserve overridden rules with `supersededBy` and unresolved conflicts with `conflictsWith`; ask only when a material conflict cannot efore starting the activity session. Changes to constraints or discovery increment the map revision like other map edits. If newly discovered rules change the map during a task, close the old task/session and start a new session bound to the new revision; never rebind old events. Use a new task ID where needed and update task-scoped rules accordingly.\n"},"source-d1222ac34bd32fad-s4":{"body":"来源：`.agents/skills/birdview/references/constraints.md:23-24`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Plan and verify\n"},"source-d1222ac34bd32fad-s5":{"body":"来源：`.agents/skills/birdview/references/constraints.md:25-45`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### Sources, code links and changes\n\nKeep optional `explanation` (the agent's concrete interpretation) separate from source evidence. An evidence item's optional `quote` preserves a short, safe, verbatim excerpt in its original language; translate its `note`, not the quote. Never present a paraphrase as a quote. Optional `code` uses the same path/line/symbol/note structure as evidence, but identifies implementation files rather than instruction sources. Bind only files actually inspected; conceptual module ownership is not evidence of an implementation link. Translate explanation and code notes for bilingual delivery.\n\nRecord optional `baselineCommit` as a full Git commit from the project after inspecting the rule and its linked files. This is a comparison baseline, not a compliance claim. Compare declared source and code files before planning and again after edits:\n\n```sh\nnode scripts/constraint-freshness.mjs architecture.json /path/to/project\nnode scripts/render.mjs architecture.json architecture.html activity.jsonl --repo /path/to/project\n```\n\nUse the repository root. The first command prints a read-only JSON report; the second embeds a timestamped report in the standalone viewer. Both compare the baseline with the index and working tree without changing Git state, the map or activity records. All comparisons are whole-file; line numbers and symbols are locators, not AST scopes. Changed or missing files require review, not a violation verdict. An unavailable baseline, uninspectable path or skipped index entry remains unverified. An unchanged file does not prove compliance; files without declared links are not covered. Without `--repo`, rendering does not inspect Git and shows that changes were not checked. The page never watches the filesystem; rerender after further edits. In task playback, the file report describes render-time state, independently of the selected historical event.\n\nWhen a change is flagged, inspect the diff against the original rule. Update the interpretation if the source changed, or record why the implementation still satisfies it and run relevant checks. Do not advance the baseline merely to remove the reminder. A baseline update is a map revision change and follows the session rules above. Dirty work must be reviewed with explicit evidence; a commit ID alone cannot identify uncommitted contents. Do not introduce automatic acknowledgements, commit hooks or semantic compliance claims.\n\nFor each applicable rule related to the task scope, record `constraintReviews` in the activity event. Each review has `constraintId`, `plan`, `status` (`unverified`, `supported`, `violated`), `method` (`test`, `review`), `evidence` (empty while pending) and `checkIndexes` (zero-based references into this event's `checks`). Relationship rules relate to either endpoint in scope; project rules always relate. Recheck applicability when scope expands. Legacy events remain valid without reviews.\n\nOptional review `checkedAt` and full `gitCommit` record when and against which commit the review ran. Describe any uncommitted changes in `evidence`. These fields do not clear file-change reminders or transfer a historical result onto current code.\n\nEach event is a complete review snapshot: omitted reviews display as unverified, and prior results are never carried forward automatically. Start plans as unverified. Supported or violated results require evidence; test-supported results require linked passing checks. Manual reviews use textual evidence and empty check indexes. Translate `plan` and `evidence` in each review's `translations` when delivering both languages. A passing test only supports the stated coverage, not every constraint. Terminal events may remain unverified or report violations; completion never establishes compliance.\n"},"source-d1222ac34bd32fad-s6":{"body":"来源：`.agents/skills/birdview/references/constraints.md:46-48`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Viewer\n\nThe constraints toolbar button opens the existing inspector. Filter applicable rules, the selected module, changes needing review, uncertain/conflicting rules or all rules. Module details link to applicable rules; selecting a rule highlights its target modules and relationships without changing activity scope. Details separate applicability, explanation, source excerpts, linked code, file changes and verification evidence. Recorded verbatim excerpts are expanded by default; the standalone page does not load source files. Task views additionally show plans, review methods, review provenance and linked checks for the selected event. Discovery coverage and snapshot timestamps remain inspectable. Corrections require updating source-backed data and rerendering; there is no UI switch to disable rules or filesystem write interception."},"source-320bb25951f4b6f0":{"body":"# .agents/skills/birdview/references/map-project.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.agents/skills/birdview/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Stage 1: Map the project\n\n[中文](map-project.zh.md)\n\nProduce [schema-valid](../schemas/architecture.schema.json) architecture JSON and standalone HTML from the same data for the selected project and scope. Follow [language selection](bilingual.md); examples are fictional field references, not project evidence.\n\n## Discover and verify coverage\n\n1. Check user-provided/documented architecture paths, existing artifact locations, `.birdview/`, then root and `docs/`. Use bounded architecture/map filename searches, excluding dependencies, generated output and skill examples; expand only when those locations and references yield nothing.\n2. Read candidates and verify project relevance, coverage, current ownership and source evidence. Validate Birdview JSON; schema validity does not establish freshness. Prefer the user's selection or documented canonical map; ask only about unresolved competing candidates.\n3. Reuse compatible maps in place and update stale portions. Adapt other formats after source verification, preserving meaningful IDs and the original artifact. HTML/images alone need underlying module/ownership data before Stage 2. Create a map only when none is reusable or adaptable; resolve unavailable validation before Stage 2.\n4. Honor explicit subsystem scope; otherwise inspect the selected project root. Read root documentation, top-level directories and relevant workspace/build manifests, then follow declared applications. Verify each using its own manifest, startup/build entry and source. Dependencies alone do not prove an application; trace client calls and server routes before asserting connections.\n5. Reconcile every in-scope application with a module, explained grouping or explicit coverage gap in new and reused maps. Keep distinct application responsibilities visible; shared packages need not be applications. The 6-10 module readability target never justifies omissions or inventions.\n6. For ordinary local edits, recheck relevant entries and changed manifests. Broaden discovery only when scope or workspace structure changes. Report root/scope, checked applications and module IDs, exclusions and unresolved areas alongside the architecture table. Distinguish uninspected areas from checked absences; zero uncertainty does not prove complete coverage.\n\n## Author the map\n\nTrace main request/data paths and read surrounding symbols before assigning responsibilities. For a specific code area, step up to its responsibility and relevant callers/dependencies within the agreed scope. Stop when that scope is coherently covered.\n\nModel modules as cohesive business or technical responsibilities at a comparable level of abstraction, not one node per file, class or directory. Describe what each does and how it connects to surrounding modules; keep implementation locations in ownership/evidence. Use the project's domain glossary when available, otherwise established terms from source and documentation. Preserve evidenced responsibility boundaries and existing IDs when improving labels.\n\nFollow the [contract](contract.md) for fields, roles, ownership, evidence, status and layout. Choose module roles from inspected responsibilities; use `generic` when unclear, never cycle roles for colors. Roles are independent of ownership and groups. Include external services only for real relationships, without local file ownership. Mark unsupported conclusions `uncertain` with specific open questions; `supported` records inspected evidence, not static proof.\n\nFor new maps, explicitly classify every module; `birdview.mjs deliver` includes strict authoring validation before rendering (add `--bilingual` for Chinese/English delivery). Use standalone `validate.mjs --authoring` only for an earlier diagnostic check, not a redundant delivery step. Generic modules require the contract's `roleAssessment`: explain why the taxonomy does not fit or which evidence is missing; insufficient evidence requires uncertainty and a specific question. Never bulk-default modules to generic to finish faster. Review all-generic warnings module by module against source and report the reasons, rather than inventing different roles to pass. Reuse existing classifications unless new evidence supports a change; explain any downgrade to generic and apply revision rules. Review changed/new module classifications on legacy-map updates; unchanged legacy fields need no forced migration (see the limited `--legacy` option in [delivery.md](delivery.md)).\n\nAuthor directed, concretely labelled relationships with evidence, status, `kind` and `visibility`. Keep core execution, necessary result/tool feedback, basic dependencies and required approvals in `overview`; recovery, retries and diagnostics may be `detail` unless central to the map. Default to `overview` when unsure. Check isolated overview modules for missing connections; keep genuine auxiliary modules and hidden-relation counts. Retain all relationships; kind/visibility do not represent modification scope, and must not change solely to reduce visual clutter.\n\nShow an architecture table (module, responsibility, ownership, evidence, uncertainty) and short relationship list from the same JSON. Allow corrections without redundant approval when continued work is already authorized.\n\n## Groups and revisions\n\nUse optional groups only for evidenced system/subsystem membership: one disjoint level, with stable IDs, names, unique members and nonempty evidence. Groups render side by side, preserving internal row/column order; ungrouped modules remain outside frames. Translate group names and evidence like module text.\n\nChoose group roles from source-supported responsibilities and explain the classification in evidence notes:\n\n| Role | Meaning | Fixed color |\n| --- | --- | --- |\n| `interaction` | User interaction and review | Pale blue |\n| `runtime` | Execution and orchestration | Pale amber |\n| `external-services` | Integrations outside the described system | Pale violet |\n| `generic` | Unspecified or mixed responsibility | Neutral gray |\n\nUnclear or omitted roles use `generic`. Names, ordering, module ownership and color variety are not classification evidence. Group roles do not imply module roles, deployment/trust boundaries or activity state. Keep the shared palette; no per-map overrides or custom color fields. Schema rejects unknown roles/fields but cannot verify classification; check evidence and preserve existing roles unless new evidence warrants change.\n\nRead existing artifacts before replacing them; use the agreed location (default `.birdview/`) without overwriting unrelated files. `project.id` and `mapId` are local identities, not necessarily URLs. Optional `project.revision` records a Git commit, not the map revision or a clean-tree guarantee.\n\nIncrement `revision` for every saved map change, including layout and translations. Preserve IDs for continuing responsibilities and never reassign removed IDs. Complete/cancel tasks on the old map before starting against a new revision; never silently replay old events onto it.\n\n## Render and review\n\nFor the default “use Birdview” delivery, finish the [constraint workflow](constraint-graph.md) before final rendering: inspect effective local instructions, collect committed sources, then author and review `reviewed-rules.json`. The delivery command below compiles it and collects rule history into `.birdview/architecture.constraints.json`. Preserve working-tree instruction differences as explicit limitations. Record actual checked/uninspected paths in `map.constraintDiscovery` under the [constraints contract](constraints.md); a scan is not semantic review. Do not copy the demo rules. Reuse a matching reviewed catalog when valid. Keep scope and snapshot explicit, and only bind rules to modules after source inspection. Save the source catalog and reviewed selection alongside the compiled catalog so another AI can continue the review. If review is incomplete, report that boundary instead of claiming complete delivery. When no reviewed rules exist, deliver the architecture and discovery findings with the limitation; the rule renderer deliberately rejects an empty or unreviewed catalog.\n\nUse the bundled renderer, with absolute paths when running from the user's project; `\u003cskill-root>` contains SKILL.md. Substitute the actual agreed artifact paths:\n\n```sh\nnode \u003cskill-root>/scripts/birdview.mjs deliver \u003cproject-root>/.birdview/architecture.json \u003cproject-root>/.birdview/architecture.html --catalog \u003cproject-root>/.birdview/constraints.catalog.json --rules \u003cproject-root>/.birdview/reviewed-rules.json --repo \u003cproject-root>\n```\n\nTo reuse a valid compiled catalog, replace `--catalog ... --rules ...` with `--constraints \u003creviewed.json>`. Use `--architecture-only` instead only for an explicit architecture-only request or a disclosed unavailable rule catalog. Read the [delivery receipt](delivery.md), including warnings and history gaps; no separate successful-input validation, compilation or intermediate HTML is needed. Check that the final integrated page has Architecture / Constraints switching, source evidence, rule version labels and the sibling source-index link; deliver the `.sources.html` file with it. The architecture inspector counts only map-bound rules, not the separate catalog; missing module links are not missing project rules.\n\nThe renderer validates JSON and emits self-contained HTML requiring no server/network assets. Do not handcraft a substitute viewer or deliver a fictional demo as the project's map.\n\nOpen HTML in a visible browser preview. With Codex `open_in_codex`, use a `browser` target and correctly encoded file URL, not a `file` target. A Markdown link may open source; a queued request does not confirm display, and headless inspection does not confirm the user's visible tab.\n\nReview the final HTML at the available user viewport:\n\n- Inspect Overview and All relations, names, relationships and selected-module evidence. Hover the module with most direct edges (incoming + outgoing, self-edge once), then other visibly congested areas.\n- Check card-crossing/overlapping routes, congested turns, distinguishable endpoints/arrows, cropped routes/headings, hidden-relation counts and text size after fitting.\n- Verify hover makes direct relationships traceable and leaving restores the selected view without moving nodes.\n\nAutomatic spacing is not a readability guarantee. Keep pixel thresholds and invented congestion fields out of map data. If needed, adjust layout by responsibility/interaction order or groups by evidence; preserve identities, ownership, relationship semantics and full scope. Increment revision, rerender, and recheck affected areas and the full view. Stop after two consecutive attempts without visible improvement and report remaining issues. Unchanged maps in focused tasks need no unrelated UI audit.\n\nReport the actual artifact, viewport, modes, focused modules and unresolved issues. Schema checks, collision samples or screenshots alone are not visual acceptance; no automated crowding check is bundled. If browser inspection is unavailable/denied, state that visual review was not performed and the actual limitation; provide the absolute HTML path, explaining browser display versus editor source. Do not bypass denial or blame the template without rendering-error evidence.\n\nLead with HTML and the preview result; include JSON path, `project.id`, `mapId`, `revision`, coverage and uncertainties as supporting information. Fix or report rendering blockers; JSON alone is not completed visual delivery. This is a snapshot, not live activity. Without a coding task, stop after delivery and ask for the intended change. With a coding task, prepare and render its scope through [Stage 2](show-changes.md), then wait for confirmation of the displayed plan before implementation. Rendering success alone is not permission to edit."},"source-320 talog. Read the [delivery receipt](delivery.md), including warnings and history gaps; no separate successful-input validation, compilation or intermediate HTML is needed. Check that the final integrated page has Architecture / Constraints switching, source evidence, rule version labels and the sibling source-index link; deliver the `.sources.html` file with it. The architecture inspector counts only map-bound rules, not the separate catalog; missing module links are not missing project rules.\n\nThe renderer validates JSON and emits self-contained HTML requiring no server/network assets. Do not handcraft a substitute viewer or deliver a fictional demo as the project's map.\n\nOpen HTML in a visible browser preview. With Codex `open_in_codex`, use a `browser` target and correctly encoded file URL, not a `file` target. A Markdown link may open source; a queued request does not confirm display, and headless inspection does not confirm the user's visible tab.\n\nReview the final HTML at the available user viewport:\n\n- Inspect Overview and All relations, names, relationships and selected-module evidence. Hover the module with most direct edges (incoming + outgoing, self-edge once), then other visibly congested areas.\n- Check card-crossing/overlapping routes, congested turns, distinguishable endpoints/arrows, cropped routes/headings, hidden-relation counts and text size after fitting.\n- Verify hover makes direct relationships traceable and leaving restores the selected view without moving nodes.\n\nAutomatic spacing is not a readability guarantee. Keep pixel thresholds and invented congestion fields out of map data. If needed, adjust layout by responsibility/interaction order or groups by evidence; preserve identities, ownership, relationship semantics and full scope. Increment revision, rerender, and recheck affected areas and the full view. Stop after two consecutive attempts without visible improvement and report remaining issues. Unchanged maps in focused tasks need no unrelated UI audit.\n\nReport the actual artifact, viewport, modes, focused modules and unresolved issues. Schema checks, collision samples or screenshots alone are not visual acceptance; no automated crowding check is bundled. If browser inspection is unavailable/denied, state that visual review was not performed and the actual limitation; provide the absolute HTML path, explaining browser display versus editor source. Do not bypass denial or blame the template without rendering-error evidence.\n\nLead with HTML and the preview result; include JSON path, `project.id`, `mapId`, `revision`, coverage and uncertainties as supporting information. Fix or report rendering blockers; JSON alone is not completed visual delivery. This is a snapshot, not live activity. Without a coding task, stop after delivery and ask for the intended change. With a coding task, prepare and render its scope through [Stage 2](show-changes.md), then wait for confirmation of the displayed plan before implementation. Rendering success alone is not permission to edit."},"source-e64ec6b3167e7e34":{"body":"# .agents/skills/birdview/references/show-changes.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.agents/skills/birdview/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Stage 2: Express the change\n\n[中文](show-changes.zh.md)\n\nPreparing the plan requires a user-requested task and the usable map from [Stage 1](map-project.md). Implementation additionally requires confirmation of the displayed plan, as defined in [SKILL.md](../SKILL.md).\nRead [contract.md](contract.md), `schemas/activity.schema.json` and the example stream.\nUse exact project/map/revision/module IDs; resolve stale coverage before emitting events. Never substitute a fictional map or infer IDs from prose.\n\n## Record operations\n\nBefore editing, follow [development.md](development.md) for the relevant task types. Include the intended observable behavior and verification method in the `planned` reason; use existing `checks` for executed results and `constraintReviews` for applicable recorded constraints. Do not add new event fields.\n\n1. Before editing: append `planned` with complete `scope`, current `targets`, project-relative `files` and a short module-based reason. Render and deliver the plan, ask for confirmation, and wait. Do not treat the original coding request as approval of an unseen plan. Reuse confirmation already given for this same plan; honor an explicit task-specific waiver.\n2. After confirmation, before each edit group: append `editing` with concrete paths and only current modules as targets.\n3. Before checks: append `verifying`; test/fixture paths do not automatically count as modified files.\n4. At task end: append `completed`, `failed` or `cancelled`, recording actual commands, exit codes and observations in `checks` where applicable.\n\nEvery JSONL event carries complete scope/targets. Explain scope expansion in a new `planned` event, update the preview and confirm the changed scope before editing added modules. For mapped edits, target all matching file owners; list unowned files in both `files` and `unmappedFiles`. Never invent ownership to pass validation; correct misleading rules in Stage 1.\n\nOne active task per session; sequences start at 1 and stay contiguous. After a terminal event use a new task ID, never reopen one. Keep project and map revision fixed; new revisions require a new session/file. These are agent declarations: keep checks pending until executed, and never infer success from event emission or completion.\n\n## Render and deliver\n\n```sh\nnode \u003cskill-root>/scripts/birdview.mjs deliver \u003cmap.json> \u003cactivity.html> \u003cactivity.jsonl> --constraints \u003creviewed.json>\n```\n\nReuse the matching reviewed catalog from Stage 1; do not repeat rule compilation for an activity update. For explicit architecture-only output or disclosed unavailable rules, replace `--constraints \u003creviewed.json>` with `--architecture-only`. The [delivery command](delivery.md) validates the map and full stream before replacing output; add `--bilingual` when applicable and use `--legacy` only for unchanged legacy classifications. Read its receipt and deliver only after success; follow Stage 1's preview checks.\n\n- Real activity opens at the latest record; simulation at the first plan. History and collapsible files/checks describe the selected step, not cumulative Git changes.\n- Architecture/changes/comparison share positions; comparison links selection, zoom and scrolling and stacks on narrow screens.\n- Scope stays outlined; non-targets dim. Planned targets highlight before edits, verification targets are labelled separately, and terminal events remove target glow. No executed checks means unverified.\n- Use the separate `render.mjs --simulation` route only for fictional records such as `examples/harness.activity.jsonl`, never as observed work.\n- For each supported activity language, supply event `translations[locale].reason` and check `translations[locale].summary`; absent translations fall back to originals.\n- Updates need regeneration and refresh. No upload, auto-refresh, live interception or Git verification exists; a future display receipt would confirm rendering, not approval or correctness."},"source-e64ec6b3167e7e34-s1":{"body":"来源：`.agents/skills/birdview/references/show-changes.md:1-8`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Stage 2: Express the change\n\n[中文](show-changes.zh.md)\n\nPreparing the plan requires a user-requested task and the usable map from [Stage 1](map-project.md). Implementation additionally requires confirmation of the displayed plan, as defined in [SKILL.md](../SKILL.md).\nRead [contract.md](contract.md), `schemas/activity.schema.json` and the example stream.\nUse exact project/map/revision/module IDs; resolve ring, not approval or correctness."},"source-edd59c9e2b617a80":{"body":"# .agents/skills/birdview/references/development.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.agents/skills/birdview/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Development after activation\n\n[中文](development.zh.md)\n\nApply only when Birdview is active and the user has authorized coding. Before implementation, follow the displayed-plan confirmation step in [SKILL.md](../SKILL.md); mapping or an initial coding request alone is not plan approval. Preserve the existing map and change workflow; these rules neither enable always-on behavior nor override project instructions.\n\n## Choose the relevant guidance\n\nRead the related implementation, callers and applicable design decisions. Resolve questions from source first; ask only about unresolved choices that materially affect the task. Define the expected observable behavior and a proportionate way to verify it before editing. Combine the sections below when needed, such as bug diagnosis plus UI checks for a broken button. Do not run every section for every task.\n\n### Bug fixes\n\nEstablish a reproduction or inspect concrete failure evidence matching the reported symptom. Use the smallest useful test, command, request or UI interaction. For intermittent failures, record reproduction conditions and frequency. If reproduction is unavailable, state what was tried and what evidence is missing; distinguish a tentative fix from a verified one.\n\nTest plausible causes against evidence before choosing a fix. Multiple competing hypotheses help ambiguous failures, but simple bugs need no fixed hypothesis count. Change one relevant variable at a time when investigating. For performance work, measure the affected scenario before and after under comparable conditions.\n\nAfter fixing, rerun the original scenario. Add a regression test when it can exercise the real failure path and provides durable value; observe it fail before the fix and pass afterward when feasible. Explain missing coverage. Remove temporary instrumentation introduced for this task without deleting others' work.\n\n### Features and behavior changes\n\nIdentify observable acceptance behavior and important failure paths. Implement and verify in small behavior-sized steps. Tests should exercise real paths through stable interfaces, rather than mirror private implementation or pass only because internal collaborators are mocked. Use test-first development when requested or useful; do not mandate it for every change or add tests for trivial, reversible edits without meaningful risk.\n\n### Refactoring and architecture changes\n\nInspect affected callers, compatibility requirements and existing decisions. State the concrete benefit, such as removing duplicated business rules or reducing knowledge required by callers. Preserve behavior unless its change is authorized, and verify the interfaces and paths affected. Do not add speculative abstractions or expand into unrelated cleanup. Ordinary edits do not start an architecture review; use the separate review workflow only when requested under the skill's activation rules.\n\n### UI changes\n\nInspect the rendered result and affected interaction at relevant viewport sizes. Check loading, empty and error states where affected, plus relevant keyboard operation, focus and accessible labels. Scale checks to the change: a copy edit does not require a full-site audit. When visual or interaction verification is unavailable, state the limitation instead of claiming acceptance.\n\n## Record and finish\n\nUse the existing [change workflow](show-changes.md): put the expected behavior and intended verification in the `planned` reason, actual commands, exit codes and observations in `checks`, and reviews of applicable recorded constraints in `constraintReviews`. Do not invent schema fields or passing results. A manual review supports only the inspected scope, and completing an activity does not establish correctness.\n\nDistinguish checks not run, environment blockers and observed failures. Continue routine checks and justified retries autonomously; ask only for material unresolved choices or required access. After relevant checks pass, broaden testing only for changed scope or remaining risk. Recheck the original request, update the map if responsibilities, ownership or relationships changed, and report the changes, actual verification and remaining limits. These are agent instructions; validators check records, not whether the agent truly followed the process."},"source-edd59c9e2b617a80-s1":{"body":"来源：`.agents/skills/birdview/references/development.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Development after activation\n\n[中文](development.zh.md)\n\nApply only when Birdview is active and the user has authorized coding. Before implementation, follow the displayed-plan confirmation step in [SKILL.md](../SKILL.md); mapping or an initial coding request alone is not plan approval. Preserve the existing map and change workflow; these rules neither enable always-on behavior nor override project instructions.\n"},"source-edd59c9e2b617a80-s2":{"body":"来源：`.agents/skills/birdview/references/development.md:7-10`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Choose the relevant guidance\n\nRead the related implementation, callers and applicable design decisions. Resolve questions from source first; ask only about unresolved choices that materially affect the task. Define the expected observable behavior and a proportionate way to verify it before editing. Combine the sections below when needed, such as bug diagnosis plus UI checks for a broken button. Do not run every section for every task.\n"},"source-edd59c9e2b617a80-s3":{"body":"来源：`.ag ilures. Continue routine checks and justified retries autonomously; ask only for material unresolved choices or required access. After relevant checks pass, broaden testing only for changed scope or remaining risk. Recheck the original request, update the map if responsibilities, ownership or relationships changed, and report the changes, actual verification and remaining limits. These are agent instructions; validators check records, not whether the agent truly followed the process."},"source-8cbe8df870b285bb":{"body":"# .agents/skills/birdview/references/review-architecture.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.agents/skills/birdview/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Review architecture on request\n\n[中文](review-architecture.zh.md)\n\nUse only when Birdview is active and the user asks for architecture evaluation or refactoring opportunities. Start from the verified map in [Stage 1](map-project.md); review the requested scope, not the entire repository by default.\n\n## Inspect responsibilities\n\nRead relevant project terminology and architecture decisions when available; missing glossaries or ADRs do not require creating them. Trace the callers and implementations behind candidate modules. Look for concrete friction:\n\n- One responsibility requires coordinated edits across several modules, or callers must know internal ordering, error handling or configuration details.\n- A wrapper adds little behavior while forcing callers through another interface. Ask what happens if it is removed: does complexity disappear or move into its callers? A small adapter can still justify its existence.\n- Existing boundaries make important behavior difficult to verify through public interfaces. Describe the behavior at risk, rather than demanding tests for every implementation detail.\n\nPrefer changes that give callers a simpler interface while keeping cohesive behavior together. Module count, file size and diagram neatness alone are not evidence of a problem. Respect existing architecture decisions; suggest revisiting one only with concrete new evidence and state the conflict.\n\n## Present grounded candidates\n\nReturn only supported candidates, ordered by expected value. For each, provide:\n\n- Existing module IDs and source paths/symbols, observed friction and its practical impact.\n- Proposed responsibility or dependency changes, expected benefit, migration cost and risks, including reasons to retain the current design.\n- A behavior-level verification plan and confidence: strong evidence, worth investigating, or speculative. Identify missing evidence; do not present hypotheses as defects.\n\nUse the existing Birdview preview to locate affected modules and explain candidates alongside it. Keep the canonical map factual: do not replace current relationships with proposals, invent activity records or treat the comparison view as a before/after architecture diff. Describe proposed structure in the accompanying explanation; no separate report framework or schema extensions are needed.\n\nRecommend a first candidate only when the evidence supports one; finding no justified refactor is a valid result. Resolve source-answerable questions before asking about material product or design choices, and include a recommendation with its tradeoff. Review alone does not authorize implementation. Once implementation is authorized, follow [Stage 2](show-changes.md) using the current map and declared scope; do not ask again for authorization already given."},"source-8cbe8df870b285bb-s1":{"body":"来源：`.agents/skills/birdview/references/review-architecture.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Review architecture on request\n\n[中文](review-architecture.zh.md)\n\nUse only when Birdview is active and the user asks for architecture evaluation or refactoring opportunities. Start from the verified map in [Stage 1](map-project.md); review the requested scope, not the entire repository by default.\n"},"source-8cbe8df870b285bb-s2":{"body":"来源：`.agents/skills/birdview/references/review-architecture.md:7-16`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Inspect responsibilities\n\nRead relevant project terminology and architecture decisions when available; missing glossaries or ADRs do not require creating them. Trace the callers and implementations behind candidate modules. Look for concrete friction:\n\n- One responsibility requires coordinated edits across several modules, or callers must know internal ordering, error handling or configuration details.\n- A wrapper adds little behavior while forcing callers through another interface. Ask what happens if it is removed: does complexity disappear or move into its callers? A small adapter can still justify its existence.\n- Existing boundaries make important behavior difficult to verify through public interfaces. Describe the behavior at risk, rather than demanding tests for every implementation detail.\n\nPrefer changes that give callers a simpler interface while keeping cohesive behavior together. Module count, file size and diagram neatness alone are not evidence of a problem. Respect existing architecture decisions; suggest revisiting one only with concrete new evidence and state the conflict.\n"},"source-8cbe8df870b285bb-s3":{"body":"来源：`.agents/skills/birdview/references/review-architecture.md:17-27`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Present grounded candidates\n\nReturn only supported candidates, ordered by expected value. For each, provide:\n\n- Existing module IDs and source paths/symbols, observed friction and its practical impact.\n- Proposed responsibility or dependency changes, expected benefit, migration cost and risks, including reasons to retain the current design.\n- A behavior-level verification plan and confidence: strong evidence, worth investigating, or speculative. Identify missing evidence; do not present hypotheses as defects.\n\nUse the existing Birdview preview to locate affected modules and explain candidates alongside it. Keep the canonical map factual: do not replace current relationships with proposals, invent activity records or treat the comparison view as a before/after architecture diff. Describe proposed structure in the accompanying explanation; no separate report framework or schema extensions are needed.\n\nRecommend a first candidate only when the evidence supports one; finding no justified refactor is a valid result. Resolve source-answerable questions before asking about material product or design choices, and include a recommendation with its tradeoff. Review alone does not authorize implementation. Once implementation is authorized, follow [Stage 2](show-changes.md) using the current map and declared scope; do not ask again for authorization already given."},"source-b088244ad33c07bd":{"body":"# .agents/skills/birdview/references/contract.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.agents/skills/birdview/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Birdview contract v0.1\n\n[中文](contract.zh.md)\n\n## Multi-agent collaboration\n\nActivity events may include `occurredAt` (an ISO 8601 timestamp), `gitCommit` (the source commit), and `collaboration: { agent, locks }`. `agent` identifies the worker and `locks` lists file paths or stable module IDs claimed for the active task. The validator warns when active claims from different agents overlap. A terminal event releases claims for that task, so completed collaboration state does not remain active. These are trace and conflict signals, not filesystem locks or merge replacements.\n\n## Architecture\n\nOptional module `role` classifies responsibility as `frontend`, `backend`,\n`cache`, `database`, `queue`, `security`, or `generic`. Missing roles render as\n`generic`, preserving older maps. Role determines the viewer's icon and color\nfamily, independently of `kind` and group membership. Cache uses cyan with a\nlightning icon; database uses violet with a database icon. Roles are not activity states.\n\nNew maps must pass authoring validation (`validate.mjs --authoring`, `requireRoles: true` in the API, or the default in [deliver](delivery.md)): every module declares `role`, and `generic` requires `roleAssessment: { basis, note }`. Use `basis: \"out-of-taxonomy\"` when inspected responsibilities fit no listed role, or `\"insufficient-evidence\"` when classification lacks evidence; the latter requires `status: \"uncertain\"` and a specific `openQuestions` entry. `note` explains the decision with reference to the module's evidence or missing inspection. Its translations belong in `roleAssessment.translations.\u003clocale>.note`; `basis` is never translated. Assessments are only valid on explicit generic modules.\n\nDefault validation/rendering keeps legacy maps without roles or assessments valid. An all-generic/unclassified map returns `role/all-generic-review` in validator `warnings`, even if valid: review each module and explain the outcome at delivery. This warning is not a color-diversity requirement. Validation checks declarations, not the truth of classifications or the quality of explanations.\n\nOptional `groups` represent authored system/subsystem membership, not deployment\nor trust boundaries. Each has a unique `id`, `name`, nonempty source `evidence`\nand unique module IDs in `members`. Groups are disjoint and one level deep.\nUnknown members and duplicate memberships are rejected. Group translations cover\nthe name and evidence notes. The viewer arranges groups side by side, retaining\nrelative row/column order inside each group; ungrouped nodes remain unframed.\n\nOptional group `role` assigns a fixed semantic color: `interaction` (pale blue,\nuser interaction/review), `runtime` (pale amber, execution/orchestration),\n`external-services` (pale violet, integrations outside the described system), or\n`generic` (neutral gray, unspecified grouping). Missing roles use `generic`.\nRoles are authored from evidence, never inferred from order, names, or module\nownership. They do not assert deployment/trust boundaries or change activity.\nThe group heading displays the localized role alongside its name.\n\nOptional `language` (such as `zh`, `en`, `ja`, `fr` or `pt-BR`) identifies the base\ntext language using a common language tag. Optional\n`translations` on project, modules, relationships and evidence objects contains\nlocalized text only. See `bilingual.md` for authoring and completeness validation.\nAbsent translations fall back to base fields; identities and layout are shared.\n\n`schemaVersion` versions the file format. `mapId` identifies a map and `revision`\nversions its contents. Together with `project.id`, these bind activity to the\nintended system. Revision numbers are author-maintained; they are not a content\nhash. Consumer-side hashing may be introduced with a real live transport.\n\n`modules` describe responsibilities. `ownership` assigns exact files or directory\nprefixes. `evidence` explains which source locations support the description.\nOne evidence citation does not imply ownership of that file. `relationships`\ndescribe authored directed connections, not runtime impact analysis.\n\nPaths use forward slashes and stay relative to the project root. Empty segments,\ndot/parent segments, drive letters and `.git` segments are forbidden. A directory\nrule such as `src/api` matches `src/api/products.ts`, not `src/api-other.ts`.\nMultiple matching owners are allowed and must be represented explicitly.\nExternal modules have no ownership and can use an empty evidence list; local\nmodules require ownership and evidence. Uncertain modules/relationships require\nnonempty `openQuestions`.\n\nThe schema is strict about fields. Semantic validation additionally checks unique\nIDs, existing relationship endpoints, distinct grid cells, evidence line order,\nand the local/external and uncertainty rules. It does not read project source.\n\n## Activity\n\nEach JSONL line is a complete event. Its `scope` is the overall declared task\nscope; `targets` is the current subset. `files` is the current step's concrete\nfile list. For `planned`/`editing`, every mapped owner must be in `targets`.\nUnmapped paths must be reported exactly in `unmappedFiles` for every phase.\n\n`checks` contains command, nullable exit code and `passed|failed|not-run` status.\nPassed requires exit code 0, failed requires a nonzero exit code, and not-run\nrequires null. No checks means no verification claim. `completed` can describe\nan untested change, but cannot include a failed check. A `failed` event may have\nno checks when failure occurred before verification.\n\nSession rules:\n\n- The first event has sequence 1; following sequences are contiguous.\n- A session belongs to one project and map revision.\n- A new task begins with `planned`; only one task is active at a time.\n- Active tasks accept `planned`, `editing`, `verifying`, or a terminal event.\n- `planned` can revise scope. Every other event preserves the latest plan scope.\n- Terminal phases are `completed`, `failed`, `cancelled`; task IDs cannot reopen.\n- Targets must belong to scope. Terminal events may have empty targets.\n\nThese are authoring consistency rules, not enforcement of coding permissions.\nThe validator reports an error code and location; an invalid input is never\nsilently repaired. Neither contract defines HTTP endpoints, ports, UI colors or\nan automatic interception mechanism.\n\n## Visual contract\n\nOptional local-constraint discovery, rule scope, applicability and per-event verification records follow [Effective constraints](constraints.md). They preserve legacy map/event compatibility and never establish automatic enforcement.\n\nEvery relationship requires `kind` and `visibility`. `kind` is `request` (invoke\nan operation), `result` (return its outcome), `dependency` (use a capability or\nresource), `event` (publish a notification/state record), or `control` (schedule,\napprove, cancel or otherwise govern execution). These describe the authored arrow;\nthey do not prove synchronous execution or imply an unrecorded reverse edge.\n`visibility` is `overview` or `detail`. Overview initially displays only\n`overview` relationships; All displays every relationship. Missing fields and\nthe removed `primary` field are invalid; no legacy fallback is supported.\nAll modules keep their positions and stay\navailable. Hover temporarily reveals every direct relationship of that module,\nincluding auxiliary ones, and dims unrelated context. The visible/total count\nreflects this reveal. This is a reading aid, never an activity scope or new edge.\n\nRender modules at stable grid positions; preserve them across activity updates.\nUse a persistent outline for planned scope, highest emphasis for current targets,\nand reduced emphasis for unrelated modules. Keep module names readable. Display\nplanned-event targets with the same emphasis before editing starts. Verification\ntargets must be identified as verification, not editing. Comparison panes share\npositions and navigation, with activity emphasis only on the changes pane.\nDisplay\nreason and phase outside the map and reveal files/evidence on module selection.\nNever imply that all neighbors of a target are being modified. Keep simulation\nexplicitly labelled and separate from real activity."},"source-b088244ad33c07bd-s1":{"body":"来源：`.agents/skills/birdview/references/contract.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Birdview contract v0.1\n\n[中文](contract.zh.md)\n
