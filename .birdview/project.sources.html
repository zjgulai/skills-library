languages, use the preferred/first-listed language as base and put others in each text-owning object's `translations.\u003clanguage-tag>`. Reuse existing structure, base language and translations; add complete missing delivery translations. Infer an absent base tag from prose, using the delivery language if ambiguous. Saved translation changes increment map revision and respect active task bindings.\n\nDescribe the same inspected architecture in all languages:\n\n- Translate project/group/module names, responsibilities, relationship labels, evidence notes and nonempty `openQuestions`; preserve question order and uncertainty.\n- Keep names short and responsibilities suitable for two lines, with full text in details. Preserve proper names, IDs, paths, symbols, line numbers, enums and layout.\n- Use one map; do not invent evidence or remove existing translations unprompted. See [the complete example](../examples/bilingual.architecture.json).\n- For multilingual activity, translate every supported language's event `translations[locale].reason` and check `translations[locale].summary`; missing values fall back to original text.\n\n## Validate and display\n\n```sh\nnode \u003cskill-root>/scripts/birdview.mjs deliver \u003cmap.json> \u003carchitecture.html> --constraints \u003creviewed.json> --bilingual\n```\n\nFor newly reviewed rules, use the compilation route in [delivery.md](delivery.md); for explicit architecture-only output, replace `--constraints \u003creviewed.json>` with `--architecture-only`. The command includes authoring and bilingual validation. Standalone `validate.mjs --bilingual` remains useful for diagnosis, not a required extra round trip.\n\nUse `--bilingual` for Chinese/English delivery only. Single-language maps validate without it; other combinations require manual language-coverage review after structural validation. The strict check verifies architecture text coverage and question counts, not translation accuracy or activity translations. Do not claim complete Chinese/English coverage before it passes; inspect both languages' tooltips, details and relationships in the browser, and check activity coverage separately.\n\nOpen HTML with `#lang=\u003cdelivery-language-tag>`. Display priority is supported URL language, saved preference, then map base (legacy default: Chinese). Switching preserves selection, layout and zoom; missing translations use base text. The selector does not translate content or call a translation API.\n\nUI controls are bundled only in Chinese/English; other languages use English controls with authored project text. Do not claim fully localized UI for them. Right-to-left content is supported, but graph/toolbar layout remains left-to-right."},"source-0561f532e8ab0d84-s1":{"body":"来源：`.agents/skills/birdview/references/bilingual.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Architecture language selection\n\n[中文](bilingual.zh.md)\n"},"source-0561f532e8ab0d84-s2":{"body":"来源：`.agents/skills/birdview/references/bilingual.md:5-17`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Select and author\n\nResolve the delivery language without asking or pausing: explicit output instructions/applicable standing preference, then dominant request prose (ignore code IDs and quoted source). For language-neutral requests, use recent conversation, existing map language, then English. Browser locale and saved UI preferences do not decide authored language.\n\nSupport any language. Set `language` to the base language tag; single-language maps need no translations. For multiple languages, use the preferred/first-listed language as base and put others in each text-owning object's `translations.\u003clanguage-tag>`. Reuse existing structure, base language and translations; add complete missing delivery translations. Infer an absent base tag from prose, using the delivery language if ambiguous. Saved translation changes increment map revision and respect active task bindings.\n\nDescribe the same inspected architecture in all languages:\n\n- Translate project/group/module names, responsibilities, relationship labels, evidence notes and nonempty `openQuestions`; preserve question order and uncertainty.\n- Keep names short and responsibilities suitable for two lines, with full text in details. Preserve proper names, IDs, paths, symbols, line numbers, enums and layout.\n- Use one map; do not invent evidence or remove existing translations unprompted. See [the complete example](../examples/bilingual.architecture.json).\n- For multilingual activity, translate every supported language's event `translations[locale].reason` and check `translations[locale].summary`; missing values fall back to original text.\n"},"source-0561f532e8ab0d84-s3":{"body":"来源：`.agents/skills/birdview/references/bilingual.md:18-30`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Validate and display\n\n```sh\nnode \u003cskill-root>/scripts/birdview.mjs deliver \u003cmap.json> \u003carchitecture.html> --constraints \u003creviewed.json> --bilingual\n```\n\nFor newly reviewed rules, use the compilation route in [delivery.md](delivery.md); for explicit architecture-only output, replace `--constraints \u003creviewed.json>` with `--architecture-only`. The command includes authoring and bilingual validation. Standalone `validate.mjs --bilingual` remains useful for diagnosis, not a required extra round trip.\n\nUse `--bilingual` for Chinese/English delivery only. Single-language maps validate without it; other combinations require manual language-coverage review after structural validation. The strict check verifies architecture text coverage and question counts, not translation accuracy or activity translations. Do not claim complete Chinese/English coverage before it passes; inspect both languages' tooltips, details and relationships in the browser, and check activity coverage separately.\n\nOpen HTML with `#lang=\u003cdelivery-language-tag>`. Display priority is supported URL language, saved preference, then map base (legacy default: Chinese). Switching preserves selection, layout and zoom; missing translations use base text. The selector does not translate content or call a translation API.\n\nUI controls are bundled only in Chinese/English; other languages use English controls with authored project text. Do not claim fully localized UI for them. Right-to-left content is supported, but graph/toolbar layout remains left-to-right."},"source-99c2470159f77111":{"body":"# .agents/skills/birdview/references/delivery.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.agents/skills/birdview/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Deliver a map\n\n[中文](delivery.zh.md)\n\nAfter inspecting source and authoring the architecture and reviewed rules, use one command for strict validation, rule compilation, Git line history and integrated rendering. Paths below are relative to the installed skill; use absolute script paths from another directory. Node.js and installed skill dependencies are required; compilation with history also requires Git and the source repository.\n\n```sh\nnode scripts/birdview.mjs deliver architecture.json project.html --catalog constraints.catalog.json --rules reviewed-rules.json --repo /path/to/repository\n```\n\nThis writes `project.html`, `project.sources.html` and `project.constraints.json`. Keep the original source catalog and reviewed selection too. Source collection and AI semantic review happen **before** this command; it does not infer rules or confirm coverage. A separate source-only or standalone constraint HTML is unnecessary for integrated delivery; the auxiliary source page is generated here.\n\nChoose exactly one route:\n\n| Route | Arguments | Outputs |\n| --- | --- | --- |\n| Compile reviewed selection | `--catalog sources.json --rules reviewed-rules.json --repo root` | Integrated HTML, source HTML, compiled catalog with history |\n| Reuse matching reviewed catalog | `--constraints project.constraints.json` | Integrated HTML and source HTML |\n| Explicit architecture-only or disclosed missing rules | `--architecture-only` | Architecture HTML |\n\nReuse does not refresh rule history; inspect scope, snapshot and bindings before reusing. `--repo root` is optional for reuse and architecture-only and enables the existing map-constraint freshness check; it does not prove the whole map is current. An unavailable rule catalog must remain a stated limitation, not a claim of complete default delivery.\n\nAn optional activity JSONL follows the two positional paths:\n\n```sh\nnode scripts/birdview.mjs deliver architecture.json activity.html activity.jsonl --constraints project.constraints.json\n```\n\nThe full activity stream is validated against the map. Do not recompile unchanged constraints just to update activity. Fictional simulation keeps the existing `render.mjs --simulation` route.\n\n## Validation and result\n\n- Strict authoring validation is on by default (equivalent to `validate.mjs --authoring`). Add `--bilingual` for Chinese/English delivery. Fix failures; review warnings against source. Do not rerun a separate validator on unchanged input just to follow an old checklist.\n- Use `--legacy` only when updating a genuine existing map with unchanged legacy role fields. It relaxes only the explicit-role authoring check, not schema, event, translation or binding checks. Inspect new/changed classifications yourself; never use it to bypass a new-map failure.\n- The renderer retains its internal defensive validation. This command reduces agent/tool handoffs; it does not promise a single internal validation pass or a measured token/speed improvement.\n- stdout is a JSON receipt. `ok: true` and exit code 0 mean artifact generation succeeded. Failures return exit code 1, the failing `stage`, validation diagnostics or `error`; `written` lists paths already published. Preserve warnings and `constraints.historyGaps` in the user-facing explanation, in the conversation language.\n- Every artifact is validated/rendered in memory before writes. Input/output aliases are rejected. Temporary sibling files are prepared before publication, with the main HTML last. An I/O failure during publication can leave some sidecars updated; multiple file replacements are not a transaction. Inspect `written` before retrying.\n\n`visualReview: not-performed` and `implementationVerification: unverified` are deliberate. Open the final page and do [visual review](map-project.md); explain scope and uncertainty, and follow the [displayed-plan confirmation rule](../SKILL.md) before implementation. Rendering success is neither acceptance nor permission to edit. Standalone validation, compilation and rendering commands remain available for diagnosis and explicit constraint-only tasks."},"source-99c2470159f77111-s1":{"body":"来源：`.agents/skills/birdview/references/delivery.md:1-30`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Deliver a map\n\n[中文](delivery.zh.md)\n\nAfter inspecting source and authoring the architecture and reviewed rules, use one command for strict validation, rule compilation, Git line history and integrated rendering. Paths below are relative to the installed skill; use absolute script paths from another directory. Node.js and installed skill dependencies are required; compilation with history also requires Git and the source repository.\n\n```sh\nnode scripts/birdview.mjs deliver architecture.json project.html --catalog constraints.catalog.json --rules reviewed-rules.json --repo /path/to/repository\n```\n\nThis writes `project.html`, `project.sources.html` and `project.constraints.json`. Keep the original source catalog and reviewed selection too. Source collection and AI semantic review happen **before** this command; it does not infer rules or confirm coverage. A separate source-only or standalone constraint HTML is unnecessary for integrated delivery; the auxiliary source page is generated here.\n\nChoose exactly one route:\n\n| Route | Arguments | Outputs |\n| --- | --- | --- |\n| Compile reviewed selection | `--catalog sources.json --rules reviewed-rules.json --repo root` | Integrated HTML, source HTML, compiled catalog with history |\n| Reuse matching reviewed catalog | `--constraints project.constraints.json` | Integrated HTML and source HTML |\n| Explicit architecture-only or disclosed missing rules | `--architecture-only` | Architecture HTML |\n\nReuse does not refresh rule history; inspect scope, snapshot and bindings before reusing. `--repo root` is optional for reuse and architecture-only and enables the existing map-constraint freshness check; it does not prove the whole map is current. An unavailable rule catalog must remain a stated limitation, not a claim of complete default delivery.\n\nAn optional activity JSONL follows the two positional paths:\n\n```sh\nnode scripts/birdview.mjs deliver architecture.json activity.html activity.jsonl --constraints project.constraints.json\n```\n\nThe full activity stream is validated against the map. Do not recompile unchanged constraints just to update activity. Fictional simulation keeps the existing `render.mjs --simulation` route.\n"},"source-99c2470159f77111-s2":{"body":"来源：`.agents/skills/birdview/references/delivery.md:31-39`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Validation and result\n\n- Strict authoring validation is on by default (equivalent to `validate.mjs --authoring`). Add `--bilingual` for Chinese/English delivery. Fix failures; review warnings against source. Do not rerun a separate validator on unchanged input just to s\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-f0cf750c8b5d472b":{"body":"# .agents/skills/birdview/compatibility-audit/references/report-contract.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.agents/skills/birdview/compatibility-audit/SKILL.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Compatibility assessment contract\n\n[中文](report-contract.zh.md)\n\nThe deterministic inventory and the human conclusion are separate on purpose. Store the assessment as JSON with this shape:\n\n```json\n{\n  \"status\": \"reviewed\",\n  \"reviewedAt\": \"2026-09-24T00:00:00.000Z\",\n  \"reviewer\": \"agent\",\n  \"language\": \"en\",\n  \"summary\": \"Illustrative only: the two workflows need an explicit order.\",\n  \"conclusions\": [\n    {\n      \"leftSkill\": \"skill-a\",\n      \"rightSkill\": \"skill-b\",\n      \"relation\": \"ordered\",\n      \"confidence\": \"high\",\n      \"scenario\": \"Both skills are invoked for the same implementation task.\",\n      \"impact\": \"Implementation could begin before the plan is approved.\",\n      \"rationale\": \"Both can run, but skill-a owns the plan and skill-b owns implementation.\",\n      \"evidence\": [\n        { \"skill\": \"skill-a\", \"path\": \".../SKILL.md\", \"digest\": \"\u003cinventory digest>\", \"quote\": \"\u003cexact source passage>\" },\n        { \"skill\": \"skill-b\", \"path\": \".../SKILL.md\", \"digest\": \"\u003cinventory digest>\", \"quote\": \"\u003cexact source passage>\" }\n      ],\n      \"recommendation\": \"Run skill-a first, then skill-b after its plan is approved.\"\n    }\n  ]\n}\n```\n\nThis is a format example, not a finding. Copy names, paths and digests exactly from the inventory. The CLI validates evidence against the current discovered files; stale digests, invented quotes and unknown files are rejected before output is written. Referenced documents and host rules are outside this evidence validator; disclose those gaps in the summary and scenario. Discovered skills are not necessarily active together.\n\nUse `compatible` (no conflict in the stated scenario), `ordered` (an execution order resolves overlap), `potential-conflict` (the same scenario produces incompatible requirements), or `unresolved` (insufficient evidence). All but `unresolved` require quotes from both distinct skill files. Describe exactly what happens, its user impact and a concrete next action; similarity and duplicate names alone are not semantic conflicts. Confidence is an agent estimate, not a measured score.\n\nUse the user's language (`en` or `zh`); the narrative fields must also use that language. `reviewed` means an agent supplied an assessment, not user approval or exhaustive coverage. The report lists uncited skills and only claims coverage of listed scenarios. An empty conclusion list never means every skill is compatible. The JSON inventory is schema version 2; the default assessment is `unreviewed` with no conclusions. Keep the assessment input file separately so rerunning inventory does not discard it. `assessment` is advisory and never disables or changes a skill."},"source-f0cf750c8b5d472b-s1":{"body":"来源：`.agents/skills/birdview/compatibility-audit/references/report-contract.md:1-37`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Compatibility assessment contract\n\n[中文](report-contract.zh.md)\n\nThe deterministic inventory and the human conclusion are separate on purpose. Store the assessment as JSON with this shape:\n\n```json\n{\n  \"status\": \"reviewed\",\n  \"reviewedAt\": \"2026-09-24T00:00:00.000Z\",\n  \"reviewer\": \"agent\",\n  \"language\": \"en\",\n  \"summary\": \"Illustrative only: the two workflows need an explicit order.\",\n  \"conclusions\": [\n    {\n      \"leftSkill\": \"skill-a\",\n      \"rightSkill\": \"skill-b\",\n      \"relation\": \"ordered\",\n      \"confidence\": \"high\",\n      \"scenario\": \"Both skills are invoked for the same implementation task.\",\n      \"impact\": \"Implementation could begin before the plan is approved.\",\n      \"rationale\": \"Both can run, but skill-a owns the plan and skill-b owns implementation.\",\n      \"evidence\": [\n        { \"skill\": \"skill-a\", \"path\": \".../SKILL.md\", \"digest\": \"\u003cinventory digest>\", \"quote\": \"\u003cexact source passage>\" },\n        { \"skill\": \"skill-b\", \"path\": \".../SKILL.md\", \"digest\": \"\u003cinventory digest>\", \"quote\": \"\u003cexact source passage>\" }\n      ],\n      \"recommendation\": \"Run skill-a first, then skill-b after its plan is approved.\"\n    }\n  ]\n}\n```\n\nThis is a format example, not a finding. Copy names, paths and digests exactly from the inventory. The CLI validates evidence against the current discovered files; stale digests, invented quotes and unknown files are rejected before output is written. Referenced documents and host rules are outside this evidence validator; disclose those gaps in the summary and scenario. Discovered skills are not necessarily active together.\n\nUse `compatible` (no conflict in the stated scenario), `ordered` (an execution order resolves overlap), `potential-conflict` (the same scenario produces incompatible requirements), or `unresolved` (insufficient evidence). All but `unresolved` require quotes from both distinct skill files. Describe exactly what happens, its user impact and a concrete next action; similarity and duplicate names alone are not semantic conflicts. Confidence is an agent estimate, not a measured score.\n\nUse the user's language (`en` or `zh`); the narrative fields must also use that language. `reviewed` means an agent supplied an assessment, not user approval or exhaustive coverage. The report lists uncited skills and only claims coverage of listed scenarios. An empty conclusion list never means every skill is compatible. The JSON inventory is schema version 2; the default assessment is `unreviewed` with no conclusions. Keep the assessment input file separately so rerunning inventory does not discard it. `assessment` is advisory and never disables or changes a skill."},"folder:reference:docs":{"body":"# docs\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:reference:docs/specs":{"body":"# docs/specs\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"folder:reference:docs/specs/2026-09-25-dsh-skill-lifecycle":{"body":"# docs/specs/2026-09-25-dsh-skill-lifecycle\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-6057c1c6a480d105":{"body":"# docs/specs/2026-09-25-dsh-skill-lifecycle/03-DSH运行与验收契约.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：AGENTS.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# 03｜DSH 运行与验收契约\n\n状态：目标契约待审阅；不表示 DSH 当前已具备所有控制能力。仅 DSH，不建立跨平台抽象。\n\n## 1. 被验收对象\n\n一次验收绑定：Skill 的完整内容身份、DSH 版本、模型与参数、岗位装配、工具和权限、任务集、裁判、环境初态。任一关键项变化，需要判断受影响证据是否应重跑；不能沿用一个笼统“兼容 DSH”的标签。\n\n规划期选中试点和计算哈希，只证明所读文件的身份；执行期还要核对真实装载来源和内容。\n\n## 2. 逐层验收\n\n| 编号 | 验收层 | 必需证据 | 失败或未知的处理 |\n|---|---|---|---|\n| DSH-01 | 发现与作用域 | 目标测试岗位实际目录中存在该技能，来源可识别 | 不以技能中心可见或文件存在代替；先修装配，不改正文 |\n| DSH-02 | 同名解析 | 实际胜出来源是本轮指定原版或候选 | 原候选分隔运行；不得因优先级误读另一份 |\n| DSH-03 | 显式调用 | 相应调用策略允许时，用户手势或原生加载路径实际注入正确内容 | 本来禁用显式调用的技能应验证正确拒绝，不能为过测试强开 |\n| DSH-04 | 自然选择 | 真实任务下加载记录及近邻非目标任务下的拒选／合理澄清 | 不能以回答提到名称或显式调用成功代替 |\n| DSH-05 | 资源定位 | 使用资源时解析到当前包的正确内容，包外引用单独列明 | 无资源则该项不适用；新增资源后必须补验 |\n| DSH-06 | 工具执行 | 原生工具调用与结果、身份、输入范围和实际产物 | 自述不算执行；工具错误与业务不合格分开 |\n| DSH-07 | 业务结果 | 在规定对象和范围内满足业务验收 | 退出码零、生成文件或齐全模板不算充分证据 |\n| DSH-08 | 权限边界 | 受控禁止操作实际被拒绝，原版／裁判不被写入 | 不进行真实破坏性探针；隔离达不到则阻断高后果实验 |\n| DSH-09 | 恢复与预算 | 中断恢复后的对象一致、状态正确、预算累计、动作不错误重放 | 不能靠模型承诺或文件修改时间推断阶段已完成 |\n\n## 3. 两类实验路径\n\n### 3.1 内容能力实验\n\n在明确加载正确版本之后测业务结果，隔离“能否选中”因素。原版和候选使用相同逻辑技能名，分别装配到互不污染的 DSH 运行。修改名称、扩大工具集、提供额外答案等都属于干预变化，不能只把收益归给正文。\n\n### 3.2 自然选择及岗位集成实验\n\n被测侧只收到正常用户请求，不带“请使用某技能”的提示。保留目标岗位相关的相邻技能和工具，记录实际模型可见目录及已加载内容。先在受控小集合定位问题，最终还要在有代表性的岗位装配中复验。\n\n首轮本地报告与小型表格范围已确认，DSH接缝的只读核对已完成，见[P0调查](07-P0原生执行接缝与隔离方案.md)。具体测试岗位和模型尚未选定；执行前必须确认并冻结，不自行推定某 preset 就是生产代表。\n\n## 4. 原版与候选隔离\n\n- 使用同一逻辑技能名，在分开的运行区域或独立作用域装配，不能把两版同时暴露并靠名字暗示模型选择。\n- 两侧数据、工具、授权和初态一致；工具结果中的历史文件、缓存、对话和 Git 历史也可能污染对照。\n- 候选如果新增 references，原版不能读到候选资源；路径变更必须体现于内容清单。\n- 内容相同但根目录不同也可能改变包外相对引用；基线移动后应检查引用语义是否保持。不能复制后自动补文件，再称“原版无改动”。\n- 只读调查已找到Desktop原生create/prompt/follow/cancel等接缝，但访问隔离尚未证明，具体实现未选定；见[P0方案](07-P0原生执行接缝与隔离方案.md)。不猜测API、不调用会保存全局默认的模型切换入口来静默改变日常环境。\n- 专用测试作用域的操作准入、预算与停止设计见[08-P0控制契约](08-P0读取预算与终止控制契约.md)。首版已由D10选择A，不开放任意代码或通用shell，原版与候选工具条件一致；受限环境结果不直接代表日常全工具岗位。实施步骤见[09-P0最小实现计划](09-P0最小实现计划.md)，尚未执行。\n\n## 5. 现有本机静态事实与限制\n\n以下来自本会话早先对安装代码的只读核对，日期为2026-09-25；不是本试点的动态验收结果，正式执行前需复核当前文件与版本。\n\n共同路径前缀：`/Applications/DSH Desktop.app/Contents/Resources/app/node_modules/@deepseek-ai/`。\n\n| 文件定位 | 已观察事实 | 不能外推 |\n|---|---|---|\n| `dsh-skill-filesystem/lib/index.js:151` | 支持项目／用户 `.dsh/skills`、`.agents/skills` 及配置来源 | 不能假设任意目录递归发现，或所有岗位启用默认根 |\n| `dsh-tool-skill/lib/index.js:40,362` | 目录描述默认限制500字符，并压缩空白 | 不代表所有版本参数一致，也不是开放格式上限 |\n| `dsh-tool-skill/lib/index.js:139,169,376` | 模型工具加载与用户 `/name` 注入是不同路径，按有效策略检查 | 不能由显式加载推断自然语义选择可靠 |\n| `dsh-skill-filesystem/lib/index.js:844` | 支持 `disable-model-invocation` 与 `user-invocable` | 不代表原始文件开关就是最终岗位策略 |\n| `dsh-skill/lib/index.js:57` | 正文与资源基目录提示按需注入 | 不会自动执行脚本、连接 MCP 或建立独立进程 |\n| `dsh-tools/lib/index.js:3314` | 工具审批存在明确拒绝分支 | 不代表所有工具天然受同一沙箱或每次都弹审批 |\n\n岗位子集插件：`/Users/lute/.dsh/profiles/desktop/node_modules/dsh-skill-subset/lib/index.js:113,153` 中的 `respectFileFlags` 可影响最终可调用性。不能只看文件的调用字段；也不能由一个配置推断全部岗位。\n\n## 6. 必须新增验证、不得冒充已支持的能力\n\n- 能否通过可维护接口创建干净被测运行，及如何识别实际正文和资源版本。\n- 能否将优化者、受控裁判、目标执行者的读写权限分开；仅分会话不等于隔离。\n- 原生事件里哪些字段可作为加载、执行、终止和用量证据，是否有缺失或延迟。\n- 中断之后能否安全恢复，跨阶段产物如何提交，重复动作如何识别。\n- 岗位装配与内容更新何时生效，有无缓存、热更新或上下文保留影响。\n\n若某项暂无可靠接缝，记录阻塞和最小补齐方案。不得绕过审批、放宽权限或直接修改应用 bundle 来让试验看起来通过。\n\n## 7. 本试点的适用范围\n\n`validate-data` 当前只有一份 SKILL.md，无独立脚本、图片或参考目录。首轮可验证发现、选择、正文执行、局部计算、证据化报告、隔离与恢复。不能凭这个试点证明跨文件渐进读取、浏览器图表视觉验收、数据库连接或生产发布已经覆盖。\n\n包外 `../../CONNECTORS.md` 缺失是已知静态事实。首轮若选择无需连接器的本地报告／数据路径，应标明排除了连接器分支；若运行时实际需要它，则停止并明确缺依赖。原版不得补齐后仍称未修改。候选是否修复引用要基于确认的目标与独立内容身份。\n\n## 8. 可交付声明格式\n\n“候选 X 在 DSH 版本、模型配置、岗位／工具集合、测试范围 Y 下完成检查，结论为 Z；未覆盖的路径为 W。”\n\n禁止使用不带范围的“全平台兼容”“全部安全”“生产就绪”。A 阶段无生产部署，因此没有生产稳定性结论。"},"source-6057c1c6a480d105-s1":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/03-DSH运行与验收契约.md:1-4`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# 03｜DSH 运行与验收契约\n\n状态：目标契约待审阅；不表示 DSH 当前已具备所有控制能力。仅 DSH，不建立跨平台抽象。\n"},"source-6057c1c6a480d105-s2":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/03-DSH运行与验收契约.md:5-10`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 1. 被验收对象\n\n一次验收绑定：Skill 的完整内容身份、DSH 版本、模型与参数、岗位装配、工具和权限、任务集、裁判、环境初态。任一关键项变化，需要判断受影响证据是否应重跑；不能沿用一个笼统“兼容 DSH”的标签。\n\n规划期选中试点和计算哈希，只证明所读文件的身份；执行期还要核对真实装载来源和内容。\n"},"source-6057c1c6a480d105-s3":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/03-DSH运行与验收契约.md:11-24`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 2. 逐层验收\n\n| 编号 | 验收层 | 必需证据 | 失败或未知的处理 |\n|---|---|---|---|\n| DSH-01 | 发现与作用域 | 目标测试岗位实际目录中存在该技能，来源可识别 | 不以技能中心可见或文件存在代替；先修装配，不改正文 |\n| DSH-02 | 同名解析 | 实际胜出来源是本轮指定原版或候选 | 原候选分隔运行；不得因优先级误读另一份 |\n| DSH-03 | 显式调用 | 相应调用策略允许时，用户手势或原生加载路径实际注入正确内容 | 本来禁用显式调用的技能应验证正确拒绝，不能为过测试强开 |\n| DSH-04 | 自然选择 | 真实任务下加载记录及近邻非目标任务下的拒选／合理澄清 | 不能以回答提到名称或显式调用成功代替 |\n| DSH-05 | 资源定位 | 使用资源时解析到当前包的正确内容，包外引用单独列明 | 无资源则该项不适用；新增资源后必须补验 |\n| DSH-06 | 工具执行 | 原生工具调用与结果、身份、输入范围和实际产物 | 自述不算执行；工具错误与业务不合格分开 |\n| DSH-07 | 业务结果 | 在规定对象和范围内满足业务验收 | 退出码零、生成文件或齐全模板不算充分证据 |\n| DSH-08 | 权限边界 | 受控禁止操作实际被拒绝，原版／裁判不被写入 | 不进行真实破坏性探针；隔离达不到则阻断高后果实验 |\n| DSH-09 | 恢复与预算 | 中断恢复后的对象一致、状态正确、预算累计、动作不错误重放 | 不能靠模型承诺或文件修改时间推断阶段已完成 |\n"},"source-6057c1c6a480d105-s4":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/03-DSH运行与验收契约.md:25-26`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 3. 两类实验路径\n"},"source-6057c1c6a480d105-s5":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/03-DSH运行与验收契约.md:27-30`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 3.1 内容能力实验\n\n在明确加载正确版本之后测业务结果，隔离“能否选中”因素。原版和候选使用相同逻辑技能名，分别装配到互不污染的 DSH 运行。修改名称、扩大工具集、提供额外答案等都属于干预变化，不能只把收益归给正文。\n"},"source-6057c1c6a480d105-s6":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/03-DSH运行与验收契约.md:31-36`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 3.2 自然选择及岗位集成实验\n\n被测侧只收到正常用户请求，不带“请使用某技能”的提示。保留目标岗位相关的相邻技能和工具，记录实际模型可见目录及已加载内容。先在受控小集合定位问题，最终还要在有代表性的岗位装配中复验。\n\n首轮本地报告与小型表格范围已确认，DSH接缝的只读核对已完成，见[P0调查](07-P0原生执行接缝与隔离方案.md)。具体测试岗位和模型尚未选定；执行前必须确认并冻结，不自行推定某 preset 就是生产代表。\n"},"source-6057c1c6a480d105-s7":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/03-DSH运行与验收契约.md:37-45`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 4. 原版与候选隔离\n\n- 使用同一逻辑技能名，在分开的运行区域或独立作用域装配，不能把两版同时暴露并靠名字暗示模型选择。\n- 两侧数据、工具、授权和初态一致；工具结果中的历史文件、缓存、对话和 Git 历史也可能污染对照。\n- 候选如果新增 references，原版不能读到候选资源；路径变更必须体现于内容清单。\n- 内容相同但根目录不同也可能改变包外相对引用；基线移动后应检查引用语义是否保持。不能复制后自动补文件，再称“原版无改动”。\n- 只读调查已找到Desktop原生create/prompt/follow/cancel等接缝，但访问隔离尚未证明，具体实现未选定；见[P0方案](07-P0原生执行接缝与隔离方案.md)。不猜测API、不调用会保存全局默认的模型切换入口来静默改变日常环境。\n- 专用测试作用域的操作准入、预算与停止设计见[08-P0控制契约](08-P0读取预算与终止控制契约.md)。首版已由D10选择A，不开放任意代码或通用shell，原版与候选工具条件一致；受限环境结果不直接代表日常全工具岗位。实施步骤见[09-P0最小实现计划](09-P0最小实现计划.md)，尚未执行。\n"},"source-6057c1c6a480d105-s8":{"body":"来源：`docs/spec 包外 `../../CONNECTORS.md` 缺失是已知静态事实。首轮若选择无需连接器的本地报告／数据路径，应标明排除了连接器分支；若运行时实际需要它，则停止并明确缺依赖。原版不得补齐后仍称未修改。候选是否修复引用要基于确认的目标与独立内容身份。\n"},"source-6057c1c6a480d105-s11":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/03-DSH运行与验收契约.md:79-83`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 8. 可交付声明格式\n\n“候选 X 在 DSH 版本、模型配置、岗位／工具集合、测试范围 Y 下完成检查，结论为 Z；未覆盖的路径为 W。”\n\n禁止使用不带范围的“全平台兼容”“全部安全”“生产就绪”。A 阶段无生产部署，因此没有生产稳定性结论。"},"source-c4faa2ebbec318d8":{"body":"# docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：AGENTS.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# 08｜P0 控制契约：读取隔离、累计预算与终止恢复\n\n状态：首版工具边界A已确认，T01—T08已完成本地实现，共275项测试通过（T06原生模块级、T07执行前门、T08窄服务图真实会话），见[17-T08记录](17-T08实现与验证记录.md)；真实provider探针（T09）仍未执行。生产岗位、权限、应用bundle、用户DSH主目录和模型调用均未授权变更或执行。\n\n前置资料：[07-P0原生执行接缝与隔离方案](07-P0原生执行接缝与隔离方案.md)、[03-DSH运行与验收契约](03-DSH运行与验收契约.md)。本轮静态证据摘要：[p0-control-seams.json](evidence/p0-control-seams.json)。本文件定义实现应满足的契约，不承诺仅靠某个hook就已覆盖所有入口。\n\n## 1. 本阶段要交付什么\n\n只建立一个可以安全执行 `validate-data` 本地报告／小型表格任务的专用测试作用域。保留原版业务输入输出；原版和候选使用相同工具与权限。先证明控制逻辑和原生集成，再开展获准的小批模型探针。\n\n不在P0建设多租户平台、远程集群、跨平台适配、动态任意工具编排或自动生产发布。不新增六个常驻Agent。把职责分成三个可测试接缝即可：操作准入、请求准入与用量结算、工作流终止与恢复。\n\n## 2. 威胁模型与限制\n\n需要防止：被测模型受用户输入、Skill、报告或工具结果诱导，读取金标／其他运行文件、修改原版或裁判、发出额外网络请求、超出预算或在停止后继续执行。\n\n假设宿主和加载的控制代码已经审查且可信。本方案不宣称抵御恶意宿主插件、本机其他高权限进程或系统被攻破。只分会话或给目录起名不构成访问隔离；同一操作系统用户运行的恶意任意代码也不能靠应用层路径过滤可靠约束。\n\n首版已选A：不向被测执行者开放通用shell、任意代码执行、浏览器、网络MCP、子代理和可更换工具装配的能力。它可以读允许的本地文件、做受控计算、将报告写入允许的产物区。这个收缩必须同时应用于原版与候选，结果只对该环境有效，不能直接推广到日常全工具岗位。\n\n如果业务必须执行任意Python或SQL程序，应另行验证真正的进程／文件／网络隔离后再开放，不能用命令黑名单或“禁止open”的字符串检查冒充沙箱。无需改变 `validate-data` 的任务职责来迎合控制器。\n\n## 3. 文件和工具准入契约\n\n### 3.1 访问矩阵\n\n以下区域是逻辑分区，路径在实现时由宿主解析和绑定，不允许模型任意指定运行根。\n\n| 区域 | 被测执行者 | 优化者 | 裁判／核对流程 |\n|---|---|---|---|\n| 原始源库 | 不直接访问，读取本轮冻结副本 | 只读允许的源副本 | 读取身份清单，不修改 |\n| 本轮Skill与允许参考副本 | 只读 | 在开发候选区读写，不改冻结版本 | 只读 |\n| 当前题目输入 | 只读，不含金标 | 仅开发输入与获准反馈 | 按职责只读 |\n| 本次运行产物区 | 可创建／更新允许的报告与计算结果 | 不改已封存被测输出 | 只读，评分另写 |\n| 金标、终测答案、评分规则 | 不可读写 | 不可读写受保护内容 | 仅受控裁判可读；运行期间不得修改 |\n| 其他运行、其他会话、凭据、用户目录 | 不可访问 | 无默认权限 | 无默认权限 |\n| 状态与预算账本 | 不可写，必要时仅给摘要 | 不可改 | 由可信控制层写入 |\n\n矩阵不能只写在SKILL.md，必须由工具／文件后端及受控执行通道实施。标注“不可访问”是目标要求，不表示现有DSH已经做到。\n\n工具之外也要核对上下文入口：继承会话、全局记忆、项目规则、启动hook、额外skill provider、文件搜索补全和自动附件均可能把受保护内容送进模型。专用测试装配应只注入冻结且获准的材料；正常会话的个人记忆不应默认进入被测运行。禁止读取金标却把它提前注入上下文，仍然属于泄漏。\n\n### 3.2 操作准入规则\n\n- 每个调用必须关联有效的运行标识、会话、角色和配置版本；只管理专用测试作用域，不影响其他会话。\n- 使用精确工具标识白名单。未知工具、未知路径参数或未识别操作默认拒绝；列表、搜索、附件读取和Skill资源读取同样要纳入范围。\n- 读取前按真实路径、文件类型和允许根核验；不使用简单字符串前缀。拒绝指向范围外的软链接、设备、管道与未授权别名。\n- 输入与冻结Skill根不可被执行者修改；输出根由宿主预置，不能与源、金标或其他运行重叠。创建新文件时验证真实父目录，且防止借链接改写受保护文件。\n- 如果开放任何能自行访问文件的执行器，路径门禁必须覆盖该执行器；无法覆盖则不开放。对可变链接的竞争条件要通过受控目录所有权及实际I/O边界验证处理，不能仅“检查后相信路径不变”。\n- 拒绝后不允许自动升级为询问授权并在本运行放宽；需要更多能力时结束为受阻，提出新的、明确的运行配置版本。\n- 读取限制还包括返回内容：不把不必要的目录清单、配置、跨会话信息或原始日志泄漏给执行者。\n\n### 3.3 受控计算与公平比较\n\n首轮表格以普通文本／CSV输入为主。若需要工具复算，优先使用无任意代码执行、无外部I/O的计算接口：宿主提供当前允许数据，模型只指定通用聚合或算术操作，结果记录实际输入和运算。不是为特定题目写正确答案函数，也不把所有需要判断的规则硬编码。\n\n通用计算范围、数据类型和工具标识必须在运行前冻结，并原样提供给无Skill、原版和候选。T03已实现有限CSV、标量与聚合纯函数并完成本地链路测试，见[12-T03](12-T03实现与验证记录.md)；尚未接入DSH工具准入。首次验证仍应标“受限工具配置”，进入真实代表岗位回归时重新测量。\n\n## 4. 累计预算契约\n\n### 4.1 三个计数不能混为一谈\n\n- **任务执行**：一个测试输入在一套配置下的完整Agent任务。\n- **模型请求尝试**：每一次真实provider发送，包括失败、重试、压缩、裁判和其他模型调用；不等于对话轮数。\n- **使用量与时间**：输入／输出／缓存等provider实际用量，以及单次、任务和批次墙钟期限。\n\n本阶段不钉死金额或次数；真实探针前由用户批准明确的数值上限。未知用量不能按0计入；取消不保证退款；没有价格版本和请求上界不能承诺精确费用硬上限。\n\n### 4.2 准入、预留、结算\n\n1. 请求进入实际发送边界前，检查运行仍可执行、授权与期限有效、剩余额度足够；记录唯一尝试标识并预留本次额度。\n2. 首版限制单一在途请求，减少并发超额与归属复杂性；后续需要并发再扩展。\n3. 每个重试是新尝试，也必须准入和计数。只拦Agent外层一步而看不到provider内部重试，不能声称覆盖真实请求预算。\n4. 请求结束按可核验用量结算，重复事件按尝试身份去重；不能把流式快照与最终汇总重复相加。\n5. 发送后发生中断、缺结果或账本恢复时，预留标为待核对，不直接释放或重新发送；无法判定的费用保守保留并阻止新增调用，直到核对或新授权。\n6. 账本写入失败时不继续发新请求。日志或报告可重建，已发生请求与预算不能靠模型重新描述补造。\n\n只有能够约束完整请求输入大小、最大输出、计费口径和重试，才能提供有依据的用量上界。否则提供“请求尝试数硬限＋已观测用量／时间软阈值”，并明确超限不确定性；若用户要求费用硬限但无法保证，就阻断而非隐去差别。\n\n### 4.3 控制层范围\n\n启动前审计测试作用域里所有可能调用模型的组件。主任务、标题生成、上下文压缩、裁判、优化者、工具内调用与重试必须纳入总预算，或明确不启用相应组件。不得为了漏算的后台调用宣称预算达标。具体原生拦截位置须由代码核验和无模型传输桩证明。\n\n## 5. 终止与恢复契约\n\n### 5.1 终止不是一个cancel按钮\n\n生命周期：`prepared → running → stopping → stopped`。正常任务结束可以是`completed`；若不能证明停止完成，保留`stop_unconfirmed`，它不是终止成功或可复用结果。\n\n一旦进入stopping，本次运行不再返回running。重启进程、收到迟到事件或重新连接都不能自动解锁。需要恢复业务执行时，以新的获准尝试继承原批次身份与累计预算，不从零计费。\n\n### 5.2 顺序\n\n1. 先在持久状态中关闭新prompt、工具和provider请求准入。\n2. 再撤销本测试会话的排队工作并发出在途取消；只操作本控制器拥有的会话，不清理用户其他任务。\n3. 停止本次受控执行器和输出写入，等待原生空闲／终止与在途记录收敛。\n4. 保存最终已知用量、产物身份、停止原因和未决事项，才标stopped。\n5. 超时仍不能确认时标stop_unconfirmed并隔离本次结果，不启动下一批；不强杀整个Desktop作为默认兜底。\n\n取消请求返回accepted，只说明请求收到了，不证明工具子进程、provider计费或inbox全部结束。迟到结果可作费用／审计核对，但不能将已停止的任务自动改成业务通过。\n\n### 5.3 恢复\n\n控制层只能恢复身份匹配且已提交的阶段。校验源、候选、测试、裁判、环境和政策版本；不匹配则让受影响阶段失效，保留历史记录。运行所有权用唯一标识与受控锁保证，同一运行不能有两个恢复者同时推进。\n\n重点演练三个窗口：请求预留后未确定是否发送；模型完成但用量未提交；产物写完但阶段状态未提交。前两种先核对，后一种验证产物后重建报告，不能简单全量重跑。\n\n## 6. 证据契约\n\n每项控制决定最少记录：运行／任务／尝试身份、角色、内容与环境身份、操作类别、允许／拒绝、理由、事件序号／时间、预算预留或结算状态。路径默认使用项目相对引用，秘密与金标不进入通用报告。\n\n证据分为：静态代码事实、无模型控制测试、真实DSH工具／会话验证、获准provider请求。四类分别标记，不用模拟轨迹填真实结果。模型产生的“我没有读金标”不算隔离证据。\n\n## 7. 无模型验证清单\n\n所有输入均为公开构造物或无敏感哨兵；没有真实金标、用户文件或付费请求。\n\n| ID | 行为 | 预期 |\n|---|---|---|\n| C01 | 读取允许的输入与冻结Skill | 成功，记录内容身份 |\n| C02 | 读取输入根外哨兵、父路径或链接目标 | 拒绝，不返回内容 |\n| C03 | 写本次输出；写源／裁判／其他运行 | 前者允许，后者拒绝 |\n| C04 | 搜索、列目录、附件或未知工具访问未授权范围 | 拒绝或不装配，不能旁路 |\n| C05 | 请求通用shell、网络、子代理或动态插件 | 首版拒绝，日志能定位 |\n| C06 | 两个执行者争用同一剩余额度 | 准入不超额；首版只允许一个在途 |\n| C07 | provider在同一步内部重试 | 每次尝试都计数，额度用完不发送 |\n| C08 | 用量缺失、重复或迟到 | 不按0、不重复结算、不自动解锁 |\n| C09 | 账本不可写或版本不匹配 | 请求发送前阻断 |\n| C10 | stop到达时已有inbox和在途工具 | 先关准入，再清本会话队列并取消 |\n| C11 | stop后重连、新prompt或迟到结果 | 不重新执行；结果仅审计或核对 |\n| C12 | 停止无法确认 | stop_unconfirmed，不标通过、不启动下一批 |\n| C13 | 三种恢复窗口 | 不重复发送、不重置预算，身份不符拒绝复用 |\n| C14 | 非测试岗位操作 | 控制器不改变其模型、权限或队列 |\n\n无模型测试通过仍不能证明真实provider完整用量或取消行为；这些留给之后获准的小批探针。检查数量不是质量分数，任一关键边界失败就不能进入相应真实实验。\n\n## 8. 建议实施切片\n\n- **S0 固定契约与测试夹具**：落实本文件的受控状态和公开控制反例，保持不调用模型。\n- **S1 操作边界**：装配最小专用测试工具，验证C01—C05及非测试岗位不受影响。\n- **S2 请求预算与停止**：接入真实发送前位置及终止生命周期，用无网络传输桩验证C06—C13。\n- **S3 DSH原生无模型集成**：创建经批准的专用测试作用域，验证实际工具链、事件和恢复，而非只测纯函数。\n- **S4 获准小批真实探针**：在明确预算与数据范围后验证模型链路，随后才进入原版基线和候选优化。\n\n这些是安装代码内部服务与事件接缝，需要在专用测试装配中验证，不能直接当成当前会话可调用的外部接口。\n\n## 9. 本轮核验的原生接缝\n\n共同前缀：`/Applications/DSH Desktop.app/Contents/Resources/app/node_modules/@deepseek-ai/`。\n\n| 控制 | 文件定位 | 已确认事实 | 必须补的验证 |\n|---|---|---|---|\n| 单调拒绝 | `dsh-tools/lib/index.js:2807–2829` | `tools.guard`返回原因字符串可拒绝，agent.ctx范围的guard只作用于相应Agent，其他guard不能强行放过已拒调用 | 宿主插件装配时机、实际工具路径覆盖、内部服务直读与上下文入口 |\n| 调用载荷 | 同文件 `:3030–3059` | 执行含name、agent及深冻结的参数快照 | 参数校验到实际I/O之间的路径竞争和别名 |\n| 审批后仍拦截 | 同文件 `:3115–3147` | pre-execute/ask完成后，allow仍经过guardReason | 普通waterfall的顺序不用于作不可覆写保证；应使用monotonic guard |\n| 模型请求包装 | `dsh-llm/lib/index.js:2303–2307` | `streamWithRegistration`汇入 `llm/stream` 后调用adapterStream；prepared路径也汇入此链（同文件约:2168） | 当前provider内部重试是否一一对应wire请求仍未知，不能宣称硬费用限额 |\n| Agent重试 | `dsh-agent-loop/lib/index.js:1016–1036,1088–1098` | 每次attempt重新prepare和stream；pre-step不覆盖所有重试次数 | 所有附属模型调用是否进入同一受控账本，完整归属待验证 |\n| 用量边界 | 同文件 `:1048–1074,1108–1114` | 成功或部分中断可能带usage，失败记录可能没有 | 缺失、重复、迟到事件不可当0或重复计数 |\n| 清队列取消 | 同文件 `:798–803` | 原生agent.cancel不保留inbox时会clear并abort | 是插件内部句柄接缝；外部sessionController.cancel仍保留队列，不能混用语义 |\n| 等待空闲 | 同文件 `:853–857` | `whenIdle()`等待活动句柄稳定结束 | 协作取消不是强杀；在途工具、隐含子任务与provider计费须分别确认 |\n| macOS shell策略 | `dsh-sandbox-local/lib/index.js:65–74` | 策略为allow default再限制file-write，未提供本次要求的读取白名单 | 不开放通用shell或另行提供真实读隔离，不能靠cwd解决 |\n\n因此推荐实现接缝是专用作用域的 `tools.guard`、受控 `llm/stream` 请求包装、原生agent清队列取消／whenIdle，加外层持久化准入状态。不是改写整个Agent loop，也不是只依赖软提示。\n\n上表中标注\"必须补的验证\"的接缝，T06已在裸cordis上下文中用真实ToolRuntime/LlmRuntime实测：作用域guard单调（pre-execute的allow不能覆写拒绝）、白名单工具真实执行、两条stream路径都经过受控包装、每次重试独立预留、离线adapter零网络。实测结论与偏差见[15-T06记录](15-T06实现与验证记录.md)；该表保留为静态调查的历史记录，不再作为当前证据。\n\n`tools.guard`是同步接口，适合检查角色、状态、已核对的参数和精确工具身份；异步真实路径校验、文件打开和大小限制必须在可信I/O实现边界完成。不能把异步检查塞进同步guard后假定已经拒绝，也不能忽略校验与实际打开之间的竞争条件。若宿主启用 `run_code` 等程序化工具调用传输，还须核对最终能力是否经过同一guard、是否允许额外代码I/O；未验证前不装配这类模式，不猜测可用restrict参数。\n\n`llm/stream`是可扩展waterfall，不是已证明不可覆写的预算安全门。专用装配要冻结处理器顺序，确认所有实际发送均经过计数，不能由其他middleware直接调用adapter旁路。无法做到时只能标部分覆盖并阻断对应硬预算声明。\n\n## 10. 最小实现边界\n\n- 首版已确认A：无通用shell、无任意代码、无网络MCP／浏览器／子代理；原版与候选同配置，受限环境结论不能外推全工具岗位。\n- 控制代码通过可维护插件／测试装配接入，不修改app bundle；新测试岗位与配置写入必须显式批准。\n- 当前provider内部重试和辅助模型调用的边界，在实现时用无网络传输桩核对；找不到足够接缝时不得声称费用硬上限。\n- 真实模型、次数、输出上限、墙钟和预算数值，在S4前确认；S0—S3不调用付费模型也不代表无需审批配置变更。\n\n已据D10工具边界形成[09-P0最小实现计划](09-P0最小实现计划.md)：T01—T07本地无网络实现和测试，T08原生会话装配、T09计费探针分别授权。T08 已按用户确认的路径（项目内`skill-lifecycle/trial-home`）与窄服务图完成，不再增加一轮工具边界讨论。T01—T08已按该计划完成本地实现与275项联合测试（见[17-T08记录](17-T08实现与验证记录.md)）；下一步 T09 需要明确的 provider/model、任务集与用量限额。"},"source-c4faa2ebbec318d8-s1":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# 08｜P0 控制契约：读取隔离、累计预算与终止恢复\n\n状态：首版工具边界A已确认，T01—T08已完成本地实现，共275项测试通过（T06原生模块级、T07执行前门、T08窄服务图真实会话），见[17-T08记录](17-T08实现与验证记录.md)；真实provider探针（T09）仍未执行。生产岗位、权限、应用bundle、用户DSH主目录和模型调用均未授权变更或执行。\n\n前置资料：[07-P0原生执行接缝与隔离方案](07-P0原生执行接缝与隔离方案.md)、[03-DSH运行与验收契约](03-DSH运行与验收契约.md)。本轮静态证据摘要：[p0-control-seams.json](evidence/p0-control-seams.json)。本文件定义实现应满足的契约，不承诺仅靠某个hook就已覆盖所有入口。\n"},"source-c4faa2ebbec318d8-s2":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:7-12`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 1. 本阶段要交付什么\n\n只建立一个可以安全执行 `validate-data` 本地报告／小型表格任务的专用测试作用域。保留原版业务输入输出；原版和候选使用相同工具与权限。先证明控制逻辑和原生集成，再开展获准的小批模型探针。\n\n不在P0建设多租户平台、远程集群、跨平台适配、动态任意工具编排或自动生产发布。不新增六个常驻Agent。把职责分成三个可测试接缝即可：操作准入、请求准入与用量结算、工作流终止与恢复。\n"},"source-c4faa2ebbec318d8-s3":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:13-22`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 2. 威胁模型与限制\n\n需要防止：被测模型受用户输入、Skill、报告或工具结果诱导，读取金标／其他运行文件、修改原版或裁判、发出额外网络请求、超出预算或在停止后继续执行。\n\n假设宿主和加载的控制代码已经审查且可信。本方案不宣称抵御恶意宿主插件、本机其他高权限进程或系统被攻破。只分会话或给目录起名不构成访问隔离；同一操作系统用户运行的恶意任意代码也不能靠应用层路径过滤可靠约束。\n\n首版已选A：不向被测执行者开放通用shell、任意代码执行、浏览器、网络MCP、子代理和可更换工具装配的能力。它可以读允许的本地文件、做受控计算、将报告写入允许的产物区。这个收缩必须同时应用于原版与候选，结果只对该环境有效，不能直接推广到日常全工具岗位。\n\n如果业务必须执行任意Python或SQL程序，应另行验证真正的进程／文件／网络隔离后再开放，不能用命令黑名单或“禁止open”的字符串检查冒充沙箱。无需改变 `validate-data` 的任务职责来迎合控制器。\n"},"source-c4faa2ebbec318d8-s4":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:23-24`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 3. 文件和工具准入契约\n"},"source-c4faa2ebbec318d8-s5":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:25-42`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 3.1 访问矩阵\n\n以下区域是逻辑分区，路径在实现时由宿主解析和绑定，不允许模型任意指定运行根。\n\n| 区域 | 被测执行者 | 优化者 | 裁判／核对流程 |\n|---|---|---|---|\n| 原始源库 | 不直接访问，读取本轮冻结副本 | 只读允许的源副本 | 读取身份清单，不修改 |\n| 本轮Skill与允许参考副本 | 只读 | 在开发候选区读写，不改冻结版本 | 只读 |\n| 当前题目输入 | 只读，不含金标 | 仅开发输入与获准反馈 | 按职责只读 |\n| 本次运行产物区 | 可创建／更新允许的报告与计算结果 | 不改已封存被测输出 | 只读，评分另写 |\n| 金标、终测答案、评分规则 | 不可读写 | 不可读写受保护内容 | 仅受控裁判可读；运行期间不得修改 |\n| 其他运行、其他会话、凭据、用户目录 | 不可访问 | 无默认权限 | 无默认权限 |\n| 状态与预算账本 | 不可写，必要时仅给摘要 | 不可改 | 由可信控制层写入 |\n\n矩阵不能只写在SKILL.md，必须由工具／文件后端及受控执行通道实施。标注“不可访问”是目标要求，不表示现有DSH已经做到。\n\n工具之外也要核对上下文入口：继承会话、全局记忆、项目规则、启动hook、额外skill provider、文件搜索补全和自动附件均可能把受保护内容送进模型。专用测试装配应只注入冻结且获准的材料；正常会话的个人记忆不应默认进入被测运行。禁止读取金标却把它提前注入上下文，仍然属于泄漏。\n"},"source-c4faa2ebbec318d8-s6":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:43-52`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 3.2 操作准入规则\n\n- 每个调用必须关联有效的运行标识、会话、角色和配置版本；只管理专用测试作用域，不影响其他会话。\n- 使用精确工具标识白名单。未知工具、未知路径参数或未识别操作默认拒绝；列表、搜索、附件读取和Skill资源读取同样要纳入范围。\n- 读取前按真实路径、文件类型和允许根核验；不使用简单字符串前缀。拒绝指向范围外的软链接、设备、管道与未授权别名。\n- 输入与冻结Skill根不可被执行者修改；输出根由宿主预置，不能与源、金标或其他运行重叠。创建新文件时验证真实父目录，且防止借链接改写受保护文件。\n- 如果开放任何能自行访问文件的执行器，路径门禁必须覆盖该执行器；无法覆盖则不开放。对可变链接的竞争条件要通过受控目录所有权及实际I/O边界验证处理，不能仅“检查后相信路径不变”。\n- 拒绝后不允许自动升级为询问授权并在本运行放宽；需要更多能力时结束为受阻，提出新的、明确的运行配置版本。\n- 读取限制还包括返回内容：不把不必要的目录清单、配置、跨会话信息或原始日志泄漏给执行者。\n"},"source-c4faa2ebbec318d8-s7":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:53-58`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 3.3 受控计算与公平比较\n\n首轮表格以普通文本／CSV输入为主。若需要工具复算，优先使用无任意代码执行、无外部I/O的计算接口：宿主提供当前允许数据，模型只指定通用聚合或算术操作，结果记录实际输入和运算。不是为特定题目写正确答案函数，也不把所有需要判断的规则硬编码。\n\n通用计算范围、数据类型和工具标识必须在运行前冻结，并原样提供给无Skill、原版和候选。T03已实现有限CSV、标量与聚合纯函数并完成本地链路测试，见[12-T03](12-T03实现与验证记录.md)；尚未接入DSH工具准入。首次验证仍应标“受限工具配置”，进入真实代表岗位回归时重新测量。\n"},"source-c4faa2ebbec318d8-s8":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:59-60`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 4. 累计预算契约\n"},"source-c4faa2ebbec318d8-s9":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:61-68`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 4.1 三个计数不能混为一谈\n\n- **任务执行**：一个测试输入在一套配置下的完整Agent任务。\n- **模型请求尝试**：每一次真实provider发送，包括失败、重试、压缩、裁判和其他模型调用；不等于对话轮数。\n- **使用量与时间**：输入／输出／缓存等provider实际用量，以及单次、任务和批次墙钟期限。\n\n本阶段不钉死金额或次数；真实探针前由用户批准明确的数值上限。未知用量不能按0计入；取消不保证退款；没有价格版本和请求上界不能承诺精确费用硬上限。\n"},"source-c4faa2ebbec318d8-s10":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:69-79`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 4.2 准入、预留、结算\n\n1. 请求进入实际发送边界前，检查运行仍可执行、授权与期限有效、剩余额度足够；记录唯一尝试标识并预留本次额度。\n2. 首版限制单一在途请求，减少并发超额与归属复杂性；后续需要并发再扩展。\n3. 每个重试是新尝试，也必须准入和计数。只拦Agent外层一步而看不到provider内部重试，不能声称覆盖真实请求预算。\n4. 请求结束按可核验用量结算，重复事件按尝试身份去重；不能把流式快照与最终汇总重复相加。\n5. 发送后发生中断、缺结果或账本恢复时，预留标为待核对，不直接释放或重新发送；无法判定的费用保守保留并阻止新增调用，直到核对或新授权。\n6. 账本写入失败时不继续发新请求。日志或报告可重建，已发生请求与预算不能靠模型重新描述补造。\n\n只有能够约束完整请求输入大小、最大输出、计费口径和重试，才能提供有依据的用量上界。否则提供“请求尝试数硬限＋已观测用量／时间软阈值”，并明确超限不确定性；若用户要求费用硬限但无法保证，就阻断而非隐去差别。\n"},"source-c4faa2ebbec318d8-s11":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:80-83`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 4.3 控制层范围\n\n启动前审计测试作用域里所有可能调用模型的组件。主任务、标题生成、上下文压缩、裁判、优化者、工具内调用与重试必须纳入总预算，或明确不启用相应组件。不得为了漏算的后台调用宣称预算达标。具体原生拦截位置须由代码核验和无模型传输桩证明。\n"},"source-c4faa2ebbec318d8-s12":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:84-85`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 5. 终止与恢复契约\n"},"source-c4faa2ebbec318d8-s13":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:86-91`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 5.1 终止不是一个cancel按钮\n\n生命周期：`prepared → running → stopping → stopped`。正常任务结束可以是`completed`；若不能证明停止完成，保留`stop_unconfirmed`，它不是终止成功或可复用结果。\n\n一旦进入stopping，本次运行不再返回running。重启进程、收到迟到事件或重新连接都不能自动解锁。需要恢复业务执行时，以新的获准尝试继承原批次身份与累计预算，不从零计费。\n"},"source-c4faa2ebbec318d8-s14":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:92-101`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 5.2 顺序\n\n1. 先在持久状态中关闭新prompt、工具和provider请求准入。\n2. 再撤销本测试会话的排队工作并发出在途取消；只操作本控制器拥有的会话，不清理用户其他任务。\n3. 停止本次受控执行器和输出写入，等待原生空闲／终止与在途记录收敛。\n4. 保存最终已知用量、产物身份、停止原因和未决事项，才标stopped。\n5. 超时仍不能确认时标stop_unconfirmed并隔离本次结果，不启动下一批；不强杀整个Desktop作为默认兜底。\n\n取消请求返回accepted，只说明请求收到了，不证明工具子进程、provider计费或inbox全部结束。迟到结果可作费用／审计核对，但不能将已停止的任务自动改成业务通过。\n"},"source-c4faa2ebbec318d8-s15":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:102-107`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 5.3 恢复\n\n控制层只能恢复身份匹配且已提交的阶段。校验源、候选、测试、裁判、环境和政策版本；不匹配则让受影响阶段失效，保留历史记录。运行所有权用唯一标识与受控锁保证，同一运行不能有两个恢复者同时推进。\n\n重点演练三个窗口：请求预留后未确定是否发送；模型完成但用量未提交；产物写完但阶段状态未提交。前两种先核对，后一种验证产物后重建报告，不能简单全量重跑。\n"},"source-c4faa2ebbec318d8-s16":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:108-113`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 6. 证据契约\n\n每项控制决定最少记录：运行／任务／尝试身份、角色、内容与环境身份、操作类别、允许／拒绝、理由、事件序号／时间、预算预留或结算状态。路径默认使用项目相对引用，秘密与金标不进入通用报告。\n\n证据分为：静态代码事实、无模型控制测试、真实DSH工具／会话验证、获准provider请求。四类分别标记，不用模拟轨迹填真实结果。模型产生的“我没有读金标”不算隔离证据。\n"},"source-c4faa2ebbec318d8-s17":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:114-136`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 7. 无模型验证清单\n\n所有输入均为公开构造物或无敏感哨兵；没有真实金标、用户文件或付费请求。\n\n| ID | 行为 | 预期 |\n|---|---|---|\n| C01 | 读取允许的输入与冻结Skill | 成功，记录内容身份 |\n| C02 | 读取输入根外哨兵、父路径或链接目标 | 拒绝，不返回内容 |\n| C03 | 写本次输出；写源／裁判／其他运行 | 前者允许，后者拒绝 |\n| C04 | 搜索、列目录、附件或未知工具访问未授权范围 | 拒绝或不装配，不能旁路 |\n| C05 | 请求通用shell、网络、子代理或动态插件 | 首版拒绝，日志能定位 |\n| C06 | 两个执行者争用同一剩余额度 | 准入不超额；首版只允许一个在途 |\n| C07 | provider在同一步内部重试 | 每次尝试都计数，额度用完不发送 |\n| C08 | 用量缺失、重复或迟到 | 不按0、不重复结算、不自动解锁 |\n| C09 | 账本不可写或版本不匹配 | 请求发送前阻断 |\n| C10 | stop到达时已有inbox和在途工具 | 先关准入，再清本会话队列并取消 |\n| C11 | stop后重连、新prompt或迟到结果 | 不重新执行；结果仅审计或核对 |\n| C12 | 停止无法确认 | stop_unconfirmed，不标通过、不启动下一批 |\n| C13 | 三种恢复窗口 | 不重复发送、不重置预算，身份不符拒绝复用 |\n| C14 | 非测试岗位操作 | 控制器不改变其模型、权限或队列 |\n\n无模型测试通过仍不能证明真实provider完整用量或取消行为；这些留给之后获准的小批探针。检查数量不是质量分数，任一关键边界失败就不能进入相应真实实验。\n"},"source-c4faa2ebbec318d8-s18":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:137-146`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 8. 建议实施切片\n\n- **S0 固定契约与测试夹具**：落实本文件的受控状态和公开控制反例，保持不调用模型。\n- **S1 操作边界**：装配最小专用测试工具，验证C01—C05及非测试岗位不受影响。\n- **S2 请求预算与停止**：接入真实发送前位置及终止生命周期，用无网络传输桩验证C06—C13。\n- **S3 DSH原生无模型集成**：创建经批准的专用测试作用域，验证实际工具链、事件和恢复，而非只测纯函数。\n- **S4 获准小批真实探针**：在明确预算与数据范围后验证模型链路，随后才进入原版基线和候选优化。\n\n这些是安装代码内部服务与事件接缝，需要在专用测试装配中验证，不能直接当成当前会话可调用的外部接口。\n"},"source-c4faa2ebbec318d8-s19":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:147-170`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 9. 本轮核验的原生接缝\n\n共同前缀：`/Applications/DSH Desktop.app/Contents/Resources/app/node_modules/@deepseek-ai/`。\n\n| 控制 | 文件定位 | 已确认事实 | 必须补的验证 |\n|---|---|---|---|\n| 单调拒绝 | `dsh-tools/lib/index.js:2807–2829` | `tools.guard`返回原因字符串可拒绝，agent.ctx范围的guard只作用于相应Agent，其他guard不能强行放过已拒调用 | 宿主插件装配时机、实际工具路径覆盖、内部服务直读与上下文入口 |\n| 调用载荷 | 同文件 `:3030–3059` | 执行含name、agent及深冻结的参数快照 | 参数校验到实际I/O之间的路径竞争和别名 |\n| 审批后仍拦截 | 同文件 `:3115–3147` | pre-execute/ask完成后，allow仍经过guardReason | 普通waterfall的顺序不用于作不可覆写保证；应使用monotonic guard |\n| 模型请求包装 | `dsh-llm/lib/index.js:2303–2307` | `streamWithRegistration`汇入 `llm/stream` 后调用adapterStream；prepared路径也汇入此链（同文件约:2168） | 当前provider内部重试是否一一对应wire请求仍未知，不能宣称硬费用限额 |\n| Agent重试 | `dsh-agent-loop/lib/index.js:1016–1036,1088–1098` | 每次attempt重新prepare和stream；pre-step不覆盖所有重试次数 | 所有附属模型调用是否进入同一受控账本，完整归属待验证 |\n| 用量边界 | 同文件 `:1048–1074,1108–1114` | 成功或部分中断可能带usage，失败记录可能没有 | 缺失、重复、迟到事件不可当0或重复计数 |\n| 清队列取消 | 同文件 `:798–803` | 原生agent.cancel不保留inbox时会clear并abort | 是插件内部句柄接缝；外部sessionController.cancel仍保留队列，不能混用语义 |\n| 等待空闲 | 同文件 `:853–857` | `whenIdle()`等待活动句柄稳定结束 | 协作取消不是强杀；在途工具、隐含子任务与provider计费须分别确认 |\n| macOS shell策略 | `dsh-sandbox-local/lib/index.js:65–74` | 策略为allow default再限制file-write，未提供本次要求的读取白名单 | 不开放通用shell或另行提供真实读隔离，不能靠cwd解决 |\n\n因此推荐实现接缝是专用作用域的 `tools.guard`、受控 `llm/stream` 请求包装、原生agent清队列取消／whenIdle，加外层持久化准入状态。不是改写整个Agent loop，也不是只依赖软提示。\n\n上表中标注\"必须补的验证\"的接缝，T06已在裸cordis上下文中用真实ToolRuntime/LlmRuntime实测：作用域guard单调（pre-execute的allow不能覆写拒绝）、白名单工具真实执行、两条stream路径都经过受控包装、每次重试独立预留、离线adapter零网络。实测结论与偏差见[15-T06记录](15-T06实现与验证记录.md)；该表保留为静态调查的历史记录，不再作为当前证据。\n\n`tools.guard`是同步接口，适合检查角色、状态、已核对的参数和精确工具身份；异步真实路径校验、文件打开和大小限制必须在可信I/O实现边界完成。不能把异步检查塞进同步guard后假定已经拒绝，也不能忽略校验与实际打开之间的竞争条件。若宿主启用 `run_code` 等程序化工具调用传输，还须核对最终能力是否经过同一guard、是否允许额外代码I/O；未验证前不装配这类模式，不猜测可用restrict参数。\n\n`llm/stream`是可扩展waterfall，不是已证明不可覆写的预算安全门。专用装配要冻结处理器顺序，确认所有实际发送均经过计数，不能由其他middleware直接调用adapter旁路。无法做到时只能标部分覆盖并阻断对应硬预算声明。\n"},"source-c4faa2ebbec318d8-s20":{"body":"来源：`docs/specs/2026-09-25-dsh-skill-lifecycle/08-P0读取预算与终止控制契约.md:171-178`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 10. 最小实现边界\n\n- 首版已确认A：无通用shell、无任意代码、无网络MCP／浏览器／子代理；原版与候选同配置，受限环境结论不能外推全工具岗位。\n- 控制代码通过可维护插件／测试装配接入，不修改app bundle；新测试岗位与配置写入必须显式批准。\n- 当前provider内部重试和辅助模型调用的边界，在实现时用无网络传输桩核对；找不到足够接缝时不得声称费用硬上限。\n- 真实模型、次数、输出上限、墙钟和预算数值，在S4前确认；S0—S3不调用付费模型也不代表无需审批配置变更。\n\n已据D10工具边界形成[09-P0最小实现计划](09-P0最小实现计划.md)：T01—T07本地无网络实现和测试，T08原生会话装配、T09计费探针分别授权。T08 已按用户确认的路径（项目内`skill-lifecycle/trial-home`）与窄服务图完成，不再增加一轮工具边界讨论。T01—T08已按该计划完成本地实现与275项联合测试（见[17-T08记录](17-T08实现与验证记录.md)）；下一步 T09 需要明确的 provider/model、任务集与用量限额。"},"folder:reference:.agents/skills/birdview/docs":{"body":"# .agents/skills/birdview/docs\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。"},"source-23ea8cb98901c0da":{"body":"# .agents/skills/birdview/docs/releasing.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.agents/skills/birdview/CONTRIBUTING.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Release Checklist\n\n[中文](releasing.zh.md)\n\n1. Review the diff and choose the release version. Keep `package.json`, the root package entry in `package-lock.json`, README version badges and release notes consistent.\n2. Run `npm ci`, `npm run typecheck`, `npm run check:build`, `npm test`, `npm run validate:examples` and `node scripts/check-docs.mjs`. Review translated documentation before updating its confirmation record.\n3. Run `npm run build:demo` and inspect the generated diff. Open the demo in both languages; check architecture, changes, comparison, guide and inspector within one screen on desktop and mobile. Install Chromium with `npx playwright install chromium`, then run `npm run test:browser` (viewer, guide, constraints, viewport and website); record any skipped checks.\n4. Include `LICENSE` and `THIRD_PARTY_NOTICES` in distributions. Check that screenshots, examples and attachments contain no private data. Preserve third-party notices in generated HTML when distributing it separately.\n5. Write release notes covering changes, installation, verification and known limitations. Birdview shows agent-declared activity; it does not independently observe edits or enforce the pre-edit workflow.\n6. After explicit authorization, commit the reviewed changes, create the version tag and publish the GitHub release. Run `npm run check:install` against the committed release candidate before tagging. Check the tag and downloadable contents. GitHub release preparation does not enable npm publication: the package remains `private`.\n\nGitHub offers bilingual bug and feature forms. The default PR template is English; use the Chinese companion when preferred. These platform templates are not executable skill instructions."},"source-23ea8cb98901c0da-s1":{"body":"来源：`.agents/skills/birdview/docs/releasing.md:1-12`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Release Checklist\n\n[中文](releasing.zh.md)\n\n1. Review the diff and choose the release version. Keep `package.json`, the root package entry in `package-lock.json`, README version badges and release notes consistent.\n2. Run `npm ci`, `npm run typecheck`, `npm run check:build`, `npm test`, `npm run validate:examples` and `node scripts/check-docs.mjs`. Review translated documentation before updating its confirmation record.\n3. Run `npm run build:demo` and inspect the generated diff. Open the demo in both languages; check architecture, changes, comparison, guide and inspector within one screen on desktop and mobile. Install Chromium with `npx playwright install chromium`, then run `npm run test:browser` (viewer, guide, constraints, viewport and website); record any skipped checks.\n4. Include `LICENSE` and `THIRD_PARTY_NOTICES` in distributions. Check that screenshots, examples and attachments contain no private data. Preserve third-party notices in generated HTML when distributing it separately.\n5. Write release notes covering changes, installation, verification and known limitations. Birdview shows agent-declared activity; it does not independently observe edits or enforce the pre-edit workflow.\n6. After explicit authorization, commit the reviewed changes, create the version tag and publish the GitHub release. Run `npm run check:install` against the committed release candidate before tagging. Check the tag and downloadable contents. GitHub release preparation does not enable npm publication: the package remains `private`.\n\nGitHub offers bilingual bug and feature forms. The default PR template is English; use the Chinese companion when preferred. These platform templates are not executable skill instructions."},"source-f62b15c078d22eb7":{"body":"# .agents/skills/birdview/docs/typescript-migration.md\n\n范围：按任务和引用关系判断 / Conditional\n\n来源于：.agents/skills/birdview/CONTRIBUTING.md\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## 原文 / Source\n\n# Full TypeScript migration work plan\n\n[中文](typescript-migration.zh.md)\n\nStatus: CLI and canonical contracts implemented; remaining stages pending. The user has authorized atomic commits, issues, linked PRs and merging after checks. This document authorizes no additional product behavior or release.\n\n## Goal and scope\n\nMake TypeScript the maintained source language for first-party executable code: Node commands, validation, rendering, browser interactions, repository tools and tests. CSS, HTML, Markdown and JSON/JSONL data remain appropriate formats. Distributed JavaScript is generated output, not a second implementation.\n\nThe migration should improve data contracts, state modeling and change safety. It is not a framework rewrite, a performance claim or evidence of better AI coding scores. Preserve frozen evaluation artifacts and existing benchmark runs.\n\n## Baseline and work isolation\n\n- `e04b808` migrated the mode CLI to `src/birdview.mts`, generating `scripts/birdview.mjs`. Strict checking, build verification and CI integration already exist.\n- The initial temporary `src/render.d.mts` declaration is replaced by the real `src/render.mts` implementation in issue #12.\n- The working tree also contains separate constraint, website and evaluation work. These changes are not part of this migration. Do not stage, overwrite or revert them. Coordinate ownership before migrating shared files such as `scripts/render.mjs`, `scripts/validate.mjs`, schemas and `package.json`.\n- Before each stage, record its base commit, relevant pending changes, owned files and commands that currently pass. Do not label another task's unfinished code a migration regression.\n\n## Target structure and decisions\n\n```text\nsrc/\n  contracts/         runtime definitions and inferred domain types\n  core/              semantic validation and pure layout/state logic\n  node/              CLI, rendering, Git inspection and repository tools\n  viewer/            browser entry, interactions, state and DOM code\ntest/                 TypeScript unit, integration and browser tests\nscripts/*.mjs         distributed Node entry points and supporting output\nassets/viewer.js      generated browser bundle embedded into standalone HTML\nschemas/*.json        generated exchange schemas, if retained for consumers\n```\n\nMove the existing CLI into this layout only when output mapping is ready; keep its public path working throughout. Node ESM and browser DOM need separate TypeScript configurations. Share domain types through explicit imports, not ambient globals.\n\nUse a TypeScript runtime-schema definition as the canonical structural contract. Stage 1 selected TypeBox 0.34.41 with the existing Ajv 8.20.0 validator instead of the initial Zod candidate: it directly represents existing `uniqueItems`, `dependentRequired`, pattern-property and strict-object rules. Infer types from the definitions. Generate published JSON Schema from them; do not hand-maintain parallel definitions. JSON/JSONL remains the AI-facing exchange format. Literal unions export as `anyOf` instead of `enum`; accepted JSON is compared with the old schemas, while detailed Ajv message wording/count may differ. Existing public schema IDs and definition anchors remain available. The existing date-time annotation-only policy is unchanged.\n\nKeep cross-record and repository checks as explicit semantic validation: schema revision binding, ownership, event order, constraint references and Git comparisons do not become true merely because an object has a TS type. Parse external input as `unknown`, validate it, then narrow it. Separate wire data from UI state and computed layout.\n\nUse `tsc` for strict checking and Node output. Use a small browser bundler, preferably esbuild after compatibility verification, to turn explicit imports into one self-contained script. Inline that script into the generated HTML; opening via `file://` must not require a server, CDN or runtime module fetch. Do not introduce a UI framework solely for this migration.\n\n## Stages and acceptance\n\n### 0. Freeze the migration baseline\n\n- Inventory maintained scripts, browser entry points, tests, inline scripts in templates/site pages and release assets. Classify experimental previews separately; migrate only if they are accepted as maintained product code.\n- Capture CLI exit behavior, exported functions, valid/invalid fixtures, multilingual views and standalone HTML behavior.\n- Resolve shared-file ownership with ongoing work. Record baseline failures separately.\n\nAcceptance: a bounded file inventory, baseline results and an agreed first batch; no unrelated work enters a migration commit.\n\n### 1. Introduce the canonical contracts\n\n- Define architecture, activity, constraints, evidence, translations and validation results in `src/contracts/` and infer their types.\n- Preserve missing-versus-null behavior, optional legacy fields, unknown-field rejection, string/path restrictions, cross-schema references and validation options. Do not silently coerce values or strip invalid fields.\n- Run old and new validation against the same positive and negative fixture corpus. Explain every acceptance difference; keep existing error codes and locations where consumed.\n- Test JSON Schema export separately: refinements may not be representable. Document the structural/semantic boundary instead of claiming the exported schema enforces everything.\n\nAcceptance: fixture parity, useful type narrowing after validation and reproducible schema export. Deliberate data-format breaks require a versioned migration and fixtures, not an accidental change during translation.\n\n### 2. Migrate the Node core\n\n- Migrate `validate.mjs`, `render.mjs` and accepted constraint-inspection functionality to typed sources in dependency order. Replace `src/render.d.mts` with the real typed implementation.\n- Type options, results, diagnostics and filesystem/process boundaries. Preserve safe path checks, output replacement behavior and CLI exit codes.\n- Migrate repository build/documentation tools too. Keep stable command paths using generated entry points where needed.\n\nAcceptance: CLI, contract and Git-fixture tests pass against emitted JS; `doctor` works outside the repository; installed bundles work without invoking a TS compiler.\n\n### 3. Migrate the browser implementation\n\n- Start with routing/layout and translation logic; then migrate activity state, constraints, guide and main view.\n- Replace textual script insertion and implicit shared variables with explicit imports and a small, typed viewer state. Avoid replacing globals with one untyped context object or inventing a large state-machine framework.\n- Model view modes and event phases as unions. Handle absent modules/events and DOM nodes deliberately; do not silence them with blanket casts or non-null assertions.\n- Replace tests that evaluate source strings with direct module tests, while retaining real-browser tests of the generated page.\n\nAcceptance: Chinese/English, architecture/changes/comparison, selection, hover, zoom, guide, constraint details and narrow layouts behave as before. Test empty/legacy data, escaping and browser errors. The page remains offline and self-contained.\n\n### 4. Complete tools, tests and distribution\n\n- Migrate remaining maintained helpers, browser tests and site/template executable logic. Third-party code is not rewritten. Use a supported compiled-test directory excluded from Git, and point browser tests at built assets.\n- Keep compiler and bundler as development dependencies. Include required JS, runtime dependencies, assets, generated schemas and license notices in release installation checks.\n- Expand `check:build` to cover every generated artifact, including added/deleted outputs. Maintain an explicit output inventory; never clean arbitrary paths or mix generated cleanup with source deletion.\n- Avoid circular bootstrapping: npm scripts must be able to build the TS build-check tool before using it, or ship and verify its generated JS.\n\nAcceptance: a clean source archive installs and runs using the documented commands; generated output is reproducible across Windows/Linux and supported Node versions, independent of CRLF/LF checkout.\n\n### 5. Remove transitional paths and release\n\n- Remove temporary declaration shims and duplicate handwritten JS only after parity is demonstrated. Ajv remains the chosen validator for TypeBox contracts, not a migration leftover. Update dependency lockfiles, notices, skill instructions and paired installation/contribution documents.\n- Keep external command names and exported data compatibility unless an explicit migration is documented. Archive baseline results and list verified platforms, skipped browser checks and remaining gaps.\n- Publish only after authorization. Do not replace the skill snapshot of an evaluation already in progress.\n\nAcceptance: all maintained first-party executable sources and tests are TS; remaining JS is identified generated output or third-party code; no temporary bypass remains unexplained.\n\n## Quality gates and execution rules\n\n- Require `strict`, `noUncheckedIndexedAccess` and `noEmitOnError`. Enable stricter optional-property checking in the new contracts. No broad `any`, `@ts-nocheck` or unchecked double assertions to make migration appear complete.\n- For each batch: typecheck, build/output consistency, affected behavior tests and reviewed diff. Run browser checks when browser behavior/build changes; run the full matrix at integration milestones.\n- CI must ultimately cover Windows/Linux, the supported Node versions, semantic/contract fixtures, generated-output consistency, documentation and browser smoke tests. Existing browser coverage is not automatically CI coverage.\n- A successful schema/type check does not establish architectural truth or product correctness. Report actual results and limits.\n- One coherent stage or module per commit. Keep independent product changes separate. Roll back a failing batch together with its generated outputs and dependency changes; retain the previous release until installation and browser gates pass.\n\n## Progress record\n\n| Stage | Status | Evidence / next step |\n| --- | --- | --- |\n| Initial CLI | Complete | `e04b808`; strict compilation, output comparison and 7 mode tests passed |\n| 0: baseline | Complete | Isolated worktree; frozen schema/routing/i18n baselines, CLI fixtures and visual comparisons; unrelated work excluded |\n| 1: contracts | Complete | PR #7; TypeBox source, inferred types, Ajv narrowing, schema export and mutation/type-negative parity |\n| 2: Node core | Complete | PRs #9, #11 and #13; repository checks, semantic validation and renderer; no declaration shim |\n| 3: browser | Complete | PRs #15, #17 and #19; strict DOM/activity/constraints/guide entry and offline bundle; 24 identical visual cases |\n| 4: distribution | Complete | PR #21 site/bootstrap; #22 typed tests, explicit artifact inventory, clean archive installation and CI browser/platform gates |\n| 5: cleanup/release | Cleanup complete; release separate | Maintained code/tests are TS; remaining JS is generated. No release requested |\n\nUpdate this table after each batch with commit, owned files, checks actually run and unresolved issues. Estimated completion dates are not substitutes for acceptance evidence.\n\nThe batch notes below retain their status at the time; the table and final verification record describe the current state.\n\nViewer completion (#18): the existing execution order now lives in `src/viewer/main.mts`, importing routing and i18n explicitly and emitting `assets/viewer.js`. DOM access is narrowed at runtime; optional nodes remain optional. View modes, guide restoration, constraints and activity records are typed without `any` or disabled checks. Legacy script fragments are removed. Chromium passed viewer, guide, constraints and viewport checks, including state/focus restoration; 24 desktop/mobile language/theme/view screenshots match byte-for-byte. CSS is unchanged. Guide tests now inspect rendered DOM state instead of global variables. Remaining work: site/template inline execution, remaining tests and distribution cleanup.\n\nTranslation-core batch (#16): move the unchanged UI catalog, locale discovery, URL/storage/base selection and text/array fallback into `src/viewer/i18n.mts`. The DOM adapter keeps its existing update sequence and styles. Direct module tests cover precedence, Chinese subtags, missing translations, empty translated text, question arrays and old catalog/example parity. Local typecheck, build/output checks and 80 tests passed. This batch does not claim the whole DOM translation layer has migrated.\n\nRouting batch (#14): `src/viewer/routing.mts` exports typed geometry, preserving dimensions, lane selection, costs and corner radii. The existing viewer accesses the generated IIFE through a single `BirdviewRouting` bridge until its own migration. Direct ESM tests compare exact coordinates and SVG paths against a frozen pre-migration implementation, including reversed edges, self edges, blockers, empty layouts and three example maps. Typecheck, generated-output checks and 77 tests passed locally. Chromium screenshots were byte-identical across 24 cases (Chinese/English, light/dark, 1440×900/390×844, architecture/changes/compare) with no page errors; animations were disabled only during capture. This is static visual parity, not exhaustive interaction coverage. CSS and the HTML template are untouched; only generated script content changes in the demo. Windows/Linux Node 18/24 CI remains the merge gate.\n\nRenderer batch (#12): `src/render.mts` replaces the temporary declaration and generates the existing CLI. Local typecheck, build/output comparison and 76 tests passed. The rebuilt tracked demo is byte-identical. A TypeScript CLI test verifies invalid map/JSONL input preserves existing output, rejects input/output collisions and non-HTML output, and renders complete embedded assets from outside the repository. Browser scripts are unchanged; browser interaction checks were not rerun. Windows/Linux Node 18/24 CI remains the merge gate. Pending constraint-inspection work from other tasks is excluded.\n\nValidator batch (#10): `src/validate.mts` owns semantic validation and the CLI, emitting the existing `scripts/validate.mjs` entry point. External map/event values remain unknown until schema validation. Diagnostics, options, translation fields, constraints and collaboration locks are typed. Existing semantic/render tests plus a TypeScript CLI test cover schema rejection, malformed JSONL, usage errors and execution outside the repository. Browser code and unrelated pending constraint additions are excluded.\n\nStage 1 inventory: owns `src/contracts/`, emitted `scripts/contracts/`, schema export/build checks and contract parity/type tests. Shared `schemas/`, `scripts/validate.mjs` and package files receive only the migration integration. Uncommitted constraint additions remain in the original workspace and are excluded from this PR. The mutation corpus compares runtime and exported schemas with pre-migration schemas and checks input non-mutation. It is not an exhaustive proof of equivalence. Browser code and the frozen public benchmark are not migrated in this batch; cross-platform execution remains a CI gate.\n\nStage 1 snapshot verification before PR integration: typecheck, build, generated-output comparison and 72 tests passed in an isolated committed snapshot. The isolated PR contains 23 documentation pairs. Browser tests were not run for this contract-only batch. The PR's Windows/Linux Node 18/24 matrix must pass before merging.\n\nIntegration: PR #7 passed Windows/Linux Node 18/24 CI and was merged. The next batch migrates `check-docs` and `check-build`, retaining their command paths and distributing generated JavaScript. Two TypeScript integration tests passed locally: documentation drift/invalid records do not overwrite the saved record; a real compiler build detects stale and missing artifacts. Strict typecheck, build and output comparison also passed. The new test compilation output is ignored; remaining tests and browser code still await migration. PR checks remain required before merging this batch.\n\nSite/bootstrap batch (#20): website language switching and installation/copy flows now live in `src/site/main.mts`; the template theme bootstrap is generated from `src/viewer/theme.mts`. Local browser checks compared 12 desktop/mobile, language and agent combinations: identical full-page screenshots and commands, with copy success/failure and no page errors. Existing styles and text are unchanged. Remaining test migration and clean-distribution audit follow separately.\n\nFinal migration gates (#22): all maintained test sources are now strict TypeScript. Typed fixture loaders validate JSON before use; deliberate invalid mutations remain runtime tests. Tests compile into ignored `.test-build/` and import shipped JS, preserving CLI main guards. Local verification passed 80 tests, all five Chromium suites (viewer, guide, constraints, viewport, site), typecheck, reproducible build, examples, documentation and a committed source archive installation. The archive used fresh dependencies, ran doctor and setup/uninstall for Codex, Claude Code and DeepSeek before any build, then reproduced artifacts. npm audit reported zero vulnerabilities. The final demo is unchanged by this batch.\n\n`build-artifacts.json` is the explicit distribution inventory: every JS file in scripts/assets/docs is generated from `src/**/*.mts`; exchange schemas are generated from the TypeBox contracts. After migration acceptance, the frozen routing/i18n implementations and v1 schema copies were removed. Current behavioral tests and runtime/exported-schema consistency checks remain. No JS implementation or test remains as a transitional source. CI gates cover Windows/Linux Node 18/24, source archive installation, and Linux Node 24 Chromium. Static visual parity was established in earlier batches; it does not prove every possible interaction. The original dirty workspace and ongoing evaluation snapshots are excluded. No tag or release is created by this migration.\n\n[CI verification](https://github.com/Qiuner/birdview/actions/runs/35326765780) of final code commit `a8fb911` passed: Windows/Linux Node 18/24 completed unit tests, documentation/examples and clean archive installation; all five Linux Chromium browser suites passed. PR #23 delivers the migration and closes Issue #22."},"source-f62b15c078d22eb7-s1":{"body":"来源：`.agents/skills/birdview/docs/typescript-migration.md:1-6`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n# Full TypeScript migration work plan\n\n[中文](typescript-migration.zh.md)\n\nStatus: CLI and canonical contracts implemented; remaining stages pending. The user has authorized atomic commits, issues, linked PRs and merging after checks. This document authorizes no additional product behavior or release.\n"},"source-f62b15c078d22eb7-s2":{"body":"来源：`.agents/skills/birdview/docs/typescript-migration.md:7-12`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Goal and scope\n\nMake TypeScript the maintained source language for first-party executable code: Node commands, validation, rendering, browser interactions, repository tools and tests. CSS, HTML, Markdown and JSON/JSONL data remain appropriate formats. Distributed JavaScript is generated output, not a second implementation.\n\nThe migration should improve data contracts, state modeling and change safety. It is not a framework rewrite, a performance claim or evidence of better AI coding scores. Preserve frozen evaluation artifacts and existing benchmark runs.\n"},"source-f62b15c078d22eb7-s3":{"body":"来源：`.agents/skills/birdview/docs/typescript-migration.md:13-19`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Baseline and work isolation\n\n- `e04b808` migrated the mode CLI to `src/birdview.mts`, generating `scripts/birdview.mjs`. Strict checking, build verification and CI integration already exist.\n- The initial temporary `src/render.d.mts` declaration is replaced by the real `src/render.mts` implementation in issue #12.\n- The working tree also contains separate constraint, website and evaluation work. These changes are not part of this migration. Do not stage, overwrite or revert them. Coordinate ownership before migrating shared files such as `scripts/render.mjs`, `scripts/validate.mjs`, schemas and `package.json`.\n- Before each stage, record its base commit, relevant pending changes, owned files and commands that currently pass. Do not label another task's unfinished code a migration regression.\n"},"source-f62b15c078d22eb7-s4":{"body":"来源：`.agents/skills/birdview/docs/typescript-migration.md:20-41`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Target structure and decisions\n\n```text\nsrc/\n  contracts/         runtime definitions and inferred domain types\n  core/              semantic validation and pure layout/state logic\n  node/              CLI, rendering, Git inspection and repository tools\n  viewer/            browser entry, interactions, state and DOM code\ntest/                 TypeScript unit, integration and browser tests\nscripts/*.mjs         distributed Node entry points and supporting output\nassets/viewer.js      generated browser bundle embedded into standalone HTML\nschemas/*.json        generated exchange schemas, if retained for consumers\n```\n\nMove the existing CLI into this layout only when output mapping is ready; keep its public path working throughout. Node ESM and browser DOM need separate TypeScript configurations. Share domain types through explicit imports, not ambient globals.\n\nUse a TypeScript runtime-schema definition as the canonical structural contract. Stage 1 selected TypeBox 0.34.41 with the existing Ajv 8.20.0 validator instead of the initial Zod candidate: it directly represents existing `uniqueItems`, `dependentRequired`, pattern-property and strict-object rules. Infer types from the definitions. Generate published JSON Schema from them; do not hand-maintain parallel definitions. JSON/JSONL remains the AI-facing exchange format. Literal unions export as `anyOf` instead of `enum`; accepted JSON is compared with the old schemas, while detailed Ajv message wording/count may differ. Existing public schema IDs and definition anchors remain available. The existing date-time annotation-only policy is unchanged.\n\nKeep cross-record and repository checks as explicit semantic validation: schema revision binding, ownership, event order, constraint references and Git comparisons do not become true merely because an object has a TS type. Parse external input as `unknown`, validate it, then narrow it. Separate wire data from UI state and computed layout.\n\nUse `tsc` for strict checking and Node output. Use a small browser bundler, preferably esbuild after compatibility verification, to turn explicit imports into one self-contained script. Inline that script into the generated HTML; opening via `file://` must not require a server, CDN or runtime module fetch. Do not introduce a UI framework solely for this migration.\n"},"source-f62b15c078d22eb7-s5":{"body":"来源：`.agents/skills/birdview/docs/typescript-migration.md:42-43`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n## Stages and acceptance\n"},"source-f62b15c078d22eb7-s6":{"body":"来源：`.agents/skills/birdview/docs/typescript-migration.md:44-51`\n\n约束来源图 / Constraint source graph。原文章节尚需适用性审查；节点数不是有效规则数。vN 仅表示来源文件的 Git 历史版本数，时间是文件最后修改时间。灰点表示尚未完成语义核验，不代表代码有误。\n\n### 0. Freeze the migration baseline\n\n- Inventory maintained scripts, browser entry points, tests, inline scripts in templates/site pages and release assets. Classify experimental previews separately; migrate only if they are accepted as maintained product code.\n- Capture CLI exit behavior, exported functions, valid/invalid fixtures, multilingual views and standalone HTML behavior.\n- Resolve shared-file ownership with on
